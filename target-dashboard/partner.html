<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渠道服务商视图 · 靶向客户监控看板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="wrap">
  <div class="page-head">
    <h1>渠道服务商视图 <span class="period" id="agentTag">-</span></h1>
    <p id="pgSub"></p>
  </div>

  <!-- ① KPI -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- ② 代理商业绩排名（名下单表格） +  行业分布柱状图 -->
  <div class="card-row" style="margin-top:8px">
    <div class="card">
      <h2>代理商业绩排名 <span class="tag brand" id="rankTag">-</span></h2>
      <div class="sub">名下客户按 QTD 消耗排序 · 点击客户进入详情</div>
      <div id="partnerRank"></div>
    </div>
    <div class="card">
      <h2>名下客户行业分布</h2>
      <div class="sub">名下客户在各二级行业的消耗占比</div>
      <div id="partnerIndustry"></div>
    </div>
  </div>

  <!-- ③ 建议清单 -->
  <div class="card" style="margin-top:8px">
    <h2>需优先介入 · Top 建议</h2>
    <div class="sub">规则引擎输出 · 按优先级 P0 → P2 排序</div>
    <div id="allAdvice"></div>
  </div>

  <!-- ④ 名下客户健康度总表（前 5 + 更多） -->
  <div class="card" style="margin-top:8px">
    <h2>名下客户健康度</h2>
    <div class="sub" id="partnerCustSub"></div>
    <div id="customerTbl"></div>
    <div id="moreBtn" style="margin-top:14px;text-align:center"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
(async()=>{
  await initTopbar("partner");
  render();
})();

let showAll = false;

async function render(){
  const d = await loadData();
  const list = filterByRole(d.customers, window.ROLE);
  list.forEach(refreshAdvice);
  const isPartnerView = window.ROLE.type === "partner";
  const scope = isPartnerView ? "仅展示名下客户" : "展示全量客户";
  document.getElementById("agentTag").textContent = window.ROLE.label;
  document.getElementById("pgSub").textContent = `身份：${window.ROLE.label} · ${scope} · 大盘对标已脱敏`;

  /* KPI */
  const consume = list.reduce((s,c)=>s+c.consume,0);
  const gmv = list.reduce((s,c)=>s+c.gmv,0);
  const roi = consume>0? gmv/consume:0;
  const advCount = list.reduce((s,c)=>s+(c.advice?.length||0),0);
  const p0p1 = list.filter(c=>(c.advice||[]).some(a=>a.level==="P0"||a.level==="P1")).length;

  document.getElementById("kpiGrid").innerHTML = `
    <div class="kpi k-brand"><div class="kpi-label">${isPartnerView?"名下":"可见"}客户</div>
      <div class="kpi-val">${list.length}<span class="unit">家</span></div>
      <div class="kpi-hint">${list.filter(c=>c.consume>=100).length} 家活跃</div></div>
    <div class="kpi k-info"><div class="kpi-label">合计消耗</div>
      <div class="kpi-val">${fmtMoney(consume)}<span class="unit">元</span></div>
      <div class="kpi-hint">占靶向大盘 ${d.overall.consume>0?(consume/d.overall.consume*100).toFixed(1):0}%</div></div>
    <div class="kpi k-brand"><div class="kpi-label">合计 GMV</div>
      <div class="kpi-val">${fmtMoney(gmv)}<span class="unit">元</span></div>
      <div class="kpi-hint">来自广告归因</div></div>
    <div class="kpi ${roi>=3?'k-ok':'k-warn'}"><div class="kpi-label">综合 ROI</div>
      <div class="kpi-val">${fmtNum(roi,2)}</div>
      <div class="kpi-hint">${roi>=3?'<span class="up">达标 ≥ 3.0</span>':'<span class="dn">低于 3.0</span>'}</div></div>
    <div class="kpi ${p0p1>0?'k-danger':'k-ok'}"><div class="kpi-label">需介入客户</div>
      <div class="kpi-val">${p0p1}<span class="unit">/${list.length}</span></div>
      <div class="kpi-hint">共 ${advCount} 条建议待落实</div></div>
  `;

  /* 代理商业绩排名（前 8 + 跳转） */
  const sortedList = list.slice().sort((a,b)=>b.consume-a.consume);
  const top8 = sortedList.slice(0, 8);
  document.getElementById("partnerRank").innerHTML = top8.length ? `
    <table class="tbl">
      <thead><tr>
        <th class="num">#</th><th>客户主体</th><th class="num">消耗</th><th class="num">GMV</th><th>ROI</th><th class="num">广告数</th>
      </tr></thead>
      <tbody>${top8.map((c,i)=>`<tr onclick="location.href='detail.html?sub=${encodeURIComponent(c.sub)}'" style="cursor:pointer">
        <td class="num">${i+1}</td>
        <td class="sub-name">${c.sub}<div class="meta">${c.industry}</div></td>
        <td class="num">${fmtMoney(c.consume,1)}</td>
        <td class="num">${fmtMoney(c.gmv,1)}</td>
        <td>${roiTag(c.roi)}</td>
        <td class="num">${fmtInt(c.ads)}</td>
      </tr>`).join("")}</tbody>
    </table>
  ` : '<div class="empty">当前服务商暂无客户</div>';

  /* 行业分布柱状图（垂直柱状图，不用饼图） */
  const indMap = {};
  list.forEach(c=>{ indMap[c.industry] = (indMap[c.industry]||0) + c.consume; });
  document.getElementById("partnerIndustry").innerHTML = renderIndustryBarsP(indMap, consume);

  /* Top 建议 */
  const flat = [];
  list.forEach(c=>(c.advice||[]).forEach(a=>flat.push({...a,sub:c.sub, industry:c.industry})));
  const rank={P0:0,P1:1,P2:2};
  flat.sort((a,b)=>(rank[a.level]||9)-(rank[b.level]||9));
  document.getElementById("allAdvice").innerHTML = flat.length ? `
    <div class="advice">${flat.slice(0,6).map(a=>`
      <div class="advice-item ${a.level.toLowerCase()}">
        <div class="advice-head">
          <span class="level">${a.level}</span>
          <span class="tag-name">${a.tag}</span>
          <a href="detail.html?sub=${encodeURIComponent(a.sub)}">${a.sub} →</a>
        </div>
        <div class="advice-reason">${a.reason}</div>
        <div class="advice-action">建议 · <b>${a.action}</b></div>
      </div>`).join("")}</div>
    ${flat.length>6?`<div class="hint" style="margin-top:8px">共 ${flat.length} 条建议 · 展示前 6 条</div>`:''}
  ` : '<div class="empty">✓ 当前视图暂无优化建议</div>';

  /* 名下客户健康度总表（前 5 + 更多） */
  const SHOW_N = 5;
  const showList = showAll ? sortedList : sortedList.slice(0, SHOW_N);
  document.getElementById("customerTbl").innerHTML = showList.length
    ? `<div class="cg-grid">${showList.map(c=>customerGridCard(c)).join("")}</div>`
    : '<div class="empty">当前视图无客户数据</div>';

  document.getElementById("partnerCustSub").textContent = showAll
    ? `展示全部 ${list.length} 家客户 · 按 QTD 消耗排序 · 点击进入详情`
    : `按 QTD 消耗排序 · 展示前 ${Math.min(SHOW_N, sortedList.length)} / ${sortedList.length} 家 · 点击"更多"展开全部`;

  document.getElementById("moreBtn").innerHTML = sortedList.length > SHOW_N ? `
    <button class="btn ghost" id="toggleMore">${showAll ? '收起 ▲' : `展开全部 ${sortedList.length} 家 ▼`}</button>
  ` : '';
  const tog = document.getElementById("toggleMore");
  if(tog) tog.onclick = ()=>{ showAll = !showAll; render(); };
}

/* 服务商视图专用的行业分布：垂直柱状图（紧凑版） */
function renderIndustryBarsP(map, total){
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  if(!arr.length) return '<div class="empty">无数据</div>';
  const max = arr[0][1] || 1;
  return `<div class="ind-p-list">${arr.map(([n,v])=>`
    <div class="ind-p-row">
      <span class="ind-p-name"><i style="background:${industryColor(n)}"></i>${n}</span>
      <div class="ind-p-track">
        <div class="ind-p-fill" style="width:${(v/max*100).toFixed(1)}%;background:${industryColor(n)}"></div>
      </div>
      <span class="ind-p-val">${fmtMoney(v,1)}<small>${(v/total*100).toFixed(1)}%</small></span>
    </div>
  `).join("")}</div>`;
}
</script>
</body>
</html>
