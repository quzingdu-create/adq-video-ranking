<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>靶向客户监控看板 · 总览</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="wrap">
  <div class="page-head">
    <h1>靶向客户投放监控 <span class="period">数据周期 qtd (7.1 - 9.1)</span></h1>
    <p><span id="dataSummary"><span id="ds-act">-</span> 家伙伴在投 · 覆盖 <span id="ds-ind">-</span> 个二级行业 · 数据周期 qtd (7.1 - 9.1)</span></p>
  </div>

  <!-- ① KPI（用 list 随筛选变）+ 右上角浮动过滤器 -->
  <div class="kpi-section">
    <div class="kpi-grid" id="kpiGrid"></div>
    <div class="filter-floater" id="filterFloater">
      <button class="filter-btn" id="filterBtn" type="button">
        <span class="filter-icon">⌘</span>
        <span class="filter-btn-body">
          <span class="filter-btn-title" id="filterTitle">全部客户</span>
          <span class="filter-btn-sel" id="filterSelected">未设筛选 · ${all.length} 家</span>
        </span>
        <span class="filter-caret">▾</span>
      </button>
      <div class="filter-panel" id="filterPanel">
        <div class="filter-tabs" id="viewTabs">
          <button class="view-tab on" data-view="industry">行业视角</button>
          <button class="view-tab" data-view="agent">服务商视角</button>
          <button class="view-tab" data-view="sales">销售视角</button>
        </div>
        <div class="filter-section">
          <div class="filter-chips" id="viewChips"></div>
        </div>
        <div class="filter-footer">
          <button class="filter-clear" id="filterClear" type="button">清除全部</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ② 趋势折线图（2 张：大盘 + 客户，按客户多选） -->
  <div class="card-row" style="margin-top:8px">
    <div class="card">
      <h2>① 服饰中心大盘 vs 靶向客户日耗走势</h2>
      <div class="sub" id="dashboardTrendSub">最近 8 天</div>
      <div id="dashboardTrend"></div>
    </div>
    <div class="card">
      <h2>② 客户日均消耗趋势（按筛选）</h2>
      <div class="sub">当前筛选下的客户 · 每日日均消耗（2026-08-26 ~ 2026-09-01）</div>
      <div id="customerTrend"></div>
    </div>
  </div>

  <!-- ③ Top 建议 + 行业消耗（卡 row 上移，在客户表上面） -->
  <div class="card-row" style="margin-top:8px">
    <div class="card">
      <h2>需优先介入 · Top 建议</h2>
      <div class="sub">规则引擎输出 · 按优先级 P0 → P2 排序</div>
      <div id="topAdvice"></div>
    </div>
    <div class="card">
      <h2>行业消耗结构</h2>
      <div class="sub">靶向客户在各二级行业的消耗分布（饼图）</div>
      <div id="industryDist"></div>
    </div>
  </div>

  <!-- ④ 客户健康度总表（前 5 + 更多按钮） -->
  <div class="card" style="margin-top:8px">
    <h2>客户健康度总表</h2>
    <div class="sub" id="custSummarySub">按消耗排序 · 默认展示前 5 家 · 点击"更多"展开全部</div>
    <div id="customerTbl"></div>
    <div id="moreBtn" style="margin-top:14px;text-align:center"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
(async()=>{
  await initTopbar("index");
  // 过滤浮动按钮全局交互（每个页面只绑一次）
  const fb = document.getElementById("filterBtn");
  const fp = document.getElementById("filterPanel");
  fb.onclick = e => { e.stopPropagation(); fp.classList.toggle("open"); fb.classList.toggle("open"); };
  document.addEventListener("click", e => { if(!document.getElementById("filterFloater").contains(e.target)){ fp.classList.remove("open"); fb.classList.remove("open"); } });
  document.getElementById("filterClear").onclick = ()=>{ currentViewSel.clear(); showAll=false; render(); };
  // 视角 tab 切换
  document.getElementById("viewTabs").addEventListener("click", e => {
    const t = e.target.closest("[data-view]");
    if(!t) return;
    currentView = t.dataset.view;
    currentViewSel.clear();
    showAll=false; render();
  });
  // 视角下的 chip 点击
  document.getElementById("viewChips").addEventListener("click", e => {
    const b = e.target.closest("[data-fkey]");
    if(!b) return;
    const v = b.dataset.fkey;
    if(v==="__all__") currentViewSel.clear();
    else if(currentViewSel.has(v)) currentViewSel.delete(v);
    else currentViewSel.add(v);
    showAll=false; render();
  });
  document.getElementById("agentChips")?.parentElement?.remove();  // 旧 agent 块删除
  render();
})();

let currentView = 'industry';         // 视角：industry / agent / sales
let currentViewSel = new Set();       // 当前视角下选中的项（多选交集）
let showAll = false;

async function render(){
  const d = await loadData();
  const all = filterByRole(d.customers, window.ROLE);
  all.forEach(refreshAdvice);

  // 🔴 顶部副标题动态绑定 meta 真实数据（防呆：不要硬编码 26 家/6 个行业）
  const ov = d.overall || {};
  const actEl = document.getElementById('ds-act');
  const indEl = document.getElementById('ds-ind');
  if(actEl) actEl.textContent = ov.active_count != null ? ov.active_count : '?';
  if(indEl) indEl.textContent = ov.industry_count != null ? ov.industry_count : '?';
  // KPI 标签也同步
  const periodEl = document.getElementById('dataPeriod');
  if(periodEl) periodEl.textContent = '数据周期 ' + (d.meta && d.meta.data_period || 'qtd (7.1 - 9.1');

  // 视角 chip 渲染
  const tabs = document.querySelectorAll('.view-tab');
  tabs.forEach(t => t.classList.toggle('on', t.dataset.view === currentView));
  let chipsHtml = '';
  if(currentView === 'industry'){
    const inds = [...new Set(all.map(c=>c.industry))];
    chipsHtml = `<button class="chip ${currentViewSel.size===0?'on':''}" data-fkey="__all__">全部</button>`
      + inds.map(i=>`<button class="chip ${currentViewSel.has(i)?'on':''}" data-fkey="${i}">${i}</button>`).join('');
  } else if(currentView === 'agent'){
    // v2.6：已接入代理商政策集团对应（154421 副本 csv）
    const agents = (d.overall && d.overall.agents) || [];
    chipsHtml = `<button class="chip ${currentViewSel.size===0?'on':''}" data-fkey="__all__">全部</button>`
      + agents.map(a=>`<button class="chip ${currentViewSel.has(a)?'on':''}" data-fkey="${a}">${a}</button>`).join('');
  } else if(currentView === 'sales'){
    const sales = [...new Set(all.map(c=>c.sales).filter(Boolean))];
    chipsHtml = `<button class="chip ${currentViewSel.size===0?'on':''}" data-fkey="__all__">全部</button>`
      + sales.map(s=>`<button class="chip ${currentViewSel.has(s)?'on':''}" data-fkey="${s}">${s}</button>`).join('');
  }
  document.getElementById("viewChips").innerHTML = chipsHtml;

  // 应用筛选（交集）
  const list = all.filter(c=>{
    if(currentViewSel.size>0){
      const sel = [...currentViewSel];
      if(currentView==='industry' && !sel.includes(c.industry)) return false;
      else if(currentView==='agent' && !sel.includes(c.agent)) return false;
      else if(currentView==='sales' && !sel.includes(c.sales)) return false;
    }
    return true;
  });

  /* 筛选按钮：把已选项完整列出来 */
  (function(){
    const sel = [...currentViewSel];
    const viewName = {industry:'行业',agent:'服务商',sales:'销售'}[currentView];
    const parts = [];
    if(sel.length) parts.push(`${viewName}: ${sel.join(", ")}`);
    const btn   = document.getElementById("filterBtn");
    const title = document.getElementById("filterTitle");
    const selEl = document.getElementById("filterSelected");
    if(parts.length){
      btn.classList.add("has-filter");
      title.textContent = `已筛选 ${list.length} / ${all.length} 家`;
      selEl.textContent = `${parts[0]} · 视角：${viewName}`;
      selEl.title = parts.join("  ·  ");
    } else {
      btn.classList.remove("has-filter");
      title.textContent = "全部客户";
      selEl.textContent = `未设筛选 · ${all.length} 家`;
      selEl.title = "";
    }
  })();

  /* KPI —— 双周期数据展示（子青 9.3 拍板）
   - 8.28-9.1（指标明细 csv 78 客户 26 万元）
   - qtd（通用分析数据集大盘 401 万元） */
  const k = d.overall.kpi || {};
  const k828 = k.period_8_28_9_1 || {};
  const kqtd = k.period_qtd || {};
  const consume = list.reduce((s,c)=>s+c.consume,0);
  const gmv = list.reduce((s,c)=>s+c.gmv,0);
  const active = list.filter(c=>c.consume>=100).length;
  const silent = list.filter(c=>c.consume<100).length;
  const highRisk = list.filter(c=> (c.advice||[]).some(a=>a.level==="P0"||a.level==="P1")).length;

  document.getElementById("kpiGrid").innerHTML = `
    <div class="kpi k-brand">
      <div class="kpi-label">当前筛选消耗 <span class="tag brand">8.28-9.1</span></div>
      <div class="kpi-val">¥${consume.toLocaleString('zh-CN',{maximumFractionDigits:0})}<span class="unit">元</span></div>
      <div class="kpi-hint">${list.filter(c=>c.consume>0).length} 家伙伴在投 · 跟随筛选变化</div></div>
    <div class="kpi k-info">
      <div class="kpi-label">大盘全平台 QTD <span class="tag">qtd</span></div>
      <div class="kpi-val">¥${kqtd.total_wan||0}<span class="unit">万</span></div>
      <div class="kpi-hint">${kqtd.period||'QTD'} · 通用分析数据集（大盘/不随筛选）</div></div>
    <div class="kpi ${silent>0?'k-warn':'k-ok'}">
      <div class="kpi-label">在投 / 待起量</div>
      <div class="kpi-val">${active}<span class="unit">/${silent}</span></div>
      <div class="kpi-hint">${silent>0?'未起量客户需优先介入':'全部已起量'}</div></div>
    <div class="kpi k-danger">
      <div class="kpi-label">高风险客户</div>
      <div class="kpi-val">${highRisk}<span class="unit">家</span></div>
      <div class="kpi-hint">带 P0/P1 建议 · 跟随筛选</div></div>
  `;

  /* Top 建议 —— 按"建议规则"去重，下方列客户清单
     同一规则（tag）下客户只列简称，不再每家客户复读一次 reason */
  const flat = [];
  list.forEach(c=>{
    (c.advice||[]).forEach(a=>{ flat.push({...a, sub:c.sub, industry:c.industry, agent:c.agent}); });
  });
  const rank = {P0:0, P1:1, P2:2};
  flat.sort((a,b)=>(rank[a.level]||9)-(rank[b.level]||9));
  // 按 tag 聚合（同类建议合并）
  const byTag = {};
  flat.forEach(a=>{
    const k = a.tag + '|' + a.level;
    if(!byTag[k]) byTag[k] = {...a, subs:[], actions:new Set()};
    byTag[k].subs.push(a.sub);
    byTag[k].actions.add(a.action);
  });
  const merged = Object.values(byTag).sort((a,b)=>(rank[a.level]||9)-(rank[b.level]||9));
  const grouped = {};
  merged.forEach(a=>{
    const c = a.category || '其他';
    (grouped[c]=grouped[c]||[]).push(a);
  });
  const orderedCats = ADVICE_CATEGORIES.filter(c=>grouped[c]);
  document.getElementById("topAdvice").innerHTML = orderedCats.length ? `
    ${orderedCats.map(cat=>{
      const items = grouped[cat];
      const desc = CATEGORY_DESC[cat] || {icon:'·', hint:''};
      return `<div class="cat-group">
        <div class="cat-head">
          <span class="cat-icon">${desc.icon}</span>
          <span class="cat-name">${cat}</span>
          <span class="cat-count">${items.length} 类问题</span>
        </div>
        <div class="cat-items">${items.map(a=>`
          <div class="cat-rule ${a.level.toLowerCase()}">
            <div class="cat-rule-head">
              <span class="cat-item-name">${a.tag}</span>
              <span class="cat-item-level lv-${a.level.toLowerCase()}">${a.level}</span>
              <span class="cat-item-count">${a.subs.length} 家</span>
            </div>
            <div class="cat-rule-action">▸ ${[...a.actions][0]}</div>
            <div class="cat-rule-subs">受影响客户：${a.subs.map(s=>`<a class="cat-sub-link" href="detail.html?sub=${encodeURIComponent(s)}" title="${s}">${s}</a>`).join(' · ')}${a.subs.length>5?` 等 ${a.subs.length} 家`:''}</div>
          </div>`).join('')}</div>
      </div>`;
    }).join('')}
    <div class="hint" style="margin-top:10px">共 ${flat.length} 条建议 · 已按规则去重 · 共 ${merged.length} 类问题</div>
  ` : '<div class="empty">当前筛选下暂无建议</div>';

  /* 行业消耗 —— 饼图，用 list */
  const indMap = {};
  list.forEach(c=>{ indMap[c.industry] = (indMap[c.industry]||0) + c.consume; });
  document.getElementById("industryDist").innerHTML = Object.keys(indMap).length
    ? `<div class="ind-pie-wrap">${renderIndustryPie(indMap, consume, d.industry_benchmark)}</div>
      <div class="ind-d-wrap"><div class="sub" style="margin:14px 0 6px">行业明细</div>${renderIndustryDetail(indMap, consume, d.industry_benchmark)}</div>`
    : '<div class="empty">无数据</div>';

  /* ① qtd by 天双线（大盘 + 客户合计） */
  const dashRows = (d.qtd_dashboard_trend||[]);
  const targetRows = (d.qtd_target_trend||[]);
  document.getElementById("dashboardTrendSub").textContent =
    dashRows.length ? `qtd · ${dashRows.length} 天 · 大盘 vs 靶向合计（全量、不随筛选）` : '数据缺失';
  document.getElementById("dashboardTrend").innerHTML = dashRows.length
    ? renderDualLineChart(dashRows, targetRows, {w:620,h:210})
    : '<div class="empty">大盘数据待上传</div>';

  /* ② 客户趋势折线（按 list 排序取前 5） */
  const top5 = list.filter(c=>c.consume>0).slice().sort((a,b)=>b.consume-a.consume).slice(0,5);
  const series = top5.map(c=>{
    const pts = (d.customers_trend && d.customers_trend[c.sub]) || [];
    return {name:c.alias||c.sub.slice(0,6), data:pts.filter(r=>r.date!=='整体')};
  }).filter(s=>s.data.length>0);
  document.getElementById("customerTrend").innerHTML = series.length
    ? renderMultiLineChart(series, {w:620,h:220})
    : '<div class="empty">当前筛选下客户暂无趋势数据</div>';

  /* 客户健康度总表 —— Card Grid 前 5 + 更多 */
  const SHOW_N = 5;
  const sortedList = list.slice().sort((a,b)=>b.consume-a.consume);
  const showList = showAll ? sortedList : sortedList.slice(0, SHOW_N);
  document.getElementById("customerTbl").innerHTML = showList.length
    ? `<div class="cg-grid">${showList.map(c=>customerGridCard(c)).join("")}</div>`
    : '<div class="empty">当前筛选下无客户</div>';

  document.getElementById("custSummarySub").textContent = showAll
    ? `展示全部 ${list.length} 家客户 · 按消耗排序 · 点击客户主体进入诊断详情`
    : `按消耗排序 · 展示前 ${Math.min(SHOW_N, sortedList.length)} / ${sortedList.length} 家 · 点击"更多"展开全部`;

  document.getElementById("moreBtn").innerHTML = sortedList.length > SHOW_N ? `
    <button class="btn ghost" id="toggleMore">${showAll ? '收起 ▲' : `展开全部 ${sortedList.length} 家 ▼`}</button>
  ` : '';
  const tog = document.getElementById("toggleMore");
  if(tog) tog.onclick = ()=>{ showAll = !showAll; render(); };
}
</script>
</body>
</html>
