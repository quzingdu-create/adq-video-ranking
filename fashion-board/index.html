<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>女装童装选品榜单</title>
<style>
:root {
  --bg:#f4f7fb;
  --panel:#ffffff;
  --line:#d8e2f0;
  --text:#11243e;
  --sub:#526b90;
  --brand:#2f66ff;
  --brand-2:#4b7dff;
  --brand-3:#7aa3ff;
  --soft:#e9f0ff;
  --ok:#0f9d8a;
  --warn:#e67e22;
  --bad:#d64545;
  --shadow:0 8px 24px rgba(22,58,120,.08);
  --cloud-c1:#2f66ff;
  --cloud-c2:#14b8a6;
  --cloud-c3:#f59e0b;
  --cloud-c4:#ef4444;
  --cloud-c5:#8b5cf6;
  --accent-1:#ff6b6b;
  --accent-2:#ffd166;
  --accent-3:#06d6a0;
  --accent-4:#4cc9f0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
.wrap{max-width:1580px;margin:0 auto;padding:18px 24px 36px}

.hero{background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 45%,#60a5fa 100%);border-radius:18px;padding:22px 24px;color:#fff;box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:31px;letter-spacing:1px}
.hero .sub{margin-top:6px;color:#dbeafe;font-size:13px}
.hero .period{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:12.5px;font-weight:700}
.hero .period::before{content:'';width:7px;height:7px;border-radius:50%;background:#7CFFB2;box-shadow:0 0 6px #7CFFB2}

.main-tabs{display:flex;gap:10px;margin:14px 0 14px;flex-wrap:wrap}
.main-tab{padding:10px 18px;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--sub);font-size:16px;font-weight:850;cursor:pointer;transition:.2s}
.main-tab:hover{border-color:var(--brand);color:var(--brand)}
.main-tab.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(47,102,255,.28)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 4px 14px rgba(21,42,90,.06)}

.top-grid{display:grid;grid-template-columns:1.05fr 1fr 1fr 1.55fr;gap:10px;margin-bottom:14px}
.top-card{border:1.5px solid #dce6f6;border-radius:11px;padding:11px 12px}
.top-card.t-trend{background:linear-gradient(135deg,#eef4ff,#dfeaff)}
.top-card.t-price{background:linear-gradient(135deg,#fff6ee,#ffe8d6)}
.top-card.t-age{background:linear-gradient(135deg,#eaf7f1,#d6f0e3)}
.top-card.t-cloud{background:linear-gradient(135deg,#f7efff,#ece4ff)}
.top-title{font-size:13px;color:var(--sub);font-weight:800;margin-bottom:5px}
.top-value{font-size:16px;color:#1d4ed8;font-weight:900;line-height:1.4}
.top-cloud{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;min-height:88px;padding-top:4px}
.top-cloud .kw{display:inline-block;line-height:1;font-weight:900}

.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.cat-tab{padding:6px 12px;border-radius:9px;border:1px solid #d7e2f5;background:#f7faff;color:#40618f;font-size:12.5px;font-weight:800;cursor:pointer}
.cat-tab.active{background:#2f66ff;color:#fff;border-color:#2f66ff}

.cat-summary{background:linear-gradient(135deg,#f9fbff,#f1f6ff);border:1.5px solid #d8e4f8;border-radius:12px;padding:13px 14px;margin-bottom:12px}
.cat-title{font-size:19px;font-weight:900;margin-bottom:8px;color:#13366d}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;margin-bottom:10px}
.m-item{background:#fff;border:1px solid #e1e8f5;border-radius:8px;padding:7px 8px;text-align:center}
.m-item .k{font-size:11px;color:#6c82a6}
.m-item .v{font-size:16px;font-weight:850;color:#12345f}

.cat-panes{display:grid;grid-template-columns:1fr 1fr 1.05fr 1.1fr;gap:10px;margin-top:6px}
.cat-panes.two{grid-template-columns:1fr 1.2fr}
.cat-pane{background:#fff;border:1px solid #dbe6f7;border-radius:10px;padding:10px 12px;min-width:0}
.cat-pane h4{margin:0 0 6px;font-size:13px;color:#1d3c75;font-weight:900}
.pain-list{margin:0;padding-left:18px;color:#2d476f;font-size:12.5px;line-height:1.7}
.pain-list li{margin:2px 0}
.direction{margin:0;padding-left:18px;color:#2d476f;font-size:12.5px;line-height:1.7}
.direction li{margin:3px 0}
.cloud{margin:8px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;min-height:170px;padding:8px 6px;background:#fff;border:1px dashed #d6e2f8;border-radius:10px}
.cloud .kw{display:inline-block;line-height:1;font-weight:900}
.chain{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chain .chip{background:#eefcf7;border:1px solid #c2f2e3;color:#067a66;padding:3px 8px;border-radius:14px;font-weight:700}
.chart-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.chart-card{background:linear-gradient(135deg,#f9fbff,#eef4ff);border:1px solid #d8e4f8;border-radius:10px;padding:9px 10px}
.chart-title{font-size:12px;color:#4f6790;font-weight:800;margin-bottom:7px}
.bar-row{display:grid;grid-template-columns:96px 1fr 56px;gap:7px;align-items:center;margin:5px 0}
.bar-name{font-size:12px;color:#35547f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:10px;background:#e8f0ff;border-radius:999px;position:relative;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#2f66ff,#7ea6ff);border-radius:999px}
.bar-val{font-size:12px;color:#274f90;font-weight:800;text-align:right}
.chain-donut-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.donut{width:108px;height:108px;border-radius:50%;position:relative;flex:0 0 auto}
.donut-hole{position:absolute;inset:26px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#385a8f;font-size:11px;text-align:center;line-height:1.3;padding:4px}
.chain-legend{display:flex;flex-direction:column;gap:5px;min-width:140px;flex:1;min-width:0}
.chain-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#305384;font-weight:700;line-height:1.4}
.chain-blocks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.chain-block{border:1px solid #d8e4f8;border-radius:9px;padding:9px 10px;background:linear-gradient(135deg,#f9fbff,#eef4ff)}
.chain-block-max{background:linear-gradient(135deg,#1f4fb0,#2f66ff);border-color:#1f4fb0}
.chain-block-max .cb-name,.chain-block-max .cb-share{color:#fff}
.chain-block-max .cb-track{background:rgba(255,255,255,.28)}
.chain-block-max .cb-fill{background:#fff}
.cb-name{font-size:12px;color:#274f90;font-weight:800;margin-bottom:3px}
.cb-share{font-size:19px;font-weight:900;color:#12315f;line-height:1.1;margin-bottom:5px}
.cb-track{height:6px;background:#e6eefc;border-radius:999px;overflow:hidden}
.cb-fill{height:100%;background:linear-gradient(90deg,#2f66ff,#7ea6ff);border-radius:999px}
.chain-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}

/* AMS 品类x链路指标表 */
.ch-metric-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.ch-metric-table th{background:#eef3fc;color:#1d3c75;font-weight:800;padding:7px 10px;border-bottom:2px solid #c5d4ed;text-align:left;white-space:nowrap}
.ch-metric-table td{padding:6px 10px;border-bottom:1px solid #eef1f7;color:#3d4f6d;white-space:nowrap}
.ch-metric-table tr:hover td{background:#f5f9ff}
.ch-cat-row:hover td{background:#eef4ff !important}
.ch-sub-row:hover td{background:#eef3f9 !important}

.cards{display:grid;gap:10px}
.cards.cols-1{grid-template-columns:1fr}
.cards.cols-2{grid-template-columns:1fr 1fr}
.card{background:linear-gradient(135deg,#ffffff,#f8fbff);border:1.5px solid #dce6f6;border-radius:12px;padding:12px;transition:.2s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent-4),var(--brand),var(--accent-1));opacity:.9}
.card:hover{border-color:#8db0ff;box-shadow:0 8px 20px rgba(33,83,184,.12)}
.card-wrap{display:grid;grid-template-columns:1.6fr 0.4fr;gap:10px;align-items:stretch}
.cards.cols-2 .card-wrap{grid-template-columns:1.55fr 0.45fr;gap:8px}
.card-left{min-width:0}
.card-right{border:1px solid #d9e6ff;border-radius:10px;background:linear-gradient(135deg,#f8fbff,#eff5ff);padding:9px}
.cards.cols-2 .card-right{padding:7px}
.card-name{font-size:20px;font-weight:900;color:#12315f;line-height:1.35;margin-bottom:3px}
.cards.cols-2 .card-name{font-size:17px;line-height:1.3}
.meta-title{font-size:12px;color:#6a83a9;font-weight:800;margin-bottom:4px}
.meta-cards{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.meta-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:12px;background:#f2f7ff;border:1px solid #d6e5ff;color:#244a84;font-size:12px;font-weight:700;line-height:1.2}
.meta-chip b{color:#1a3f76}
.cards.cols-2 .meta-chip{font-size:11.5px;padding:3px 7px}
.metric{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:7px}
.metric .box{border:1px solid #dce6f6;border-radius:8px;padding:7px;background:linear-gradient(135deg,#fbfdff,#f4f8ff)}
.metric .box:nth-child(1){background:linear-gradient(135deg,#fff7f8,#ffeef1);border-color:#ffd2dd}
.metric .box:nth-child(2){background:linear-gradient(135deg,#fffaf0,#fff1d6);border-color:#ffe3a8}
.metric .box:nth-child(3){background:linear-gradient(135deg,#f2fffb,#e4fff5);border-color:#bbf7df}
.metric .box:nth-child(4){background:linear-gradient(135deg,#f3f9ff,#e9f2ff);border-color:#cfe0ff}
.metric .box:nth-child(5){background:linear-gradient(135deg,#f8f3ff,#f1e8ff);border-color:#dec9ff}
.metric .k{font-size:11px;color:#6f85a9}
.metric .v{font-size:18px;font-weight:850;color:#132f5f}

.points{border:1px solid #e7edf8;border-radius:8px;background:#fbfdff;padding:6px 8px}
.points .title{font-size:11.5px;color:#4b6286;font-weight:800;margin-bottom:4px}
.points .sp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px 8px}
.points .sp-card{background:#eff4fa;border-radius:4px;padding:1px 6px;display:inline-flex;align-items:center;gap:2px}
.points .sp-card .sp-k{font-size:10px;color:#6b85ab;font-weight:600}
.points .sp-card .sp-v{font-size:11px;color:#1a3a66;font-weight:700}
.points ol{margin:0;padding-left:18px;color:#1d3359}
.points li{margin:2px 0}

.material-title{font-size:12px;color:#4b6286;font-weight:800;margin-bottom:6px}
.material-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.material-unit{display:flex;flex-direction:column;gap:6px}
.material-thumb{position:relative;display:block;border-radius:10px;overflow:hidden;border:1px solid #c9dafd;background:#eaf2ff;aspect-ratio:3/4;min-height:150px}
.material-thumb img,.material-thumb video{width:100%;height:100%;object-fit:cover;display:block}
.material-tag{position:absolute;top:4px;left:4px;background:rgba(32,88,190,.92);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:800}
.material-links{display:flex;flex-direction:column;gap:6px}
.copy-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #cfe0ff;background:#fff;border-radius:7px;padding:5px 6px;color:#2155b6;font-size:11px;font-weight:700;cursor:pointer;line-height:1.2;white-space:nowrap;width:100%}
.copy-btn:hover{background:#edf4ff}
.material-empty{font-size:12px;color:#6c82a6;background:#fff;border:1px dashed #cfe0ff;border-radius:8px;padding:8px}

.cards.cols-2 .card-right .img-wrap{max-width:96px}
.cards.cols-2 .card-right img{width:100%;height:auto;display:block}

@media (max-width:1280px) {
  .top-grid{grid-template-columns:1fr 1fr}
  .cat-panes{grid-template-columns:1fr 1fr}
  .cards.cols-2{grid-template-columns:1fr}
}
@media (max-width:980px) {
  .top-grid{grid-template-columns:1fr}
  .cat-panes{grid-template-columns:1fr}
  .chart-wrap{grid-template-columns:1fr}
  .card-wrap{grid-template-columns:1fr}
  .metric{grid-template-columns:repeat(2,minmax(0,1fr))}
  .material-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card-name{font-size:18px}
  .cards.cols-2 .card-name{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>女装童装选品榜单</h1>
    <div class="sub">AMS投放爆品（女装+童装） / 视频号爆品 / 机会爆品（抖音）</div>
    <div class="period">数据周期：近 14 天</div>
  </div>

  <div class="main-tabs" id="mainTabs"></div>
  <div class="panel" id="contentPanel">加载中...</div>
</div>

<script>
const dataUrl = './data.json?v=1792464883';
let state = { tabKey: 'ams', category: '' };
let store = null;

function fmtMoney(v) {
  if (v === null || v === undefined) return '—';
  return '¥' + Number(v).toLocaleString('zh-CN', {maximumFractionDigits:1});
}
function fmtPct(v) {
  if (v === null || v === undefined) return '—';
  return Number(v).toFixed(1) + '%';
}
function fmtNum(v) {
  if (v === null || v === undefined) return '—';
  return Number(v).toFixed(2);
}
function fmtK(v) {
  if (v >= 10000) return (v/10000).toFixed(1) + 'w';
  if (v >= 1000) return (v/1000).toFixed(1) + 'k';
  return Math.round(v).toString();
}

function isVideoUrl(u) {
  if (!u) return false;
  const s = String(u).toLowerCase();
  return s.includes('.mp4') || s.includes('.mov') || s.includes('.m3u8');
}

function escAttr(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 素材视频降码率：adsmind 的 .f0.mp4 原始码率约 89MB/条，移动端会被海量请求拖垮。
// .f10 为低码率版本（约 1.8~5.8MB/条），仅在用户点击播放时才拉取（preload=none）。
function toSmallVideo(u) {
  return String(u).replace(/\.f0\.mp4$/i, '.f10.mp4');
}

function buildMaterialThumb(u, i) {
  const tag = `TOP${i+1}`;
  const safe = escAttr(u);
  if (isVideoUrl(u)) {
    const small = escAttr(toSmallVideo(u));
    // 真·懒加载：初始不带 src（0 请求），滚动进视口由 lazyVideoObserver 赋值 data-src 才拉取
    return `<a class="material-thumb" href="${safe}" target="_blank" onclick="event.preventDefault();"><span class="material-tag">${tag}</span><video data-src="${small}" muted loop playsinline webkit-playsinline preload="none" controls style="background:#000;"></video></a>`;
  }
  return `<a class="material-thumb" href="${safe}" target="_blank"><span class="material-tag">${tag}</span><img src="${safe}" referrerpolicy="no-referrer" loading="lazy" /></a>`;
}

// 进入视口才给 video 赋 src（移动端首屏 0 视频请求）
const lazyVideoObserver = ('IntersectionObserver' in window) ? new IntersectionObserver((entries, obs) => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    const v = en.target;
    const src = v.getAttribute('data-src');
    if (src) { v.src = src; v.removeAttribute('data-src'); v.muted = true; const pr = v.play(); if (pr && pr.catch) pr.catch(()=>{}); }
    obs.unobserve(v);
  });
}, { rootMargin: '300px' }) : null;

function observeLazyVideos(root) {
  const vids = (root || document).querySelectorAll('video[data-src]');
  if (!lazyVideoObserver) {
    vids.forEach(v => { const s = v.getAttribute('data-src'); if (s) { v.src = s; v.removeAttribute('data-src'); v.muted = true; const pr = v.play(); if (pr && pr.catch) pr.catch(()=>{}); } });
    return;
  }
  vids.forEach(v => lazyVideoObserver.observe(v));
}

function buildMaterialUnit(u, i) {
  return `<div class="material-unit">${buildMaterialThumb(u, i)}<button type="button" class="copy-btn" data-url="${escAttr(u)}">复制TOP${i+1}素材</button></div>`;
}

const CHAIN_LABEL = {
  'ADQ×小店': '小店链路×ADQ',
  '小店广告×小店': '小店链路×小店广告',
  'ADQ×直播': '直播链路×ADQ',
  '小店广告×直播': '直播链路×小店广告',
};
function buildChainBlocks(list) {
  if (!list || !list.length) return '<div style="font-size:12px;color:#6c82a6;">产品×链路占比：暂无</div>';
  const maxShare = Math.max(...list.map(x => Number(x.share || 0)));
  const blocks = list.map(x => {
    const name = CHAIN_LABEL[x.name] || x.name;
    const share = Number(x.share || 0);
    const isMax = share >= maxShare && maxShare > 0;
    return `<div class="chain-block ${isMax ? 'chain-block-max' : ''}">
      <div class="cb-name">${name}</div>
      <div class="cb-share">${share}%</div>
      <div class="cb-track"><div class="cb-fill" style="width:${Math.min(100, share)}%"></div></div>
    </div>`;
  }).join('');
  return `<div class="chain-blocks">${blocks}</div>`;
}

function renderPainLines(text) {
  if (!text) return '<li>暂无痛点数据</li>';
  const seen = new Set();
  const items = [];
  String(text).split(/\r?\n|·/).forEach(seg => {
    const t = (seg || '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    items.push(t);
  });
  if (items.length === 0) return '<li>暂无痛点数据</li>';
  return items.map(t => `<li>${t}</li>`).join('');
}

function tabByKey(key) {
  return store.tabs.find(t => t.key === key);
}

function renderMainTabs() {
  const el = document.getElementById('mainTabs');
  el.innerHTML = store.tabs.map(t => `
    <div class="main-tab ${t.key===state.tabKey?'active':''}" data-k="${t.key}">${t.title}</div>
  `).join('');
  el.querySelectorAll('.main-tab').forEach(btn => {
    btn.onclick = () => {
      state.tabKey = btn.dataset.k;
      const tab = tabByKey(state.tabKey);
      state.category = tab.categories[0] || '';
      renderMainTabs();
      renderContent();
      observeLazyVideos(document);
    };
  });
}

function renderContent() {
  const tab = tabByKey(state.tabKey);
  if (!state.category) state.category = tab.categories[0] || '';
  const panel = document.getElementById('contentPanel');

  // 视频号数据隐藏开关：展示"数据更新中"占位，不渲染旧数据
  if (tab.data_hidden) {
    panel.innerHTML = `
      <div style="margin:48px auto;max-width:540px;text-align:center;padding:52px 24px;border:1px dashed #c9d4e6;border-radius:16px;background:#f7f9fc;">
        <div style="font-size:42px;line-height:1;">📡</div>
        <div style="font-size:19px;font-weight:800;color:#13366d;margin:16px 0 10px;">视频号爆品数据更新中</div>
        <div style="font-size:13px;color:#5a6b88;line-height:1.7;">本期视频号爆品数据正在整理中，敬请期待。<br/>AMS 投放爆品 / 抖音机会爆品 榜单不受影响，可正常查看。</div>
      </div>`;
    return;
  }

  const catTabs = tab.categories.map(c => `<div class="cat-tab ${c===state.category?'active':''}" data-c="${c}">${c.split('-').pop()}</div>`).join('');
  const summary = tab.category_summary[state.category] || null;
  const items = tab.items_by_category[state.category] || [];

  let summaryHtml = '<div class="empty">无数据</div>';
  if (summary) {
    const metricItems = [];
    // AMS 品类数据：优先用外部品类x链路整体指标，fallback 到商品级加权平均
    const isAmsTab = tab.key === 'ams';
    if (isAmsTab) {
      // 整体指标（不分链路），来自品类x链路 CSV 的"空"行或 fallback
      if (summary.ext_ctr !== null && summary.ext_ctr !== undefined) metricItems.push({k:'CTR', v:fmtPct(summary.ext_ctr)});
      else if (summary.ctr !== null && summary.ctr !== undefined) metricItems.push({k:'CTR', v:fmtPct(summary.ctr)});
      if (summary.ext_roi !== null && summary.ext_roi !== undefined) metricItems.push({k:'下单ROI', v:fmtNum(summary.ext_roi)});

    const maxV = Math.max(...volume, 1);

    // 销售额折线（左Y轴）
    const salesPts = sales.map((v, i) =>
      `${padL + (i / Math.max(sales.length-1,1)) * plotW},${padT + plotH - (v/maxS) * plotH}`
    ).join(' ');
    // 销量折线（右Y轴）
    const volPts = volume.map((v, i) =>
      `${padL + (i / Math.max(volume.length-1,1)) * plotW},${padT + plotH - (v/maxV) * plotH}`
    ).join(' ');

    // X轴刻度
    const xTicks = dates.map((d, i) => {
      const x = padL + (i / Math.max(dates.length-1,1)) * plotW;
      return i % showEvery === 0 ? `<text x="${x}" y="${H-12}" text-anchor="middle" fill="#99aabb" font-size="10.5">${d}</text>` : '';
    }).join('');

    // Y轴网格（仅横线，不标数字）
    let yGrid = '';
    for (let yi = 0; yi <= 5; yi++) {
      const y = padT + plotH - (yi/5) * plotH;
      if (yi > 0) yGrid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#eaeef5" stroke-width="1" stroke-dasharray="3,3"/>`;
    }

    const salesDots = sales.map((v, i) => {
      const x = padL + (i / Math.max(sales.length-1,1)) * plotW;
      const y = padT + plotH - (v/maxS) * plotH;
      return `<circle cx="${x}" cy="${y}" r="3" fill="#fff" stroke="#4f7cff" stroke-width="1.8"/>`;
    }).join('');
    const volDots = volume.map((v, i) => {
      const x = padL + (i / Math.max(volume.length-1,1)) * plotW;
      const y = padT + plotH - (v/maxV) * plotH;
      return `<circle cx="${x}" cy="${y}" r="2.5" fill="#fff" stroke="#e86a4a" stroke-width="1.5"/>`;
    }).join('');

    return `

        <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:18px;height:3px;background:#e86a4a;border-radius:2px;"></span> 销量</span>
      </div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="background:linear-gradient(180deg,#fcfdff 0%,#f7f9fc 100%);border-radius:10px;">
        ${yGrid}
        <polyline points="${salesPts}" fill="none" stroke="#4f7cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="${volPts}" fill="none" stroke="#e86a4a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>
        ${salesDots}
        ${volDots}
        ${xTicks}
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#dde3ed" stroke-width="1.2"/>
        <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#dde3ed" stroke-width="1.2"/>
      </svg>
    </div>`;
  })();

  // 三个 tab 统一布局：趋势图左(2/3) + 词云右(1/3) 并排
  const cardsClass = (tab.key === 'ams') ? 'cards cols-1' : 'cards cols-2';

  // 趋势图 HTML（AMS→amsTrend, 抖音→douyinTrend, 视频号→wechatTrend）
  const trendHtml = (tab.key === 'ams') ? amsTrendHtml :
                     (tab.key === 'douyin') ? douyinTrendHtml :

  const catEl = document.getElementById('catTabs');
  catEl.querySelectorAll('.cat-tab').forEach(btn => {
    btn.onclick = () => {
      state.category = btn.dataset.c;
      renderContent();
      observeLazyVideos(document);
    };
  });

  panel.querySelectorAll('.copy-btn').forEach(btn => {
    btn.onclick = async () => {
      const url = btn.dataset.url || '';
      if (!url) return;
      try {
        await navigator.clipboard.writeText(url);
        const old = btn.textContent;
        btn.textContent = '已复制';
        setTimeout(() => btn.textContent = old, 900);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    };
  });

  panel.querySelectorAll('video').forEach(v => {
    v.muted = true;
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
  });

  // 折叠链路表：点击品类行展开/收起子行
  panel.querySelectorAll('.ch-cat-row').forEach(row => {
    row.onclick = () => {
      const idx = row.dataset.idx;
      const arrow = row.querySelector('.ch-arrow');
      const subRows = panel.querySelectorAll(`.ch-sub-${idx}`);
      const visible = subRows[0] && subRows[0].style.display !== 'none';
      subRows.forEach(sr => { sr.style.display = visible ? 'none' : ''; });
      if (arrow) arrow.style.transform = visible ? '' : 'rotate(90deg)';
      arrow.style.color = visible ? '#8899ae' : '#4f7cff';
    };
  });
}

fetch(dataUrl).then(r => r.json()).then(d => {
  store = d;
  const ams = store.tabs.find(x => x.key === 'ams');
  state.tabKey = ams ? 'ams' : store.tabs[0].key;
  state.category = tabByKey(state.tabKey).categories[0] || '';
  renderMainTabs();
  renderContent();
  observeLazyVideos(document);
}).catch(err => {
  document.getElementById('contentPanel').innerHTML = '数据加载失败：' + err.message;
});
