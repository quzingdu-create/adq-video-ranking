<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>女装三平台爆品榜单</title>
<style>
:root {
  --bg:#f4f7fb;
  --panel:#ffffff;
  --line:#d8e2f0;
  --text:#11243e;
  --sub:#526b90;
  --brand:#2f66ff;
  --brand-2:#4b7dff;
  --brand-3:#7aa3ff;
  --soft:#e9f0ff;
  --ok:#0f9d8a;
  --warn:#e67e22;
  --bad:#d64545;
  --shadow:0 8px 24px rgba(22,58,120,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
.wrap{max-width:1580px;margin:0 auto;padding:18px 24px 36px}

.hero{background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 45%,#60a5fa 100%);border-radius:18px;padding:22px 24px;color:#fff;box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:31px;letter-spacing:1px}
.hero .sub{margin-top:6px;color:#dbeafe;font-size:13px}

.main-tabs{display:flex;gap:10px;margin:14px 0 14px;flex-wrap:wrap}
.main-tab{padding:10px 18px;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--sub);font-size:16px;font-weight:850;cursor:pointer;transition:.2s}
.main-tab:hover{border-color:var(--brand);color:var(--brand)}
.main-tab.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(47,102,255,.28)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 4px 14px rgba(21,42,90,.06)}

.insight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.insight-card{border:1.5px solid #dce6f6;border-radius:11px;padding:11px 12px;background:linear-gradient(135deg,#f8fbff,#eff4ff)}
.insight-title{font-size:13px;color:var(--sub);font-weight:800;margin-bottom:4px}
.insight-value{font-size:16px;color:#1d4ed8;font-weight:900}

.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.cat-tab{padding:6px 12px;border-radius:9px;border:1px solid #d7e2f5;background:#f7faff;color:#40618f;font-size:12.5px;font-weight:800;cursor:pointer}
.cat-tab.active{background:#2f66ff;color:#fff;border-color:#2f66ff}

.cat-summary{background:linear-gradient(135deg,#f9fbff,#f1f6ff);border:1.5px solid #d8e4f8;border-radius:12px;padding:13px 14px;margin-bottom:12px}
.cat-title{font-size:19px;font-weight:900;margin-bottom:8px;color:#13366d}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;margin-bottom:10px}
.m-item{background:#fff;border:1px solid #e1e8f5;border-radius:8px;padding:7px 8px;text-align:center}
.m-item .k{font-size:11px;color:#6c82a6}
.m-item .v{font-size:16px;font-weight:850;color:#12345f}

.cloud{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cloud .kw{background:#ecf3ff;border:1px solid #cfe0ff;color:#2c5fc4;padding:3px 8px;border-radius:14px;font-weight:700}
.chain{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chain .chip{background:#eefcf7;border:1px solid #c2f2e3;color:#067a66;padding:3px 8px;border-radius:14px;font-weight:700}
.direction{margin-top:6px;padding-left:18px;color:#2d476f}
.direction li{margin:2px 0}

.cards{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:#fff;border:1.5px solid #dce6f6;border-radius:12px;padding:13px 14px;transition:.2s}
.card:hover{border-color:#8db0ff;box-shadow:0 8px 20px rgba(33,83,184,.12)}
.card-name{font-size:24px;font-weight:900;color:#12315f;line-height:1.35;margin-bottom:3px}
.card-meta{font-size:14px;color:#2b4f83;font-weight:700;margin-bottom:8px}
.chain-row{font-size:13px;color:#4b6286;background:#f7faff;border:1px solid #e1ebff;border-radius:8px;padding:6px 9px;margin-bottom:8px}
.metric{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-bottom:8px}
.metric .box{border:1px solid #dce6f6;border-radius:8px;padding:8px;background:linear-gradient(135deg,#fbfdff,#f4f8ff)}
.metric .k{font-size:11px;color:#6f85a9}
.metric .v{font-size:20px;font-weight:850;color:#132f5f}

.sell{font-size:14px;color:#173b74;background:#f2f7ff;border:1px solid #d9e7ff;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-weight:750}

.extra{border:1px solid #e7edf8;border-radius:9px;overflow:hidden}
.extra .row{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid #eef3fb}
.extra .row:last-child{border-bottom:none}
.extra .row:nth-child(odd){background:#fbfdff}
.extra .row:nth-child(even){background:#f7faff}
.extra .key{min-width:74px;color:#4c6285;font-weight:850}
.extra .val{flex:1;color:#1d3359}
.aud{display:flex;gap:6px;flex-wrap:wrap}
.aud span{background:#f0ecff;color:#6942d9;border:1px solid #dbd1ff;border-radius:12px;padding:2px 8px;font-weight:700}

@media (max-width:980px) {
  .insight-grid{grid-template-columns:1fr}
  .metric{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card-name{font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>女装三平台爆品榜单</h1>
    <div class="sub">三大Tab：AMS投放爆品 / 视频号爆品 / 机会爆品（抖音） · 已移除潜力品 · 按品类展示Top30</div>
  </div>

  <div class="main-tabs" id="mainTabs"></div>
  <div class="panel" id="contentPanel">加载中...</div>
</div>

<script>
const dataUrl = './女装投放端链路商品榜单_数据.json?v=1787055828';
let state = { tabKey: 'ams', category: '' };
let store = null;

function fmtMoney(v) {
  if (v === null || v === undefined) return '—';
  return '¥' + Number(v).toLocaleString('zh-CN', {maximumFractionDigits:1});
}
function fmtPct(v) {
  if (v === null || v === undefined) return '—';
  return Number(v).toFixed(1) + '%';
}
function fmtNum(v) {
  if (v === null || v === undefined) return '—';
  return Number(v).toFixed(2);
}

function tabByKey(key) {
  return store.tabs.find(t => t.key === key);
}

function renderMainTabs() {
  const el = document.getElementById('mainTabs');
  el.innerHTML = store.tabs.map(t => `
    <div class="main-tab ${t.key===state.tabKey?'active':''}" data-k="${t.key}">${t.title}</div>
  `).join('');
  el.querySelectorAll('.main-tab').forEach(btn => {
    btn.onclick = () => {
      state.tabKey = btn.dataset.k;
      const tab = tabByKey(state.tabKey);
      state.category = tab.categories[0] || '';
      renderMainTabs();
      renderContent();
    };
  });
}

function renderContent() {
  const tab = tabByKey(state.tabKey);
  if (!state.category) state.category = tab.categories[0] || '';
  const panel = document.getElementById('contentPanel');

  const catTabs = tab.categories.map(c => `<div class="cat-tab ${c===state.category?'active':''}" data-c="${c}">${c}</div>`).join('');
  const summary = tab.category_summary[state.category] || null;
  const items = tab.items_by_category[state.category] || [];

  let summaryHtml = '<div class="empty">无数据</div>';
  if (summary) {
    summaryHtml = `
      <div class="cat-summary">
        <div class="cat-title">${state.category}（TOP30）</div>
        <div class="m-grid">
          <div class="m-item"><div class="k">商品数</div><div class="v">${summary.item_count}</div></div>
          <div class="m-item"><div class="k">${tab.metric_name}</div><div class="v">${fmtMoney(summary.total_value)}</div></div>
          <div class="m-item"><div class="k">CTR</div><div class="v">${fmtPct(summary.ctr)}</div></div>
          <div class="m-item"><div class="k">CVR</div><div class="v">${fmtPct(summary.cvr)}</div></div>
          <div class="m-item"><div class="k">ROI</div><div class="v">${fmtNum(summary.roi)}</div></div>
          <div class="m-item"><div class="k">退款率</div><div class="v">${fmtPct(summary.refund)}</div></div>
          <div class="m-item"><div class="k">客单价</div><div class="v">${fmtMoney(summary.aov)}</div></div>
        </div>

        <div><b>商品关键词词云</b></div>
        <div class="cloud">${(summary.keyword_cloud || []).map(k => `<span class="kw">${k.word}(${k.count})</span>`).join('') || '<span class="kw">暂无</span>'}</div>

        <div><b>产品×链路占比</b></div>
        <div class="chain">${(summary.chain_share || []).map(k => `<span class="chip">${k.name} ${k.share}%</span>`).join('') || '<span class="chip">暂无</span>'}</div>

        <div><b>开品方向</b></div>
        <ol class="direction">${(summary.direction || []).map(x => `<li>${x}</li>`).join('')}</ol>
      </div>
    `;
  }

  const cards = items.map(it => {
    const chain = Object.entries(it.chain_costs || {})
      .sort((a,b)=>b[1]-a[1])
      .map(([k,v]) => `${k} ${((v/Math.max(it.value,1))*100).toFixed(1)}%`)
      .join(' ｜ ');

    const extra = it.insight || {};
    return `
      <div class="card">
        <div class="card-name">${it.name}</div>
        <div class="card-meta">商品信息：商品品类：<b>${it.category}</b> ｜ 来源：${it.video || '—'} ｜ 主投链路：${it.main_chain || '—'}</div>
        <div class="chain-row"><b>产品×链路占比：</b>${chain || '暂无'}</div>

        <div class="metric">
          <div class="box"><div class="k">${tab.metric_name}</div><div class="v">${fmtMoney(it.value)}</div></div>
          <div class="box"><div class="k">CTR</div><div class="v">${fmtPct(it.ctr)}</div></div>
          <div class="box"><div class="k">CVR</div><div class="v">${fmtPct(it.cvr)}</div></div>
          <div class="box"><div class="k">下单ROI</div><div class="v">${fmtNum(it.roi)}</div></div>
          <div class="box"><div class="k">客单价</div><div class="v">${fmtMoney(it.aov)}</div></div>
        </div>

        <div class="sell">商品来源：${it.source || '—'}${it.material_url ? ` ｜ 素材链接：<a href="${it.material_url}" target="_blank">查看</a>` : ''}</div>

        <div class="extra">
          <div class="row"><div class="key">行动建议</div><div class="val">${extra.action || '持续观察数据并优化素材结构'}</div></div>
          <div class="row"><div class="key">场景</div><div class="val">${extra.scene || '日常通勤'}</div></div>
          <div class="row"><div class="key">用户痛点</div><div class="val">${(extra.pain_points || []).join('；')}</div></div>
          <div class="row"><div class="key">风格关键词</div><div class="val">${(extra.styles || []).join(' ｜ ')}</div></div>
          <div class="row"><div class="key">目标人群</div><div class="val"><div class="aud">${(extra.audience || []).map(x => `<span>${x}</span>`).join('')}</div></div></div>
        </div>
      </div>
    `;
  }).join('');

  panel.innerHTML = `
    <div class="insight-grid">
      <div class="insight-card"><div class="insight-title">趋势洞察</div><div class="insight-value">${tab.insights.trend}</div></div>
      <div class="insight-card"><div class="insight-title">主力品类洞察</div><div class="insight-value">${tab.insights.category}</div></div>
      <div class="insight-card"><div class="insight-title">价格带洞察</div><div class="insight-value">${tab.insights.price}</div></div>
    </div>

    <div class="cat-tabs" id="catTabs">${catTabs}</div>
    ${summaryHtml}
    <div class="cards">${cards || '<div>当前品类无数据</div>'}</div>
  `;

  const catEl = document.getElementById('catTabs');
  catEl.querySelectorAll('.cat-tab').forEach(btn => {
    btn.onclick = () => {
      state.category = btn.dataset.c;
      renderContent();
    };
  });
}

fetch(dataUrl).then(r => r.json()).then(d => {
  store = d;
  const ams = store.tabs.find(x => x.key === 'ams');
  state.tabKey = ams ? 'ams' : store.tabs[0].key;
  state.category = tabByKey(state.tabKey).categories[0] || '';
  renderMainTabs();
  renderContent();
}).catch(err => {
  document.getElementById('contentPanel').innerHTML = '数据加载失败：' + err.message;
});
</script>
</body>
</html>
