      <td class="cust" title="${c.name}">${c.name}</td>
      <td>${fmt(c.cost,3)}</td>
      ${deltaCell(c.cost_pct, c.cost_delta, '万', 2)}
      <td>${fmt(c.roi)}</td>
      ${deltaCell(c.roi_pct, c.roi_delta, '', 2)}
      <td>${fmt(c.ctr)}</td>
      <td class="delta-cell ${cls(c.ctr_delta)}">${arr(c.ctr_delta)} <span class="abs" style="color:inherit;">${signAbs(c.ctr_delta,2)}pp</span></td>
      <td>${fmt(c.order_rate)}</td>
      <td class="delta-cell ${cls(c.order_rate_delta)}">${arr(c.order_rate_delta)} <span class="abs" style="color:inherit;">${signAbs(c.order_rate_delta,2)}pp</span></td>
      <td>${fmtInt(c.price)}</td>
      <td>${fmt(c.refund,1)}</td>
    </tr>`;
  }).join('');

  window.addEventListener('resize', () => {
    document.querySelectorAll('[_echarts_instance_]').forEach(el => {
      const inst = echarts.getInstanceByDom(el);
      if (inst) inst.resize();
    });
  });
})();
</script>
</body>
</html>
