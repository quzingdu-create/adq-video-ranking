<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服饰中心大盘行业数据看板 · 6.5</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --line:#283039;
  --txt:#e6edf3; --sub:#8b949e; --muted:#6e7681;
  --accent:#3b82f6; --red:#f85149; --green:#3fb950; --gold:#d29922;
  --up:#f85149; --down:#3fb950; /* 中国习惯: 涨红 跌绿 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5;padding-bottom:60px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
header{padding:26px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
h1{font-size:22px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.sub{color:var(--sub);font-size:13px;margin-top:6px}
.sec-title{font-size:16px;font-weight:600;margin:30px 0 14px;padding-left:11px;border-left:3px solid var(--accent)}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
.kpi .k-label{color:var(--sub);font-size:12px}
.kpi .k-val{font-size:26px;font-weight:700;margin-top:6px}
.kpi .k-unit{font-size:13px;color:var(--muted);font-weight:400;margin-left:3px}
.kpi .k-sub{font-size:11px;color:var(--muted);margin-top:4px}
.kpi.accent .k-val{color:#79c0ff}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{font-size:14px;font-weight:600;margin-bottom:14px;color:var(--txt)}
.card .chart-box{position:relative;height:300px}

/* overall table */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--sub);font-weight:600;font-size:12px;background:var(--panel2);position:sticky;top:0}
tbody tr:hover{background:rgba(56,139,253,.06)}
.row-total{background:rgba(210,153,34,.08)}
.row-total td{font-weight:700;color:#f0d98a}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px}
.tab{padding:8px 16px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--sub);cursor:pointer;font-size:13px;transition:.15s;user-select:none}
.tab:hover{border-color:var(--accent);color:var(--txt)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* category blocks */
.cat-head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.cat-head .ch-name{font-size:19px;font-weight:700}
.cat-head .ch-tag{font-size:12px;color:var(--muted)}
.block{margin-top:22px}
.block-title{font-size:14px;font-weight:600;color:#79c0ff;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.block-title .seg{font-size:11px;color:var(--muted);font-weight:400;background:var(--panel2);padding:2px 8px;border-radius:10px}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:6px;min-width:2px}
.up{color:var(--up)}
.down{color:var(--down)}
.metricbar{position:relative}
.metricbar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(59,130,246,.13);border-radius:4px;z-index:0}
.metricbar span{position:relative;z-index:1}
.note{color:var(--muted);font-size:12px;margin-top:14px;font-style:italic}
.legend{display:flex;gap:18px;font-size:12px;color:var(--sub);margin-bottom:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>服饰中心大盘行业数据看板</h1>
    <div class="sub" id="subtitle">近 7 天数据 · 2026-06-05 更新　|　环比 = 近7天日均 vs 前7天日均　|　涨<span class="up">红</span>跌<span class="down">绿</span></div>
  </header>

  <!-- 整体总览 -->
  <div class="sec-title">整体总览</div>
  <div class="kpis" id="kpis"></div>

  <div class="grid2" style="margin-top:18px">
    <div class="card"><h3>各行业日均消耗 (万元)</h3><div class="chart-box"><canvas id="chCost"></canvas></div></div>
    <div class="card"><h3>各行业下单 ROI</h3><div class="chart-box"><canvas id="chRoi"></canvas></div></div>
  </div>

  <div class="sec-title">整体情况明细</div>
  <div class="tbl-wrap">
    <table id="overallTbl"><thead></thead><tbody></tbody></table>
  </div>

  <!-- 类目下钻 -->
  <div class="sec-title">行业类目下钻</div>
  <div class="tabs" id="catTabs"></div>
  <div id="catPanel"></div>
</div>

<script>
const D = window.__DASH__;
const fmt = (v,d=2)=> (typeof v==='number'? v.toFixed(d): (v??'-'));
const pct = v => (typeof v==='number'? (v>=0?'+':'')+v.toFixed(1)+'%':'-');

/* ---------- KPI ---------- */
(function(){
  const tot = D.overall.find(r=>r[0]==='合计');
  const kpis=[
    {label:'服饰中心日均消耗',val:(tot[1]).toLocaleString(),unit:'万元',sub:'下含其他/品牌等全口径',accent:true},
    {label:'整体下单 ROI',val:fmt(tot[2]),unit:'',sub:'全行业加权'},
    {label:'整体 CTR',val:fmt(tot[3])+'%',unit:'',sub:'点击率'},
    {label:'整体 CVR',val:fmt(tot[4])+'%',unit:'',sub:'转化率'},
    {label:'整体 CPM',val:fmt(tot[5],1),unit:'元',sub:'千次曝光成本'},
    {label:'整体客单价',val:fmt(tot[6],1),unit:'元',sub:'下单单价'},
    {label:'7天退款率',val:fmt(tot[7],1)+'%',unit:'',sub:'整体'},
    {label:'14天退款率',val:fmt(tot[8],1)+'%',unit:'',sub:'整体'},
  ];
  document.getElementById('kpis').innerHTML = kpis.map(k=>`
    <div class="kpi ${k.accent?'accent':''}">
      <div class="k-label">${k.label}</div>
      <div class="k-val">${k.val}<span class="k-unit">${k.unit}</span></div>
      <div class="k-sub">${k.sub}</div>
    </div>`).join('');
})();

/* ---------- 整体明细表 ---------- */
(function(){
  const t=document.getElementById('overallTbl');
  t.querySelector('thead').innerHTML='<tr>'+D.overallHeader.map(h=>`<th>${h}</th>`).join('')+'</tr>';
  t.querySelector('tbody').innerHTML=D.overall.map(r=>{
    const isTot=r[0]==='合计';
    return `<tr class="${isTot?'row-total':''}">`+r.map((v,i)=>{
      if(i===0) return `<td>${v}</td>`;
      if(i===1) return `<td>${typeof v==='number'?v.toLocaleString():v}</td>`;
      return `<td>${fmt(v, i>=7?2:2)}</td>`;
    }).join('')+'</tr>';
  }).join('');
})();

/* ---------- 图表 ---------- */
const baseOpt={
  responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:false}},
  scales:{
    x:{ticks:{color:'#8b949e',font:{size:11}},grid:{display:false}},
    y:{ticks:{color:'#8b949e',font:{size:11}},grid:{color:'#283039'}}
  }
};
(function(){
  const rows=D.overall.filter(r=>r[0]!=='合计');
  const sorted=[...rows].sort((a,b)=>b[1]-a[1]);
  const labels=sorted.map(r=>r[0]);
  new Chart(document.getElementById('chCost'),{
    type:'bar',
    data:{labels,datasets:[{data:sorted.map(r=>r[1]),backgroundColor:'#3b82f6',borderRadius:5}]},
    options:{...baseOpt,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x.toLocaleString()+' 万'}}}}
  });
  const sr=[...rows].sort((a,b)=>b[2]-a[2]);
  new Chart(document.getElementById('chRoi'),{
    type:'bar',
    data:{labels:sr.map(r=>r[0]),datasets:[{data:sr.map(r=>r[2]),backgroundColor:sr.map(r=>r[2]>=D.overall.find(x=>x[0]==='合计')[2]?'#3fb950':'#d29922'),borderRadius:5}]},
    options:{...baseOpt,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'ROI '+c.parsed.x.toFixed(2)}}}}
  });
})();

/* ---------- 类目下钻 ---------- */
const METRICS=D.catData[D.cats[0]].metricHeader; // 曝光量占比,环比,CTR,CVR,CPM,ROI,客单价
const tabsEl=document.getElementById('catTabs');
const panel=document.getElementById('catPanel');
let chartRefs=[];

function maxOf(blocks,idx){
  let m=0;blocks.forEach(b=>b.rows.forEach(r=>{const v=r.vals[idx];if(typeof v==='number'&&Math.abs(v)>m)m=Math.abs(v);}));return m||1;
}

function renderCat(cat){
  chartRefs.forEach(c=>c.destroy());chartRefs=[];
  const cd=D.catData[cat];
  const shareMax=maxOf(cd.blocks,0);
  let html=`<div class="cat-head"><div class="ch-name">${cat}</div><div class="ch-tag">${cd.title||''}</div></div>`;

  // 顶部两图: 直播链路各渠道ROI / 投放OG各方式ROI
  html+=`<div class="grid2" style="margin-top:14px">
    <div class="card"><h3>${cat} · 直播链路各渠道曝光占比 & ROI</h3><div class="chart-box"><canvas id="cc_live_${cat}"></canvas></div></div>
    <div class="card"><h3>${cat} · 投放OG / 系统工具 ROI 对比</h3><div class="chart-box"><canvas id="cc_og_${cat}"></canvas></div></div>
  </div>`;

  cd.blocks.forEach((bl,bi)=>{
    const segMax=maxOf([bl],0);
    html+=`<div class="block"><div class="block-title">${bl.groupTitle}<span class="seg">${bl.section}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>${bl.section==='行业链路'?'链路':'细分'}</th>`+
      METRICS.map(m=>`<th>${m}</th>`).join('')+`</tr></thead><tbody>`+
      bl.rows.map(rw=>{
        return '<tr><td>'+rw.name+'</td>'+rw.vals.map((v,i)=>{
          if(i===0){ // 曝光占比 带条
            const w=typeof v==='number'?(Math.abs(v)/segMax*100):0;
            return `<td class="metricbar"><span class="fill" style="width:${w}%"></span><span>${fmt(v)}%</span></td>`;
          }
          if(i===1){ // 环比
            const cls=typeof v==='number'?(v>=0?'up':'down'):'';
            return `<td class="${cls}">${pct(v)}</td>`;
          }
          if(i===4||i===6) return `<td>${fmt(v,1)}</td>`; // CPM 客单价
          if(i===2||i===3) return `<td>${fmt(v)}%</td>`;   // CTR CVR
          return `<td>${fmt(v)}</td>`;                      // ROI
        }).join('')+'</tr>';
      }).join('')+`</tbody></table></div></div>`;
  });
  html+=`<div class="note">说明：曝光量占比=消耗占比；客单价=下单单价；环比为近7天日均 vs 前7天日均；图示仅为大盘区间，非品牌区间。</div>`;
  panel.innerHTML=html;

  // 直播链路图
  const live=cd.blocks.find(b=>b.groupTitle==='直播链路');
  if(live){
    const lbl=live.rows.map(r=>r.name);
    chartRefs.push(new Chart(document.getElementById('cc_live_'+cat),{
      data:{labels:lbl,datasets:[
        {type:'bar',label:'曝光占比%',data:live.rows.map(r=>r.vals[0]),backgroundColor:'#3b82f6',borderRadius:4,yAxisID:'y'},
        {type:'line',label:'ROI',data:live.rows.map(r=>r.vals[5]),borderColor:'#d29922',backgroundColor:'#d29922',tension:.3,yAxisID:'y1',pointRadius:4}
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:true,labels:{color:'#8b949e',font:{size:11}}}},
        scales:{x:{ticks:{color:'#8b949e',font:{size:10}},grid:{display:false}},
          y:{position:'left',ticks:{color:'#3b82f6',font:{size:10}},grid:{color:'#283039'},title:{display:true,text:'曝光占比%',color:'#3b82f6',font:{size:10}}},
          y1:{position:'right',ticks:{color:'#d29922',font:{size:10}},grid:{display:false},title:{display:true,text:'ROI',color:'#d29922',font:{size:10}}}}}
    }));
  }
  // 投放OG+系统工具 ROI
  const og=cd.blocks.find(b=>b.groupTitle==='投放OG');
  const sys=cd.blocks.find(b=>b.groupTitle==='系统工具');
  const combo=[];
  if(og) og.rows.forEach(r=>combo.push([r.name,r.vals[5]]));
  if(sys) sys.rows.forEach(r=>combo.push([r.name,r.vals[5]]));
  chartRefs.push(new Chart(document.getElementById('cc_og_'+cat),{
    type:'bar',
    data:{labels:combo.map(c=>c[0]),datasets:[{data:combo.map(c=>c[1]),
      backgroundColor:combo.map((c,i)=>i<(og?og.rows.length:0)?'#388bfd':'#8957e5'),borderRadius:4}]},
    options:{...baseOpt,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'ROI '+c.parsed.y.toFixed(2)}}}}
  }));
}

D.cats.forEach((c,i)=>{
  const el=document.createElement('div');
  el.className='tab'+(i===0?' active':'');
  el.textContent=c;
  el.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderCat(c);};
  tabsEl.appendChild(el);
});
renderCat(D.cats[0]);
</script>
</body>
