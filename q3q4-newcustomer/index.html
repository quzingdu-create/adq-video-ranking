// ============ helpers ============
function sumOver(obj, keys){let s=0;keys.forEach(k=>{s+=obj[k]||0});return s;}

function stackBar(canvasId, weekData, keys, colors, unit){
  // weekData: {W1:{key:val}, ...}
  // 计算每周总量
  const weekTotals = WEEKS.map(w=>keys.reduce((s,k)=>s+(weekData[w.id][k]||0),0));
  new Chart(document.getElementById(canvasId),{
    type:'bar',
    data:{
      labels:WEEKS.map(w=>w.label),
      datasets:keys.map(k=>({
        label:k,
        data:WEEKS.map(w=>weekData[w.id][k]||0),
        backgroundColor:colors[k],
        borderWidth:0
      }))
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      scales:{
        x:{stacked:true},
        y:{stacked:true,ticks:{callback:v=>unit==='万'?(v/10000).toFixed(0)+'万':v}}
      },
      plugins:{
        legend:{position:'top',labels:{boxWidth:12,font:{size:11}}},
        tooltip:{
          callbacks:{
            label:function(ctx){
              const v = ctx.parsed.y;
              const tot = weekTotals[ctx.dataIndex];
              const pct = tot?(v/tot*100).toFixed(1):'0.0';
              const disp = unit==='万'?(v/10000).toFixed(1)+'万':v;
              return `${ctx.dataset.label}: ${disp} (占${pct}%)`;
            },
            footer:function(items){
              if(!items.length)return '';
              const tot = weekTotals[items[0].dataIndex];
              const disp = unit==='万'?(tot/10000).toFixed(1)+'万':tot;
              return `合计: ${disp}`;
            }
          }
        }
      }
    }
  });
}

function pie(canvasId, dataObj, colors, unit){
  const keys = Object.keys(dataObj);
  const vals = keys.map(k=>dataObj[k]);
  const tot = vals.reduce((s,v)=>s+v,0);
  new Chart(document.getElementById(canvasId),{
    type:'doughnut',
    data:{labels:keys,datasets:[{data:vals,backgroundColor:keys.map(k=>colors[k]),borderWidth:2,borderColor:'#fff'}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{position:'right',labels:{boxWidth:11,font:{size:11},padding:6}},
        tooltip:{callbacks:{label:ctx=>{
          const v = ctx.parsed;
          const pct = tot?(v/tot*100).toFixed(1):'0.0';
          const disp = unit==='万'?(v/10000).toFixed(1)+'万':v;
          return `${ctx.label}: ${disp} (${pct}%)`;
        }}}
      }
    }
  });
}

function tblStack(elId, weekData, keys, colors, unit){
  // 表：keys × (W1~W4 + 累计 + 占比 + WoW)
  let head = '<thead><tr><th>' + (unit==='万'?'投放端/类目':'维度') + '</th>';
  WEEKS.forEach(w=>{head+=`<th>${w.id}</th>`});
  head += '<th>季度累计</th><th>占比</th>';
  WEEKS.slice(1).forEach(w=>{head+=`<th>WoW(${w.id})</th>`});
  head += '</tr></thead>';
  const grandTot = keys.reduce((s,k)=>s+WEEKS.reduce((s2,w)=>s2+(weekData[w.id][k]||0),0),0);
  let body = '<tbody>';
  keys.forEach(k=>{
    const rowTot = WEEKS.reduce((s,w)=>s+(weekData[w.id][k]||0),0);
    body += `<tr><td><b style="color:${colors[k]}">${k}</b></td>`;
    WEEKS.forEach(w=>{
      const v = weekData[w.id][k]||0;
      body += `<td>${unit==='万'?(v/10000).toFixed(1):v}</td>`;
    });
    body += `<td><b>${unit==='万'?(rowTot/10000).toFixed(1):rowTot}</b></td>`;
    body += `<td><span class="pill">${grandTot?(rowTot/grandTot*100).toFixed(1):'0.0'}%</span></td>`;
    WEEKS.slice(1).forEach((w,i)=>{
      const cur = weekData[w.id][k]||0, prev = weekData[WEEKS[i].id][k]||0;
      body += `<td>${pctCell(cur,prev,w.days,WEEKS[i].days)}</td>`;
    });
    body += '</tr>';
  });
  // 合计行
  body += `<tr style="background:#f7fbff;font-weight:600"><td>合计</td>`;
  WEEKS.forEach(w=>{
    const v = keys.reduce((s,k)=>s+(weekData[w.id][k]||0),0);
    body += `<td>${unit==='万'?(v/10000).toFixed(1):v}</td>`;
  });
  body += `<td><b>${unit==='万'?(grandTot/10000).toFixed(1):grandTot}</b></td><td>100.0%</td>`;
  WEEKS.slice(1).forEach((w,i)=>{
    const cur = keys.reduce((s,k)=>s+(weekData[w.id][k]||0),0);
    const prev = keys.reduce((s,k)=>s+(weekData[WEEKS[i].id][k]||0),0);
    body += `<td>${pctCell(cur,prev,w.days,WEEKS[i].days)}</td>`;
  });
  body += '</tr></tbody>';
  document.getElementById(elId).innerHTML = head + body;
}

function renderDrill(){
  const fw = document.getElementById('f-w').value;
  const fch = document.getElementById('f-ch').value;
  const fcat = document.getElementById('f-cat').value;
  const fq = document.getElementById('f-q').value.trim().toLowerCase();
  const fs = document.getElementById('f-sort').value;
  let rows = DATA.custs.filter(r=>{
    if(fw && r.week!==fw)return false;
    if(fch && r.ch!==fch)return false;
    if(fcat && r.cat!==fcat)return false;
    if(fq && !(r.name.toLowerCase().includes(fq) || r.sale.toLowerCase().includes(fq)))return false;
    return true;
  });
  if(fs==='cum_desc')rows.sort((a,b)=>b.cum_cost-a.cum_cost);
  else if(fs==='fw_desc')rows.sort((a,b)=>b.first_wk_cost-a.first_wk_cost);
  else if(fs==='dt_asc')rows.sort((a,b)=>a.first_dt.localeCompare(b.first_dt));
  const show = rows.slice(0,500);
  document.getElementById('f-cnt').textContent = `${rows.length} 客户 (显示前 ${show.length})`;
  let html = '<thead><tr><th>客户简称</th><th>销售</th><th>周</th><th>投放端</th><th>类目</th><th>客群</th><th>首投日</th><th>首周消耗</th><th>累计消耗</th><th>季度消耗/万</th></tr></thead><tbody>';
  show.forEach(r=>{
    html += `<tr><td>${r.name}</td><td>${r.sale}</td><td>${r.week}</td><td style="color:${CH_COLORS[r.ch]}">${r.ch}</td><td style="color:${CAT_COLORS[r.cat]}">${r.cat}</td><td>${r.tag}</td><td>${r.first_dt.slice(5)}</td><td>${fmt(r.first_wk_cost)}</td><td>${fmt(r.cum_cost)}</td><td>${r.quarter_wan}</td></tr>`;
  });
  html += '</tbody>';
  document.getElementById('t-drill').innerHTML = html;
}
['f-w','f-ch','f-cat','f-q','f-sort'].forEach(id=>document.getElementById(id).addEventListener('input',renderDrill));
