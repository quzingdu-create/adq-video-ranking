<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>腾飞监控看板</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:linear-gradient(135deg,#eef2f7 0%,#f5f7fa 100%);color:#1f2937;}
  .wrap{max-width:1680px;margin:0 auto;padding:28px 24px 60px;}
  .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  h1{margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:.5px;}
  .sub{color:#6b7280;font-size:12.5px;}
  .meta{display:flex;gap:8px;flex-wrap:wrap;}
  .meta .pill{background:#fff;border:1px solid #e5e7eb;padding:6px 12px;border-radius:999px;font-size:12px;color:#374151;
              box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .meta .pill b{color:#4338ca;}
  .ctrl{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .ctrl input,.ctrl select{padding:8px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;background:#fff;}
  .ctrl input{width:240px;}
  .ctrl .lbl{font-size:12px;color:#6b7280;}

  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
  @media (max-width:1280px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:760px){.grid{grid-template-columns:1fr;}}

  .card{background:#fff;border-radius:16px;padding:18px 20px 16px;border:1px solid #eef2f7;
        box-shadow:0 4px 14px rgba(15,23,42,.05);position:relative;overflow:hidden;
        transition:transform .15s ease, box-shadow .15s ease;}
  .card:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(15,23,42,.08);}
  .card.overall{background:linear-gradient(135deg,#1e3a8a 0%,#4338ca 100%);color:#fff;border:none;grid-column:1/-1;}
  .card.overall .label,.card.overall .ratio,.card.overall .ops-tag,.card.overall .foot{color:rgba(255,255,255,.85);}
  .card.overall .val{color:#fff;}
  .card.overall .kpi-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);}
  .card.overall .metric-row{border-color:rgba(255,255,255,.12);}

  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px;}
  .nick{font-size:18px;font-weight:800;line-height:1.2;}
  .ops-tag{font-size:11px;color:#6b7280;margin-top:4px;}
  .date-tag{font-size:11px;color:#9ca3af;font-weight:500;flex-shrink:0;text-align:right;line-height:1.3;}
  .date-tag .d{font-size:12px;color:#6b7280;font-weight:600;}
  .card.overall .date-tag,.card.overall .date-tag .d{color:rgba(255,255,255,.85);}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
  .kpi-box{background:#f8fafc;border:1px solid #f1f5f9;border-radius:10px;padding:8px 10px;text-align:left;}
  .kpi-box .label{font-size:11px;color:#6b7280;}
  .kpi-box .val{font-size:17px;font-weight:800;margin-top:2px;color:#0f172a;font-variant-numeric:tabular-nums;line-height:1.15;}
  .kpi-box .ratio{font-size:10.5px;margin-top:1px;font-variant-numeric:tabular-nums;}
  .kpi-box .bench{font-size:10px;color:#9ca3af;margin-top:4px;padding-top:4px;border-top:1px dashed #e5e7eb;
                  font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:4px;}
  .kpi-box .bench .bk{color:#a78bfa;font-weight:600;}
  .kpi-box .bench .bv{color:#6b7280;font-weight:700;}
  .card.overall .kpi-box .bench{border-top-color:rgba(255,255,255,.22);}
  .card.overall .kpi-box .bench .bk{color:#fde68a;}
  .card.overall .kpi-box .bench .bv{color:rgba(255,255,255,.92);}

  .metric-list{margin-top:6px;border-top:1px dashed #e5e7eb;padding-top:8px;}
  .metric-list .mhead{display:grid;grid-template-columns:1fr 70px 60px 70px;gap:6px;font-size:10px;color:#9ca3af;
                      padding:0 0 6px;border-bottom:1px solid #eef2f7;margin-bottom:4px;}
  .metric-list .mhead .h-bench{color:#a78bfa;font-weight:700;}
  .metric-row{display:grid;grid-template-columns:1fr 70px 60px 70px;gap:6px;font-size:12px;padding:5px 0;
              border-bottom:1px dashed #f1f5f9;align-items:center;}
  .metric-row:last-child{border-bottom:none;}
  .metric-row .nm{color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .metric-row .vv{font-weight:700;color:#0f172a;font-variant-numeric:tabular-nums;text-align:right;}
  .metric-row .rr{font-size:10.5px;font-variant-numeric:tabular-nums;text-align:right;}
  .metric-row .bb{font-size:11px;color:#6b7280;font-variant-numeric:tabular-nums;text-align:right;font-weight:600;
                  border-left:1px dashed #e5e7eb;padding-left:6px;}
  .card.overall .metric-row .nm{color:rgba(255,255,255,.92);}
  .card.overall .metric-row .vv{color:#fff;}
  .card.overall .metric-row .bb{color:rgba(255,255,255,.78);border-left-color:rgba(255,255,255,.2);}
  .card.overall .metric-list .mhead{color:rgba(255,255,255,.7);border-bottom-color:rgba(255,255,255,.18);}
  .card.overall .metric-list .mhead .h-bench{color:#fde68a;}

  .ratio-up{color:#dc2626;}
  .ratio-dn{color:#059669;}
  .arrow-up::before{content:"▲ ";font-size:9px;}
  .arrow-dn::before{content:"▼ ";font-size:9px;}
  .card.overall .ratio-up{color:#fecaca;} .card.overall .ratio-dn{color:#bbf7d0;}

  .bench-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;
               background:linear-gradient(135deg,#fef3c7 0%,#fde68a 100%);color:#92400e;
               font-weight:700;margin-left:6px;vertical-align:middle;}
  .card.overall .bench-badge{background:rgba(254,243,199,.95);color:#b45309;}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:#9ca3af;gap:8px;flex-wrap:wrap;}
  .ops-list{font-size:11px;color:#6b7280;}
  .ops-list summary{cursor:pointer;color:#4338ca;outline:none;}
  .card.overall .ops-list summary{color:#fde68a;}
  .ops-list ul{margin:6px 0 0;padding-left:18px;}
  .ops-list li{margin:2px 0;}

  .legend{margin:10px 0 6px;font-size:11px;color:#6b7280;display:flex;gap:14px;flex-wrap:wrap;}
  .legend b{color:#dc2626;} .legend .g b{color:#059669;}

  .note{font-size:11px;color:#92400e;background:#fef3c7;border:1px solid #fde68a;padding:6px 10px;border-radius:8px;display:inline-block;margin-bottom:14px;}

  @media print { .card{break-inside:avoid;} body{background:#fff;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>🚀 腾飞监控看板</h1>
      <div class="sub">按客户名称聚合 · 求和类指标 sum｜比率/ROI/单价/成本类按消耗加权平均 · Benchmark 取消耗最高客户 <b id="benchName" style="color:#4338ca;"></b></div>
    </div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="note">📌 环比变化率为加权估算（按各 OPS 当期消耗作权重）；红▲ 表示上涨，绿▼ 表示下降。每张卡片右侧灰色数值为 Benchmark（消耗最高客户）同指标值，便于横向对照。</div>

  <div class="ctrl">
    <span class="lbl">搜索：</span>
    <input id="search" placeholder="客户简称 / OPS主体..." />
    <span class="lbl">排序：</span>
    <select id="sort"></select>
    <select id="dir">
      <option value="desc" selected>降序</option>
      <option value="asc">升序</option>
    </select>
  </div>

  <div class="legend">
    <span>核心 KPI（顶部 4 格）：消耗(万元) · 下单ROI · CTR · 下单率（若数据无对应列将自动取前 4 个指标）</span>
    <span>环比：<b class="ratio-up arrow-up">上涨</b> ｜ <span class="g"><b class="ratio-dn arrow-dn">下降</b></span></span>
    <span>📐 <b style="color:#a78bfa;">Bench</b> = 消耗最高客户「<b id="benchName2" style="color:#a78bfa;"></b>」同指标值</span>
  </div>

  <div class="grid" id="grid"></div>
</div>

const fmtCompact = (v, digits=2)=>{
  if (v===null||v===undefined||isNaN(v)) return "-";

  if (name===DATA.consume_col) return fmtNum2(v);
  if (name.endsWith("(%)")) return fmtPct(v);
  if (name.includes("元") && !name.includes("万元")) return fmtCompact(v);
  if (name.toLowerCase().includes("roi")) return fmtNum2(v);
  if (SUM_COLS.has(name)) return Math.round(v).toLocaleString("zh-CN");
  return fmtNum2(v);
}

const s = DATA.summary;
document.getElementById("meta").innerHTML = `
  <div class="pill">客户数 <b>${s.n_customers}</b></div>
  <div class="pill">合并主体数 <b>${s.n_ops_total}</b></div>
  <div class="pill">未匹配 <b>${s.n_unmatched}</b></div>
  ${DATA.overall ? `<div class="pill">整体消耗 <b>${fmtNum2((DATA.overall.metrics.find(m=>m.name===DATA.consume_col)||{}).v)} 万元</b></div>` : ''}
`;

// 自动选择 KPI4：优先固定列名，其次取前 4 个指标
const PREFERRED_KPI = ["消耗(万元)","下单ROI","ctr(%)","下单率(%)"];
const allMetricNames = DATA.metric_names;
let KPI4 = PREFERRED_KPI.filter(n=>allMetricNames.includes(n));
if (KPI4.length < 4) {
  for (const n of allMetricNames) {
    if (KPI4.length>=4) break;
    if (!KPI4.includes(n)) KPI4.push(n);
  }
}
const KPI4_LABEL = {"消耗(万元)":"消耗(万元)","下单ROI":"下单ROI","ctr(%)":"CTR","下单率(%)":"下单率"};

// 排序下拉
const sortSel = document.getElementById("sort");
const sortCandidates = KPI4.concat(allMetricNames.filter(n=>!KPI4.includes(n))).slice(0, 12);
sortSel.innerHTML = sortCandidates.map((n,i)=>`<option value="${n}" ${i===0?'selected':''}>${n}</option>`).join("");

function metricByName(card, n){ return card.metrics.find(m=>m.name===n); }

function cardHtml(card, idx, isOverall=false){
  const isBench = !isOverall && card.nick === BENCH.nick;
  const kpi4 = KPI4.map(name=>{
    const m = metricByName(card, name);
    if(!m) return "";
    const bm = BENCH_BY_NAME[name];
    const benchTxt = bm ? formatMetric(name, bm.v) : "-";
    return `<div class="kpi-box">
      <div class="label">${KPI4_LABEL[name]||name}</div>
      <div class="val">${formatMetric(name, m.v)}</div>
      <div class="ratio">${m.has_ratio? ratioHtml(m.r) : '<span style="color:#9ca3af;">-</span>'}</div>
      <div class="bench"><span class="bk">Bench</span><span class="bv">${benchTxt}</span></div>
    </div>`;
  }).join("");

  const others = card.metrics.filter(m=>!KPI4.includes(m.name));
  const otherHeader = `<div class="mhead">
    <span>指标</span><span style="text-align:right;">本客户</span>
    <span style="text-align:right;">环比</span>
    <span class="h-bench" style="text-align:right;">Bench</span>
  </div>`;
  const otherHtml = others.map(m=>{
    const bm = BENCH_BY_NAME[m.name];
    const benchTxt = bm ? formatMetric(m.name, bm.v) : "-";
    return `<div class="metric-row">
      <div class="nm" title="${m.name}">${m.name}</div>
      <div class="vv">${formatMetric(m.name, m.v)}</div>
      <div class="rr">${m.has_ratio? ratioHtml(m.r) : '<span style="color:#9ca3af;">-</span>'}</div>
      <div class="bb">${benchTxt}</div>
    </div>`;
  }).join("");

  let opsBlock = "";
  if (!isOverall){
    if (card.ops_count>1){
      opsBlock = `<details class="ops-list"><summary>包含 ${card.ops_count} 个 OPS 主体（点击展开）</summary>
        <ul>${card.ops_list.map(o=>`<li>${o}</li>`).join("")}</ul></details>`;
    } else {
      opsBlock = `<div class="ops-list">${card.ops_list[0]||""}</div>`;
    }
  } else {
    opsBlock = `<div class="ops-list">全行业 ${DATA.summary.n_ops_total} 个主体合计</div>`;
  }

  const dateBlock = `<div class="date-tag"><div class="d">${DATA.date_label}</div><div>数据更新</div></div>`;
  const benchBadge = isBench ? '<span class="bench-badge">📐 Benchmark</span>' : '';

  return `<div class="card ${isOverall?'overall':''}" data-name="${card.nick}" data-ops="${(card.ops_list||[]).join(' ')}">
    <div class="card-head">
      <div>
        <div class="nick">${isOverall?'📊 ':''}${card.nick}${benchBadge}</div>
        <div class="ops-tag">${isOverall?'整体大盘汇总':(isBench?'消耗最高客户 · 作为 Benchmark 基准':'客户简称')}</div>
      </div>
      ${dateBlock}
    </div>
    <div class="kpi-grid">${kpi4}</div>
    <div class="metric-list">${otherHeader}${otherHtml}</div>
    <div class="foot">${opsBlock}</div>
  </div>`;
}

const grid = document.getElementById("grid");
function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const sortKey = document.getElementById("sort").value;
  const dir = document.getElementById("dir").value;
  let cards = DATA.cards.slice();
  if (q){
    cards = cards.filter(c=>{
      if (c.nick.toLowerCase().includes(q)) return true;
      return (c.ops_list||[]).some(o=>o.toLowerCase().includes(q));
    });
  }
  cards.sort((a,b)=>{
    const va = (a.metrics.find(m=>m.name===sortKey)||{}).v;
    const vb = (b.metrics.find(m=>m.name===sortKey)||{}).v;
    if (va===null||va===undefined||isNaN(va)) return 1;
    if (vb===null||vb===undefined||isNaN(vb)) return -1;
    return dir==="asc"? va-vb : vb-va;
  });
  let html = DATA.overall ? cardHtml(DATA.overall, 0, true) : "";
  cards.forEach((c,i)=>{ html += cardHtml(c, i+1, false); });
  grid.innerHTML = html;
}
document.getElementById("search").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
document.getElementById("dir").addEventListener("change", render);
render();
</script>
</body>
</html>
