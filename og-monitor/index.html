<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>净成交优化 OG 监控看板 · 2026-11-23</title>
<style>
:root{
  --bg:#F7F7F6; --card:#FFFFFF; --line:rgba(0,0,0,.10);
  --t1:#1F1F1D; --t2:#5F5E5A; --t3:#8A8983;
  --blue:#2B5FDD; --deep:#12306E; --aux:#5B7CE2; --pale:#E8F3FF;
  --warn:#D97706; --up:#0F8A4A; --down:#D64545;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:'腾讯体 W3','PingFang SC',sans-serif;font-size:13px;line-height:1.55}
.wrap{max-width:1440px;margin:0 auto;padding:20px 22px 44px}
h1,h2,h3,.w7{font-family:'腾讯体 W7','PingFang SC',sans-serif;font-weight:700}
h1{font-size:22px;margin:0;letter-spacing:.3px}
.sub{color:var(--t2);font-size:12px;margin-top:5px}
.tag{display:inline-block;background:var(--pale);color:var(--deep);border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700;margin-right:6px}
.card{background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px;
  box-shadow:0 1px 2px rgba(18,48,110,.04),0 6px 18px rgba(18,48,110,.03)}
.sec-h{display:flex;align-items:center;gap:9px;margin:0 0 12px;font-size:15px}
.sec-h .no{background:linear-gradient(135deg,var(--blue),var(--deep));color:#fff;border-radius:6px;
  font-size:11px;padding:2px 8px;font-weight:700;letter-spacing:.5px}
.sec-h .q{color:var(--t3);font-size:11.5px;font-weight:400;font-family:'腾讯体 W3'}
.note{color:var(--t2);font-size:11px;line-height:1.6;margin-top:10px}
.note b{color:var(--deep)}
.ok{color:var(--up);font-weight:700}

/* 目标达成（置顶 · 11.22 新增） */
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.goal{background:#fff;border:.5px solid var(--line);border-radius:9px;padding:12px 13px;min-width:0}
.goal .gh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.goal .gl{color:var(--t2);font-size:11px;white-space:normal;min-height:18px}
.goal .st{font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.goal .st.miss{color:var(--warn);background:#FFF4E5}
.goal .st.near{color:var(--blue);background:var(--pale)}
.goal .st.done{color:var(--up);background:#E7F6EE}
.goal .gv{font-family:'腾讯体 W7';font-weight:700;font-size:23px;line-height:1.25;margin-top:7px;white-space:nowrap}
.goal .gv small{font-size:12px;font-weight:400;color:var(--t2);margin-left:2px}
.goal .gt{font-size:11px;color:var(--t3);margin-left:8px}
.goal .gr{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-top:8px}
.goal .gr b{font-weight:700}
.goal .gr b.miss{color:var(--warn)} .goal .gr b.near{color:var(--blue)} .goal .gr b.done{color:var(--up)}
.goal .gtrack{height:6px;background:#EDEDEA;border-radius:3px;overflow:hidden;margin-top:8px}
.goal .gfill{height:100%;border-radius:3px}
.goal .gfill.miss{background:var(--warn)} .goal .gfill.near{background:var(--blue)} .goal .gfill.done{background:var(--up)}

/* 00 KPI */
.kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi .k{background:linear-gradient(180deg,#fff,#FBFBFA);border:.5px solid var(--line);border-radius:9px;padding:12px 13px;min-width:0}
.kpi .k .lab{color:var(--t2);font-size:11px;white-space:normal;min-height:18px}
.kpi .k .val{font-family:'腾讯体 W7';font-weight:700;font-size:23px;line-height:1.25;margin-top:4px;white-space:nowrap}
.kpi .k .val small{font-size:12px;font-weight:400;color:var(--t2);margin-left:2px}
.kpi .k .ext{font-size:11px;color:var(--t3);margin-top:3px;white-space:normal}
.up{color:var(--up)} .down{color:var(--down)} .neutral{color:var(--t2)}

/* 01 口径分层 */
.lay{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.lay .nm{font-size:12px;color:var(--t1);white-space:normal}
.lay .vv{font-size:12px;color:var(--t2);white-space:nowrap;font-variant-numeric:tabular-nums}
.lay .vv b{color:var(--t1);font-family:'腾讯体 W7';font-weight:700;font-size:13px}
.bar-track{height:16px;background:#F0F2F7;border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--aux),var(--blue));min-width:2px}
.bar-fill.total{background:linear-gradient(90deg,#C7D4F5,var(--aux))}
.bar-fill.non{background:linear-gradient(90deg,#D8DCE4,#AEB6C6)}
.bar-wrap{display:flex;align-items:center;gap:9px}
.bar-wrap .track{flex:1}

/* 02 分层 */
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.seg{border:.5px solid var(--line);border-radius:9px;padding:12px;background:#FCFCFB;min-width:0}
.seg .sn{font-size:12px;font-weight:700;color:var(--deep);font-family:'腾讯体 W7'}
.seg .sc{font-size:21px;font-family:'腾讯体 W7';font-weight:700;margin:5px 0 2px}
.seg .sc small{font-size:11px;color:var(--t2);font-weight:400}
.seg .sd{font-size:11px;color:var(--t2);white-space:normal}

/* 03 明细表 */
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{border:.5px solid var(--line);background:#fff;color:var(--t2);border-radius:6px;padding:5px 11px;font-size:11.5px;cursor:pointer;font-family:'腾讯体 W3'}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.search{margin-left:auto;border:.5px solid var(--line);border-radius:6px;padding:5px 10px;font-size:11.5px;width:190px;font-family:'腾讯体 W3';outline:none}
.search:focus{border-color:var(--blue)}
.tbl-wrap{overflow-x:auto;border:.5px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:11.5px;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:#F4F6FB;color:var(--deep);font-family:'腾讯体 W7';font-weight:700;
  font-size:11px;text-align:right;padding:9px 10px;border-bottom:1.5px solid #D8E0F2;white-space:nowrap;z-index:2}
thead th:first-child{text-align:left}
thead th.srt{cursor:pointer;user-select:none}
thead th.srt:hover{background:#EAF0FC}
tbody td{padding:7px 10px;text-align:right;border-bottom:.5px solid #EFF0F2;white-space:nowrap}
tbody td:first-child{text-align:left;white-space:normal;min-width:170px;max-width:290px}
tbody tr:hover{background:#F8FAFF;cursor:pointer}
tbody tr.dim td{color:var(--t3)}
.empty{color:var(--t3);padding:18px;text-align:center}

/* 04 异动 */
.alerts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.al{border:.5px solid var(--line);border-radius:9px;padding:12px 13px;background:#FCFCFB;min-width:0}
.al .ah{font-size:12px;font-family:'腾讯体 W7';font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.al .ah .dot{width:7px;height:7px;border-radius:50%}
.al ul{list-style:none;margin:0;padding:0}
.al li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:.5px dashed #E7E8EC;font-size:11.5px}
.al li:last-child{border-bottom:0}
.al li .nm{color:var(--t1);white-space:normal;word-break:break-all;flex:1;min-width:0}
.al li .vv{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.al .none{color:var(--t3);font-size:11.5px;padding:8px 0}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(18,24,40,.42);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:13px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px;
  box-shadow:0 18px 60px rgba(18,48,110,.22)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.modal .mh h3{margin:0;font-size:16px}
.modal .mh .ms{color:var(--t2);font-size:11px;margin-top:3px}
.x{border:0;background:#F0F2F7;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:15px;color:var(--t2)}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mk{border:.5px solid var(--line);border-radius:9px;padding:11px 12px;background:#FCFCFB}
.mk .kn{font-size:12px;font-family:'腾讯体 W7';font-weight:700;color:var(--deep);margin-bottom:7px}
.mk .kv{font-size:20px;font-family:'腾讯体 W7';font-weight:700}
.mk .kv small{font-size:11px;color:var(--t2);font-weight:400}
.mk .kr{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 10px;margin-top:8px;font-size:11px;color:var(--t2)}
.mk .kr span b{color:var(--t1);font-weight:700}

@media(max-width:900px){
  .wrap{padding:14px 12px 30px}
  .card{padding:12px 12px}
  .kpi{grid-template-columns:repeat(2,1fr)}
  /* 5 格排 2 列会左 3 右 2 留空洞 → 末卡跨满整行，2+2+1 视觉齐平 */
  .kpi .k:last-child{grid-column:1/-1}
  .segs{grid-template-columns:repeat(2,1fr)}
  .alerts{grid-template-columns:1fr}
  .mgrid{grid-template-columns:1fr}
  .lay{grid-template-columns:112px 1fr;gap:6px 8px}
  .search{margin-left:0;width:100%}
  .kpi .k .val{font-size:19px}
  .goals{grid-template-columns:repeat(2,1fr)}
  .goal:last-child{grid-column:1/-1}
  .goal .gv{font-size:19px}
}
</style>
</head>

  <!-- 02 客户分层 -->
  <div class="card">

    <div class="segs" id="segs"></div>
    <div class="note" id="segNote"></div>
  </div>

  <!-- 03 客户明细 -->
  <div class="card">
    <div class="sec-h"><span class="no">03</span>客户明细<span class="q">逐个客户 4 口径表现，点击行看对比卡</span></div>
    <div class="tools">
      <div class="tabs" id="tabs"></div>
      <input class="search" id="search" placeholder="搜索客户简称…">
    </div>
    <div class="tbl-wrap">
      <table id="tbl">
        <thead><tr id="th"></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="note" id="tblNote"></div>
  </div>

  <!-- 04 异动监控 -->
  <div class="card">
    <div class="sec-h"><span class="no">04</span>异动监控<span class="q">谁掉量、谁起量、谁零消耗、谁退款异常</span></div>
    <div class="alerts" id="alerts"></div>
    <div class="note" id="alertNote"></div>
  </div>

</div>

function fmt(v,d=2){
  if(v===null||v===undefined||!isFinite(v)) return '-';
  return Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function pct(v,d=1){ return v===null||v===undefined||!isFinite(v) ? '-' : fmt(v,d)+'%'; }
function sgn(v,d=2){ return v===null||v===undefined||!isFinite(v) ? '-' : (v>0?'+':'')+fmt(v,d); }
function cls(v){ return v===null||v===undefined||!isFinite(v)?'neutral':(v>0?'up':(v<0?'down':'neutral')); }
function delta(v,d=2){ return '<span class="'+cls(v)+'">'+sgn(v,d)+'</span>'; }

  {k:'share', t:'占该客户%', n:true},
  {k:'delta', t:'环比变化量(万)', n:true},
  {k:'pct', t:'环比变化率%', n:true},
  {k:'proj', t:'有消耗项目数', n:true},
  {k:'online', t:'在线项目数', n:true},
  {k:'roi', t:'下单ROI', n:true},
  {k:'r1', t:'1h退款%', n:true},
  {k:'r24', t:'24h退款%', n:true},
];
(function(){
  $('#tabs').innerHTML=VIEWS.map(v=>'<button class="tab'+(v.id===cur?' on':'')+'" data-v="'+v.id+'">'+v.label+'</button>').join('');
  $('#tabs').addEventListener('click',e=>{
    const b=e.target.closest('.tab'); if(!b) return;
    cur=b.dataset.v;
    [...$('#tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.v===cur));
    renderTable();
  });
  $('#search').addEventListener('input',e=>{query=e.target.value.trim();renderTable();});
  $('#th').innerHTML=COLS.map(c=>'<th class="srt" data-k="'+c.k+'">'+c.t+'</th>').join('');
  $('#th').addEventListener('click',e=>{
    const th=e.target.closest('th'); if(!th) return;
    const k=th.dataset.k;
    if(sortKey===k) sortDir=-sortDir; else {sortKey=k;sortDir=-1;}
    renderTable();
  });
  $('#tb').addEventListener('click',e=>{
    const tr=e.target.closest('tr[data-n]'); if(!tr) return;
    openClient(tr.dataset.n);
  });
  renderTable();
  $('#tblNote').innerHTML='三个视图均为<b>客户名单维度</b>，数值统一取该客户<b>整体口径</b>；'
    +'使用 / 未使用按源表<b>「是否使用净成交」</b>列划分（是 '+P.meta.nUsed+' 家 / 否 '+P.meta.nNonUsed+' 家）。'
    +'本表为 ADQ 投放端客户 '+P.meta.nClients+' 家，其中 '+P.meta.nMissingCost+' 家当日整体消耗为空，显示「-」。'
    +'「净成交占比%」= 净成交消耗 / 该客户整体消耗。点击任意行看该客户 4 口径对比卡。';
})();

function renderTable(){
  let rows=P.clients.map(c=>{
    const r=c.k['整体'];
    return {name:c.name, used:c.used, net:c.net, netShare:c.netShare,
            cost:r.cost, share:r.share, delta:r.delta, pct:r.pct,
            proj:r.proj, online:r.online, roi:r.roi, r1:r.r1, r24:r.r24};
  });
  if(cur==='使用净成交') rows=rows.filter(r=>r.used);
  else if(cur==='未使用净成交') rows=rows.filter(r=>!r.used);
  if(query) rows=rows.filter(r=>r.name.indexOf(query)>=0);
  rows.sort((a,b)=>{
    if(sortKey==='name') return sortDir*a.name.localeCompare(b.name,'zh');
    const x=a[sortKey], y=b[sortKey];
    if(x===null||x===undefined||!isFinite(x)) return 1;
    if(y===null||y===undefined||!isFinite(y)) return -1;
    return sortDir*(x-y);
  });
  if(!rows.length){
    const emptyTxt=query?'无匹配客户':'该视图暂无客户';
    $('#tb').innerHTML='<tr><td colspan="12" class="empty">'+emptyTxt+'</td></tr>';return;
  }
  const cell=(v,d=2)=>v===null||v===undefined||!isFinite(v)?'-':fmt(v,d);
  $('#tb').innerHTML=rows.map(r=>{
    const dim=(r.cost===null||r.cost===0)?' class="dim"':'';
    return '<tr'+dim+' data-n="'+r.name.replace(/"/g,'&quot;')+'">'
      +'<td>'+r.name+'</td>'
      +'<td>'+cell(r.net,2)+'</td>'
      +'<td>'+pct(r.netShare,2)+'</td>'
      +'<td>'+cell(r.cost,2)+'</td>'
      +'<td>'+pct(r.share,2)+'</td>'
      +'<td>'+delta(r.delta,2)+'</td>'
      +'<td>'+(r.pct===null||r.pct===undefined||!isFinite(r.pct)?'-':'<span class="'+cls(r.pct)+'">'+sgn(r.pct,1)+'%</span>')+'</td>'
      +'<td>'+cell(r.proj,0)+'</td>'
      +'<td>'+cell(r.online,0)+'</td>'
      +'<td>'+cell(r.roi,2)+'</td>'
      +'<td>'+pct(r.r1,2)+'</td>'
      +'<td>'+pct(r.r24,2)+'</td>'
      +'</tr>';
  }).join('');
}

/* ---------- 弹窗 ---------- */
function openClient(name){
  const c=P.clients.find(x=>x.name===name); if(!c) return;
  const mk=(key)=>{
    const r=c.k[key];
    const kv=(v,d=2)=>v===null||v===undefined||!isFinite(v)?'-':fmt(v,d);
    return '<div class="mk"><div class="kn">'+KLABEL[key]+'</div>'
      +'<div class="kv">'+kv(r.cost,2)+'<small> 万</small></div>'
      +'<div class="kr">'
      +'<span>占该客户 <b>'+pct(r.share,2)+'</b></span>'
      +'<span>环比变化量 <b>'+delta(r.delta,2)+'</b> 万</span>'
      +'<span>环比变化率 <b>'+(r.pct===null?'-':'<span class="'+cls(r.pct)+'">'+sgn(r.pct,1)+'%</span>')+'</b></span>'
      +'<span>有消耗/在线项目 <b>'+kv(r.proj,0)+' / '+kv(r.online,0)+'</b></span>'
      +'<span>下单 ROI <b>'+kv(r.roi,2)+'</b></span>'
      +'<span>1h / 24h 退款 <b>'+pct(r.r1,2)+' / '+pct(r.r24,2)+'</b></span>'
      +'</div></div>';
  };
  $('#modal').innerHTML='<div class="mh"><div><h3>'+c.name+'</h3><div class="ms">4 口径对比 · 数据日 '
    +P.meta.dataDate+' · 净成交 233 合计 '+fmt(c.net,2)+' 万（占该客户 '+pct(c.netShare,2)+'）</div></div>'
    +'<button class="x" id="mx">×</button></div><div class="mgrid">'+KINDS.map(mk).join('')+'</div>';
  $('#mask').classList.add('on');
  $('#mx').onclick=closeModal;
}
function closeModal(){$('#mask').classList.remove('on');}
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- 04 异动 ---------- */
(function(){
  const A=P.alerts;
  const li=(x,v,color)=>'<li><span class="nm">'+x+'</span><span class="vv '+(color||'')+'">'+v+'</span></li>';
  const box=(title,color,items,empty,full)=>'<div class="al"'+(full?' style="grid-column:1/-1"':'')+'><div class="ah"><span class="dot" style="background:'+color+'"></span>'+title+'</div>'
    +(items.length?'<ul>'+items.join('')+'</ul>':'<div class="none">'+empty+'</div>')+'</div>';

  const down=A.down.map(x=>li(x.name, sgn(x.delta,2)+' 万','down'));
  const up=A.up.map(x=>li(x.name, '+'+fmt(x.delta,2)+' 万','up'));
  const lowpen=[li('共 '+A.lowPenBig.n+' 家 / 整体消耗 '+fmt(A.lowPenBig.cost)+' 万','','down')]
    .concat(A.lowPenBig.top.map(x=>li(x.name, fmt(x.total,2)+' 万 · 渗透 '+fmt(x.share,1)+'%')));
  const refund=A.highRefund.map(x=>li(x.name, fmt(x.r24,1)+'%','down'));

  $('#alerts').innerHTML=
     box('净成交掉量 Top'+A.thresholds.top,'var(--down)',down,'本期无净成交掉量客户')
    +box('净成交起量 Top'+A.thresholds.top,'var(--up)',up,'本期无净成交起量客户')
    +box('低渗透大客户（净成交占比 <'+A.lowPenBig.threshold+'%）','var(--warn)',lowpen,'无')
    +box('24h 退款率 ≥ '+A.thresholds.refund+'%（需关注）','var(--warn)',refund,'本期无超阈值客户',true);
  $('#alertNote').innerHTML='判定口径：掉量 / 起量按<b>净成交 233 环比变化量</b>绝对值降序取 Top '
    +A.thresholds.top+'；低渗透大客户 = 净成交占该客户消耗% &lt; '+A.lowPenBig.threshold
    +'% 且整体消耗 > 0，按整体消耗降序（<b>渗透机会，不是明细搬家</b>）；'
    +'高退款 = 整体行「下单后24小时退款率%」≥ '+A.thresholds.refund+'%（客户整体口径；是否切到分片口径待拍板）。'
    +'「有消耗但零净成交」'+A.zeroNet.n+' 家（未使用净成交 '+P.meta.nNonUsed+' 家），'
    +'低渗透大客户按整体消耗取前 '+A.thresholds.top+' 家。'
    +' 本表为 <b>ADQ 投放端</b>口径（整体 '+fmt(P.kpi.totalCost)+' 万），不与全投放端大盘混用。';
})();
</script>
</body>
