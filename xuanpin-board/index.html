<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>服饰各行业选品看板</title>
<style>
:root{
  --bg:#eef3fb; --card:#ffffff; --ink:#1a2740; --sub:#67748e;
  --line:#e2e9f5; --blue:#2f6bff; --blue-d:#1c4fd6; --blue-soft:#eaf1ff;
  --good:#1aa97a; --warn:#e8533f; --gold:#e0992a; --shadow:0 6px 22px rgba(31,68,140,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#eef3fb 0%,#e6edfa 100%);color:var(--ink);min-height:100vh;line-height:1.5}
.wrap{max-width:1480px;margin:0 auto;padding:26px 28px 60px}
.hero{background:linear-gradient(120deg,#2f6bff 0%,#4f86ff 55%,#6aa0ff 100%);
  border-radius:20px;padding:26px 30px;color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(47,107,255,.25)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:230px;height:230px;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);border-radius:50%}
.hero .row1{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:relative;z-index:2}
.hero h1{font-size:25px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.hero h1 .dot{width:10px;height:10px;background:#bfe;border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.periodbox{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:6px 8px 6px 14px;border-radius:30px;font-size:13px;font-weight:600}
.periodbox .pdot{width:6px;height:6px;border-radius:50%;background:#bfe}
.periodbox select{background:rgba(255,255,255,.15);border:0;color:#fff;font:inherit;padding:3px 26px 3px 10px;border-radius:20px;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23ffffff' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
.periodbox select option{color:#1a2740}
.periodbox .pby{padding-left:8px;border-left:1px solid rgba(255,255,255,.35);font-weight:400;opacity:.92}
.periodbox .badge{background:rgba(255,255,255,.28);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.tabs{display:flex;gap:8px;margin:20px 0 4px;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:30px;background:#fff;border:1px solid var(--line);color:var(--sub);
  font-size:13.5px;font-weight:600;cursor:pointer;transition:.18s;box-shadow:var(--shadow)}
.tab:hover{color:var(--blue)}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 6px 16px rgba(47,107,255,.32)}
.tab .cnt{font-size:11px;opacity:.7;margin-left:5px}
.stats{display:flex;gap:14px;margin:18px 0 6px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 20px;min-width:120px;box-shadow:var(--shadow);flex:1}
.stat .n{font-size:23px;font-weight:800;color:var(--blue)}
.stat .l{font-size:12px;color:var(--sub);margin-top:3px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin:16px 0 22px;box-shadow:var(--shadow)}
.toolbar input,.toolbar select{background:#f6f9ff;border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:9px 13px;font-size:13px;outline:none;transition:.15s}
.toolbar input:focus,.toolbar select:focus{border-color:var(--blue);background:#fff}
.toolbar input{flex:1;min-width:200px}
.toolbar label{font-size:12px;color:var(--sub);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow);transition:.22s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(31,68,140,.14)}
.thumb{width:100%;aspect-ratio:9/16;background:#f0f4fb;position:relative;overflow:hidden;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa7c0;font-size:13px}
.thumb .play{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.5));display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;font-size:34px;color:#fff}
.card:hover .thumb .play{opacity:1}
.body{padding:14px 15px 15px}
.name{font-size:15px;font-weight:700;margin-bottom:8px}
.sell{background:linear-gradient(180deg,#f5f9ff,#eef4ff);border:1px solid #dbe6f9;border-radius:12px;padding:9px 11px;margin-bottom:9px}
.selltop{display:flex;justify-content:space-between;font-size:11px;color:#5c7099;margin-bottom:4px;font-weight:600}
.sellrow{display:flex;gap:6px;font-size:11.5px;line-height:1.5;padding:2px 0}
.sellk{color:#8395b3;flex-shrink:0;min-width:36px}
.sellv{color:#334562;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px;align-items:center}
.toolk{font-size:10.5px;color:#8395b3}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
.tag.tool{background:#eef1ff;color:#4f66d1;border:1px solid #d9e0ff}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:6px}
.m{background:#fafcff;border:1px solid #eff3fa;border-radius:9px;padding:7px 9px}
.m.roi{background:#f0faf5;border-color:#cceadb}
.m .mv{font-size:14px;font-weight:800;color:var(--ink)}
.m .ml{font-size:10.5px;color:var(--sub);margin-top:1px}
.m .bar{height:3px;background:#e6ecf7;border-radius:3px;margin-top:5px;overflow:hidden}
.m .bar i{display:block;height:100%;border-radius:3px}
.m.refund .mv{color:var(--gold)}
.m.refund.high .mv{color:var(--warn)}
.linkrow{display:flex;gap:6px;margin-top:9px}
.btn{flex:1;font-size:11.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#f5f8ff;color:var(--ink);cursor:pointer;transition:.15s;text-align:center;text-decoration:none;font-weight:600}
.btn:hover{background:var(--blue-soft);border-color:#c9d6ff}
.btn.copy{background:#eaf1ff;border-color:#c9d6ff;color:var(--blue-d)}
.btn.open{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.open:hover{background:var(--blue-d)}
.modal{position:fixed;inset:0;background:rgba(15,25,50,.85);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
.modal.open{display:flex}
.modal video{max-width:90vw;max-height:85vh;background:#000;border-radius:14px}
.modal .close{position:absolute;top:18px;right:24px;color:#fff;font-size:34px;cursor:pointer;user-select:none;background:rgba(255,255,255,.15);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(20,30,50,.92);color:#fff;padding:10px 22px;border-radius:26px;font-size:13px;opacity:0;transition:.28s;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:#9aa7c0;padding:50px;text-align:center;grid-column:1/-1}
.loading{text-align:center;padding:80px 20px;color:#9aa7c0;font-size:14px}
footer{text-align:center;color:#9aa7c0;font-size:12px;margin-top:34px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="row1">
      <h1><span class="dot"></span>服饰各行业选品看板</h1>
      <div class="periodbox">
        <span class="pdot"></span>数据周期
        <select id="periodSel"></select>
        <span class="pby">按周更新</span>
        <span class="badge" id="periodCnt">—</span>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input id="q" placeholder="搜索品类 / 卖点关键词...">
    <label>排序</label>
    <select id="sort">
      <option value="roi_v">下单ROI 高→低</option>
      <option value="cvr_v">下单率 高→低</option>
      <option value="ctr_v">点击率 高→低</option>
      <option value="price_v">客单价 高→低</option>
      <option value="refund_v_asc">退款率 低→高</option>
    </select>
    <label>优化目标</label>
    <select id="tool">
      <option value="">全部</option>
      <option value="智能投放">含智能投放</option>
      <option value="下单">下单优化</option>
    </select>
  </div>

  <div class="grid" id="grid"><div class="loading">加载中...</div></div>
</div>

<div class="modal" id="modal"><span class="close" onclick="closeV()">&times;</span><video id="v" controls></video></div>
<div class="toast" id="toast">链接已复制</div>

<script>
const $ = s => document.querySelector(s);
const INDORDER = ['女装','男装','贴身衣物','箱包鞋靴','鞋靴','箱包','配饰','运动鞋服','运动用品','珠宝文玩'];
let DATA = [];
let curInd = '全部';
let curPeriod = '';
let PERIODS = [];

async function loadIndex(){
  const r = await fetch('data/products-index.json?_=' + Date.now());
  const idx = await r.json();
  PERIODS = idx.periods;
  curPeriod = idx.latest;
  const sel = $('#periodSel');
  sel.innerHTML = PERIODS.map(p=>`<option value="${p.id}">${p.label}</option>`).join('');
  sel.value = curPeriod;
  sel.addEventListener('change', ()=>{ curPeriod = sel.value; loadPeriod(); });
  await loadPeriod();
}
async function loadPeriod(){
  $('#grid').innerHTML = '<div class="loading">加载中...</div>';
  const r = await fetch('data/' + curPeriod + '.json?_=' + Date.now());
  const raw = await r.json();
  DATA = raw.data || raw;
  const meta = PERIODS.find(p=>p.id===curPeriod);
  $('#periodCnt').textContent = (meta?meta.count:DATA.length) + ' 款';
  curInd = '全部';
  renderTabs(); renderStats(); render();
}
function industries(){
  const set=[...new Set(DATA.map(d=>d.industry))];
  set.sort((a,b)=>{let ia=INDORDER.indexOf(a),ib=INDORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  return ['全部',...set];
}
function scope(){ return curInd==='全部'?DATA:DATA.filter(d=>d.industry===curInd); }
function renderTabs(){
  $('#tabs').innerHTML = industries().map(ind=>{
    const c = ind==='全部'?DATA.length:DATA.filter(d=>d.industry===ind).length;
    return `<div class="tab ${ind===curInd?'active':''}" onclick="setInd('${ind}')">${ind}<span class="cnt">${c}</span></div>`;
  }).join('');
}
function setInd(ind){ curInd=ind; renderTabs(); renderStats(); render(); }
function avg(k){ const s=scope().filter(d=>d[k]>0); return s.length? s.reduce((a,b)=>a+b[k],0)/s.length : 0; }
function renderStats(){
  const items=[
    ['款商品', scope().length],
    ['平均下单ROI', avg('roi_v').toFixed(1)],
    ['平均下单率', avg('cvr_v').toFixed(1)+'%'],
    ['平均客单价', '¥'+avg('price_v').toFixed(0)],
    ['平均退款区间下界', avg('refund_v').toFixed(0)+'%'],
  ];
  $('#stats').innerHTML = items.map(i=>`<div class="stat"><div class="n">${i[1]}</div><div class="l">${i[0]}</div></div>`).join('');
}
function maxOf(k){ const s=scope(); return Math.max(...s.map(d=>d[k]),0.0001); }
function card(p,i){
  const refHigh = p.refund_v>=45;
  const hasRef = p.refund_v>=0;
  const roiMax=maxOf('roi_v'),ctrMax=maxOf('ctr_v'),cvrMax=maxOf('cvr_v'),refMax=maxOf('refund_v');
  const sellHtml = (p.sellList&&p.sellList.length)
    ? `<div class="sell"><div class="selltop"><span class="selll">爆品卖点</span></div>${p.sellList.map(s=>`<div class="sellrow"><span class="sellk">${s.k}</span><span class="sellv">${s.v}</span></div>`).join('')}</div>`
    : '';
  return `<div class="card">
   <div class="thumb">
     ${p.img?`<img src="${p.img.startsWith('data:')?p.img:'data:image/jpeg;base64,'+p.img}" loading="lazy">`:'<div class="noimg">无素材 · 暂无图</div>'}
     ${p.video?`<div class="play" onclick="playV('${p.video}')"><span>&#9654;</span></div>`:''}
   </div>
   <div class="body">
     <div class="name">${p.category}</div>
     ${sellHtml}
     <div class="tags"><span class="toolk">优化目标</span><span class="tag tool">${p.tool||'—'}</span></div>
     <div class="metrics">
       <div class="m roi"><div class="mv">${p.roi||'—'}</div><div class="ml">下单ROI</div><div class="bar"><i style="width:${p.roi_v/roiMax*100}%;background:var(--good)"></i></div></div>
       <div class="m"><div class="mv">¥${p.price||'—'}</div><div class="ml">下单单价</div></div>
       <div class="m"><div class="mv">${p.ctr?p.ctr+'%':'—'}</div><div class="ml">点击率 CTR</div><div class="bar"><i style="width:${p.ctr_v/ctrMax*100}%;background:var(--blue)"></i></div></div>
       <div class="m"><div class="mv">${p.cvr?p.cvr+'%':'—'}</div><div class="ml">下单率</div><div class="bar"><i style="width:${p.cvr_v/cvrMax*100}%;background:var(--blue)"></i></div></div>
       <div class="m refund ${refHigh?'high':''}" style="grid-column:span 2"><div class="mv">${p.refund}</div><div class="ml">7日退款率(5%区间)</div>${hasRef?`<div class="bar"><i style="width:${p.refund_v/refMax*100}%;background:${refHigh?'var(--warn)':'var(--gold)'}"></i></div>`:''}</div>
     </div>
     <div class="linkrow">
       <button class="btn copy" onclick='copyLink(this,${JSON.stringify(p.video||"")})'>&#128203; 复制素材链接</button>
       ${p.video?`<a class="btn open" href="${p.video}" target="_blank">预览</a>`:''}
     </div>
   </div>
  </div>`;
}
function render(){
  const q=$('#q').value.trim(), sort=$('#sort').value, tool=$('#tool').value;
  let list=scope().filter(p=>(!q||p.category.includes(q)||(p.sellList||[]).some(s=>s.v.includes(q)))&&(!tool||(p.tool||'').includes(tool)));
  if(sort==='refund_v_asc') list.sort((a,b)=>(a.refund_v<0?999:a.refund_v)-(b.refund_v<0?999:b.refund_v));
  else list.sort((a,b)=>b[sort]-a[sort]);
  $('#grid').innerHTML = list.length? list.map((p,i)=>card(p,i)).join('') : '<div class="empty">无匹配商品</div>';
}
function copyLink(btn,url){
  if(!url){ showToast('该商品无素材链接'); return; }
  const done=()=>{ showToast('素材链接已复制'); const o=btn.innerHTML; btn.innerHTML='&#10003; 已复制'; setTimeout(()=>btn.innerHTML=o,1400); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>fallback(url,done));
  } else fallback(url,done);
}
function fallback(text,cb){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ prompt('手动复制链接:',text); }
  document.body.removeChild(ta);
}
let toastT;
function showToast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600); }
function playV(u){ if(/\.(mp4)/i.test(u)){ $('#v').src=u; $('#modal').classList.add('open'); } else window.open(u); }
function closeV(){ $('#modal').classList.remove('open'); $('#v').pause(); $('#v').src=''; }
$('#modal').onclick=e=>{ if(e.target.id==='modal') closeV(); };
['q','sort','tool'].forEach(id=>$('#'+id).addEventListener('input',render));

loadIndex().catch(e=>{
  console.error('[xuanpin] load error:', e, 'stack:', e.stack);
  $('#grid').innerHTML = '<div class="empty">加载失败: '+e.message+'<br><small style="color:#999">请F12打开Console截图给AI排查</small></div>';
});
</script>
</body>
</html>
