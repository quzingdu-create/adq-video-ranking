<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服饰销售作战中心 v3.2</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f5f7fb; color:#1f2937; }
.container { max-width:480px; margin:0 auto; padding:24px 16px; }
.hero { text-align:center; padding:40px 0 32px; }
.hero h1 { font-size:22px; font-weight:700; color:#1e40af; margin-bottom:8px; }
.hero p { font-size:14px; color:#6b7280; }
.cards { display:flex; flex-direction:column; gap:16px; margin-top:8px; }
.card { background:#fff; border-radius:16px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.06); cursor:pointer; transition:transform 0.15s, box-shadow 0.15s; text-decoration:none; color:inherit; display:block; }
.card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.1); }
.card h2 { font-size:17px; font-weight:600; margin-bottom:6px; }
.card p { font-size:13px; color:#6b7280; line-height:1.5; }
.card .icon { font-size:28px; margin-bottom:12px; }
.card .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; margin-top:8px; }
.badge-blue { background:#eff6ff; color:#2563eb; }
.badge-green { background:#ecfdf5; color:#059669; }
.footer { text-align:center; margin-top:32px; font-size:12px; color:#9ca3af; }
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>服饰销售作战中心</h1>
    <p>v3.2 · 拓新组定制版 · 2026-05-15</p>
  </div>
  <div class="cards">
    <a class="card" href="sales_center_mobile.html">
      <div class="icon">📱</div>
      <h2>手机端看板</h2>
      <p>今日核心盘 · 够一够冲1000 · Top有效新客 · 拓客登记</p>
      <span class="badge badge-green">手机推荐</span>
    </a>
    <a class="card" href="sales_center_pc.html">
      <div class="icon">🖥️</div>
      <h2>PC端完整看板</h2>
      <p>4 Tab：今日待办小红点 / 拓客作战看板 / 信息同步库 / 专项进展</p>
      <span class="badge badge-blue">电脑端打开</span>
    </a>
  </div>
  <div class="footer">数据截至 2026-05-14 · ADQ服饰中心拓新组</div>
</div>
</body>
</html>
