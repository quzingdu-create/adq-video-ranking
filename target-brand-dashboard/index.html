<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>靶向品牌投放看板</title>
<style>
:root{
  --bg:#0d1030; --bg2:#161a4a; --card:#1b2152; --card2:#272f6b;
  --line:#3b4694; --txt:#f5f8ff; --muted:#aab4ec;
  --cyan:#22e6ee; --green:#46e87a; --orange:#ffa62e; --pink:#ff5fa2;
  --purple:#a982ff; --yellow:#ffd23f; --blue:#4d9bff; --red:#ff6079;
  --grad-jl:linear-gradient(135deg,#22e6ee,#46e87a);
  --grad-tf:linear-gradient(135deg,#ffa62e,#ff5fa2);
  --grad-k1:linear-gradient(135deg,#7c5cff,#4d9bff);
  --grad-k2:linear-gradient(135deg,#22e6ee,#46e87a);
  --grad-k3:linear-gradient(135deg,#ffa62e,#ff5fa2);
  --grad-k4:linear-gradient(135deg,#ffd23f,#ff8a3d);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:
    radial-gradient(900px 500px at 10% -8%,rgba(124,92,255,.32),transparent 60%),
    radial-gradient(820px 480px at 88% 2%,rgba(34,230,238,.24),transparent 60%),
    radial-gradient(720px 520px at 68% 102%,rgba(255,95,162,.22),transparent 60%),
    linear-gradient(160deg,#0d1030 0%,#161a47 100%);
  color:var(--txt);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:22px 26px 60px;min-height:100vh}
h1{font-size:24px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.sub{color:var(--muted);font-size:13px;margin:6px 0 18px}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:20px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label{font-size:12px;color:var(--muted);font-weight:600}
select,.toggle{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:9px;
  padding:8px 12px;font-size:13px;outline:none;cursor:pointer;font-weight:600}
.toggle{display:flex;align-items:center;gap:8px;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--cyan);cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:6px 0 24px}
.kpi{background:var(--grad-k1);border:1px solid rgba(255,255,255,.18);
  border-radius:18px;padding:18px 20px;position:relative;overflow:hidden;
  box-shadow:0 10px 30px rgba(124,92,255,.28)}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:rgba(255,255,255,.25);filter:blur(10px)}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.kpi .l{font-size:13px;color:rgba(255,255,255,.92);margin-top:6px;font-weight:600}
.kpi.c2{background:var(--grad-k2);box-shadow:0 10px 30px rgba(34,230,238,.25)}
.kpi.c3{background:var(--grad-k3);box-shadow:0 10px 30px rgba(255,95,162,.25)}
.kpi.c4{background:var(--grad-k4);box-shadow:0 10px 30px rgba(255,138,61,.25)}
.tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:10px 20px;
  border-radius:11px;cursor:pointer;font-weight:700;font-size:14px;transition:.15s}
.tab.active{color:#06122b;background:linear-gradient(135deg,var(--cyan),var(--green));border-color:transparent;
  box-shadow:0 6px 20px rgba(0,229,255,.3)}
.panel{display:none}
.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  transition:.15s}
.card:hover{border-color:var(--pink);box-shadow:0 10px 30px rgba(255,95,162,.22);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.card .nm{font-size:16px;font-weight:800}
.card .dn{font-size:12px;color:var(--muted)}
.bars{margin-top:12px;display:flex;flex-direction:column;gap:13px}
.bar .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:var(--muted)}
.bar .row b{color:var(--txt);font-size:13px}
.track{height:13px;border-radius:8px;background:#0c1430;overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fill.jl{background:var(--grad-jl)}
.fill.tf{background:var(--grad-tf)}
.mini{display:flex;gap:16px;margin-top:12px;font-size:12px}
.mini div{color:var(--muted)} .mini b{color:var(--txt)}
.spend{color:var(--yellow)!important;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--card2);color:var(--cyan);font-weight:700;position:sticky;top:0}
tbody tr:hover{background:rgba(0,229,255,.07)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.tag.y{background:rgba(0,230,118,.18);color:var(--green)}
.tag.n{background:rgba(255,23,68,.16);color:var(--red)}
.search{width:100%;max-width:320px;background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:9px 13px;font-size:13px;outline:none}
.note{background:rgba(255,214,0,.08);border:1px solid rgba(255,214,0,.35);border-radius:12px;
  padding:12px 16px;font-size:12.5px;color:var(--yellow);margin:0 0 20px;line-height:1.7}
.note b{color:#fff}
/* ==== 转化漏斗 ==== */
.funnel-wrap{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:18px;padding:18px 22px 22px;margin:0 0 24px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.funnel-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.funnel-head .ttl{font-size:15px;font-weight:800;color:var(--txt)}
.funnel-rates{display:flex;gap:12px;flex-wrap:wrap}
.rate-pill{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 16px;border-radius:12px;
  font-weight:800;color:#06122b;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.rate-pill small{font-size:11px;font-weight:700;opacity:.85}
.rate-pill b{font-size:18px;line-height:1}
.rate-pill.jl{background:var(--grad-jl)}
.rate-pill.tf{background:var(--grad-tf)}
.funnel-body{display:flex;flex-direction:column;align-items:center;gap:8px}
.fl{width:100%;display:flex;justify-content:center}
.fl-bar{position:relative;display:flex;align-items:center;justify-content:space-between;
  height:56px;border-radius:12px;padding:0 22px;color:#fff;font-weight:800;
  transition:width .7s cubic-bezier(.2,.8,.2,1);min-width:150px;
  box-shadow:0 8px 22px rgba(0,0,0,.3);overflow:hidden}
.fl-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.fl-bar .fl-name{font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.fl-bar .fl-val{font-size:22px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.fl1{background:linear-gradient(135deg,#7c5cff,#4d9bff)}
.fl2{background:linear-gradient(135deg,#22e6ee,#46e87a)}
.fl3{background:linear-gradient(135deg,#ffa62e,#ff5fa2)}
.fl-conv{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.fl-conv b{color:var(--yellow)}
</style>
</head>

<h1>🎯 靶向品牌投放情况看板</h1>
<div class="sub">销售 / 服务商双视角 · 建联率 · 投放率 · 投放日耗 &nbsp;|&nbsp; 数据截止 2026-07-05</div>

<div class="kpis" id="kpis"></div>

<div class="funnel-wrap" id="funnel"></div>

<div class="panel active" id="pSales"><div class="grid" id="gSales"></div></div>
<div class="panel" id="pProv"><div class="grid" id="gProv"></div></div>
<div class="panel" id="pType"><div class="grid" id="gType"></div></div>
<div class="panel" id="pDetail">

  <div style="max-height:560px;overflow:auto;border-radius:12px"><table id="tbl">

    <tbody></tbody></table></div>
</div>

  return {n,jy,ty,sp,jr:n?jy/n*100:0,tr:n?ty/n*100:0};
}
function fmt(n){return n.toLocaleString('zh-CN');}
function money(n){return '¥'+Math.round(n).toLocaleString('zh-CN');}

function renderKPIs(rows){
  const m=metrics(rows);
  document.getElementById('kpis').innerHTML=`
   <div class="kpi c1"><div class="v">${fmt(m.n)}</div><div class="l">待引入品牌数</div></div>
   <div class="kpi c2"><div class="v">${m.jr.toFixed(1)}%</div><div class="l">建联率（已建联 ${m.jy}）</div></div>
   <div class="kpi c3"><div class="v">${m.tr.toFixed(1)}%</div><div class="l">投放率（已投放 ${m.ty}）</div></div>
   <div class="kpi c4"><div class="v">${money(SPEND_META.TOTAL_MATCHED_SPEND)}</div>
     <div class="l">日耗（匹配 ${SPEND_META.MATCHED_N} 客户）</div></div>`;
}
function renderFunnel(rows){
  const m=metrics(rows);
  const n=m.n, jy=m.jy, ty=m.ty;
  // 宽度按占分母比例，设最小宽度保证文字可读
  const MIN=26;
  const w1=100;
  const w2=n? Math.max(MIN, jy/n*100):MIN;
  const w3=n? Math.max(MIN, ty/n*100):MIN;
  // 层间转化：建联→投放
  const j2t = jy? (ty/jy*100):0;
  document.getElementById('funnel').innerHTML=`
   <div class="funnel-head">
     <div class="ttl">🔻 转化漏斗（待引入品牌数 → 建联 → 投放）</div>
     <div class="funnel-rates">
       <div class="rate-pill jl"><small>建联率</small><b>${m.jr.toFixed(1)}%</b></div>
       <div class="rate-pill tf"><small>投放率</small><b>${m.tr.toFixed(1)}%</b></div>
     </div>
   </div>
   <div class="funnel-body">
     <div class="fl"><div class="fl-bar fl1" style="width:${w1}%">
        <span class="fl-name">待引入品牌数</span><span class="fl-val">${fmt(n)}</span></div></div>
     <div class="fl-conv">↓ 建联率 <b>${m.jr.toFixed(1)}%</b></div>
     <div class="fl"><div class="fl-bar fl2" style="width:${w2}%">
        <span class="fl-name">建联数</span><span class="fl-val">${fmt(jy)}</span></div></div>
     <div class="fl-conv">↓ 建联→投放 <b>${j2t.toFixed(1)}%</b>（占分母投放率 ${m.tr.toFixed(1)}%）</div>
     <div class="fl"><div class="fl-bar fl3" style="width:${w3}%">
        <span class="fl-name">投放数</span><span class="fl-val">${fmt(ty)}</span></div></div>
   </div>`;
}
function cardHTML(name,sub,mmax,maxv,denom,spendVal){
  const jr=mmax.jr, tr=mmax.tr;
  return `<div class="card"><div class="top"><div class="nm">${name}</div><div class="dn">待引入品牌数 ${fmt(denom)}</div></div>
   <div class="bars">
     <div class="bar"><div class="row"><span>建联率</span><b>${jr.toFixed(1)}% · 已建联 ${mmax.jy}</b></div>
       <div class="track"><div class="fill jl" style="width:${jr}%"></div></div></div>
     <div class="bar"><div class="row"><span>投放率</span><b>${tr.toFixed(1)}% · 已投放 ${mmax.ty}</b></div>
       <div class="track"><div class="fill tf" style="width:${tr}%"></div></div></div>
   </div>
   <div class="mini"><div>日耗 <b class="spend">${money(spendVal)}</b></div><div>未建联 <b>${denom-mmax.jy}</b></div><div>未投放 <b>${denom-mmax.ty}</b></div></div>
   </div>`;
}
function renderSales(rows){
  const g=document.getElementById('gSales'); let h='';
  salesOrder.forEach(s=>{
    const sub=rows.filter(r=>r.sales===s);
    if(!sub.length) return;
    h+=cardHTML(salesName[s],'',metrics(sub),0,sub.length,SPEND_META.SPEND_BY_SALES[s]||0);
  });
  g.innerHTML=h;
}
function renderProv(rows){
  const g=document.getElementById('gProv'); let h='';
  provOrder.forEach(p=>{
    const sub=rows.filter(r=>r.provider===p);
    if(!sub.length) return;
    h+=cardHTML(p,'',metrics(sub),0,sub.length,SPEND_META.SPEND_BY_PROV[p]||0);
  });
  // 无服务商
  const no=rows.filter(r=>r.provider==='无服务商');
  if(no.length) h+=cardHTML('无服务商','',metrics(no),0,no.length,SPEND_META.SPEND_BY_PROV['无服务商']||0);
  g.innerHTML=h;
}
function renderType(rows){
  const g=document.getElementById('gType'); const types=[...new Set(rows.map(r=>r.type))];
  let h='';
  types.sort().forEach(t=>{
    const sub=rows.filter(r=>r.type===t);
    h+=cardHTML(t,'',metrics(sub),0,sub.length,SPEND_META.SPEND_BY_TYPE[t]||0);
  });
  g.innerHTML=h;
}
function renderDetail(rows){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const tb=document.querySelector('#tbl tbody');
  const f=rows.filter(r=>!q || (r.brand+r.sales+r.provider+r.toufangName+r.sales_cn).toLowerCase().includes(q));
  tb.innerHTML=f.slice(0,500).map(r=>`<tr>
    <td>${r.brand}</td><td>${r.type}</td><td>${r.sales}${r.sales_cn?'('+r.sales_cn+')':''}</td>
    <td>${r.provider}</td><td>${r.firstInvest}</td>
    <td><span class="tag ${r.jl_yi?'y':'n'}">${r.jl}</span></td>
    <td><span class="tag ${r.tf_yi?'y':'n'}">${r.tf_yi?'已投放':'未投放'}</span></td>
    <td class="spend">${r.spend>0?money(r.spend):'—'}</td></tr>`).join('');
}
function renderAll(){
  const rows=getFiltered();
  renderKPIs(rows); renderFunnel(rows); renderSales(rows); renderProv(rows); renderType(rows); renderDetail(rows);
}
// init selects
[...new Set(ROWS.map(r=>r.clue))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;document.getElementById('fClue').appendChild(o);});
[...new Set(ROWS.map(r=>r.type))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;document.getElementById('fType').appendChild(o);});
['fClue','fFirst','fType','fDedup'].forEach(id=>document.getElementById(id).addEventListener('change',renderAll));
document.getElementById('search').addEventListener('input',renderAll);
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); document.getElementById(t.dataset.p).classList.add('active');
}));
renderAll();
</script>
</body>
</html>
