<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>靶向名单跟进看板 · 服饰增长组</title>
<script>try{if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed-mode');}catch(e){}</script>
<!--
  靶向名单跟进看板 · 共享协作版（CloudBase）
  上部：渗透漏斗（待引入→已认领→已开户→已投放）+ 名单类型小漏斗 + By销售跟踪卡片
  下部：客户明细，按名单类型拆为 4 张独立表
  存储：CloudBase 云端共享（7 销售实时同源）；本地内置种子秒出，云端回来覆盖
  导出：导入导出 Excel(SheetJS CDN, 离线回退CSV)/JSON；跟进历史追溯
  图表：纯原生 SVG
-->
<!-- CloudBase SDK + 作战中心共享登录层 + 本看板云数据层 -->
<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
<script src="cloud_sync.js?v=20260817g"></script>
<script src="pursuit_cloud.js?v=20260817g"></script>
<script src="data/customer_main_product.js?v=20260817g" defer></script>
<style>
  :root{
    --bg:#f5f7fb; --panel:#fff; --ink:#222b38; --ink2:#5c6878; --muted:#9aa6b8; --faint:#c2cbd9;
    --line:#edf0f6; --line2:#e1e6ef;
    --brand:#3a6ff7; --brand-d:#2454d8; --brand-s:#eef3ff;
    --up:#e23b3b; --down:#1f9d57;
    /* 漏斗五层渐变色：浅蓝→深蓝→紫→橙→绿 */
    --f1:#9cc0ff; --f2:#5b8def; --f3:#7b6ef0; --f4:#f0a23c; --f5:#22b07d;
    --shadow-sm:0 1px 2px rgba(30,40,70,.04);
    --shadow:0 2px 8px rgba(30,40,70,.05),0 12px 32px rgba(30,40,70,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  /* 2026-06-13 内嵌到作战中心时隐藏独立页顶栏 */
  html.embed-mode .topbar{display:none!important;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:13px;line-height:1.6;display:flex;flex-direction:column;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;}
  /* 紫色渐变品牌顶栏 */
  .topbar{flex:0 0 auto;background:linear-gradient(120deg,#5b3ff0 0%,#6f51f5 45%,#8a6bf8 100%);border-bottom:none;padding:14px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 4px 18px rgba(91,63,240,.22);}
  .brand{font-size:17px;font-weight:800;letter-spacing:.4px;display:flex;align-items:center;gap:11px;color:#fff;}
  .brand .logo{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;border:1px solid rgba(255,255,255,.25);}
  .brand .bt{display:flex;flex-direction:column;line-height:1.25;}
  .brand small{font-weight:500;color:rgba(255,255,255,.78);font-size:11px;}
  .sp{margin-left:auto;}
  .search{position:relative;}
  .search input{width:236px;padding:9px 32px 9px 34px;border:1px solid rgba(255,255,255,.3);border-radius:24px;outline:none;font-size:13px;transition:.18s;background:rgba(255,255,255,.16);color:#fff;}
  .search input::placeholder{color:rgba(255,255,255,.7);}
  .search input:focus{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18);background:rgba(255,255,255,.24);}
  .search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.8);}
  .search .c{position:absolute;right:11px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(255,255,255,.8);display:none;}
  .btn{border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.14);color:#fff;padding:9px 14px;border-radius:11px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.18s;white-space:nowrap;}
  .btn:hover{background:rgba(255,255,255,.26);}
  .btn.primary{background:#fff;border-color:#fff;color:#5b3ff0;font-weight:700;}
  .btn.primary:hover{background:#f3f0ff;color:#4a30d8;}
  .btn.ghost{background:rgba(255,255,255,.08);}
  /* 弹窗内的按钮恢复常规配色 */
  .mf .btn,.add-row .btn{border:1px solid var(--line2);background:#fff;color:var(--ink);}
  .mf .btn:hover,.add-row .btn:hover{border-color:var(--brand);color:var(--brand);background:#fff;}
  .mf .btn.primary,.add-row .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .mf .btn.primary:hover,.add-row .btn.primary:hover{background:var(--brand-d);color:#fff;}
  .scroll{flex:1 1 auto;overflow:auto;padding:26px 28px 40px;}
  .wrap{max-width:1280px;margin:0 auto;}
  .section{margin-bottom:30px;}
  .sec-head{display:flex;align-items:center;gap:11px;margin:2px 0 16px;}
  .sec-head .bar{width:4px;height:17px;border-radius:3px;background:var(--brand);}
  .sec-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:.3px;}
  .sec-head .desc{font-size:12px;color:var(--muted);}

  /* ===== 主漏斗大卡 ===== */
  .hero{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 34px 22px;margin-bottom:24px;}
  .hero-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .hero-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px;}
  .hero-title .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);}
  .hero-title small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:3px;}
  .hero-conv{display:flex;gap:26px;}
  .hero-conv .hc{text-align:right;}
  .hero-conv .hc .l{font-size:11px;color:var(--muted);}
  .hero-conv .hc .v{font-size:22px;font-weight:800;color:var(--brand);line-height:1.2;}
  .funnel-main{display:flex;align-items:stretch;gap:0;}
  .funnel-step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;padding:0 4px;}
  .fs-bar-wrap{width:100%;height:150px;display:flex;align-items:flex-end;justify-content:center;}
  .fs-bar{width:78%;border-radius:12px 12px 6px 6px;position:relative;transition:height .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 6px 16px rgba(30,40,70,.12);display:flex;align-items:flex-start;justify-content:center;}
  .fs-bar .num{color:#fff;font-weight:800;font-size:18px;margin-top:9px;text-shadow:0 1px 3px rgba(20,30,55,.45),0 0 2px rgba(20,30,55,.35);font-variant-numeric:tabular-nums;}
  .fs-label{margin-top:13px;font-size:12.5px;font-weight:700;color:var(--ink);}
  .fs-pct{font-size:11px;color:var(--muted);margin-top:2px;}
  .fs-arrow{position:absolute;right:-9px;top:64px;z-index:3;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink2);box-shadow:var(--shadow-sm);}
  .fs-drop{position:absolute;right:-30px;top:90px;z-index:3;font-size:10px;color:var(--down);font-weight:700;}

  /* ===== 名单类型小漏斗 ===== */
  .mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  .mini-card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 20px 16px;}
  .mini-card .mc-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .mini-card .mc-head .tag{width:10px;height:10px;border-radius:3px;}
  .mini-card .mc-head h4{margin:0;font-size:13.5px;font-weight:800;}
  .mini-card .mc-sub{font-size:11px;color:var(--muted);margin-bottom:14px;}
  .mfunnel{display:flex;flex-direction:column;gap:7px;}
  .mfunnel .row{display:flex;align-items:center;gap:10px;}
  .mfunnel .row .lab{width:46px;font-size:11px;color:var(--ink2);text-align:right;flex:0 0 auto;}
  .mfunnel .row .track{flex:1;height:22px;background:#f2f5fa;border-radius:7px;position:relative;}
  .mfunnel .row .fill{height:100%;border-radius:7px;transition:width .5s cubic-bezier(.2,.8,.2,1);min-width:2px;}
  /* 数字统一放右侧、深色加粗、加半透明白底，任何填充色上都清晰 */
  .mfunnel .row .val{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:#1b2430;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.82);padding:0 5px;border-radius:5px;line-height:18px;}

  /* ===== 销售跟踪卡片矩阵 ===== */
  .scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;}
  .scard{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 16px;transition:.18s;border:1px solid var(--line);}
  .scard:hover{box-shadow:0 4px 14px rgba(30,40,70,.08),0 18px 40px rgba(30,40,70,.09);transform:translateY(-2px);}
  .scard-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
  .scard-head .ava{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex:0 0 auto;box-shadow:0 4px 10px rgba(0,0,0,.12);}
  .scard-head .who{flex:1;min-width:0;}
  .scard-head .who .nm{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .scard-head .who .rate{font-size:11px;color:var(--muted);margin-top:1px;}
  .scard-head .who .rate b{color:var(--brand);font-weight:700;}
  .scard-head .ring{width:46px;height:46px;flex:0 0 auto;}
  .smetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .smetric{border-radius:11px;padding:9px 6px;text-align:center;}
  .smetric .mv{font-size:19px;font-weight:800;line-height:1.1;}
  .smetric .ml{font-size:10.5px;margin-top:3px;font-weight:600;opacity:.85;}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink2);justify-content:center;}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px;}

  /* ===== 明细多表 ===== */
  .det-toolbar{display:flex;align-items:center;gap:11px;margin-bottom:16px;flex-wrap:wrap;}
  .det-toolbar select{padding:8px 11px;border:1px solid var(--line2);border-radius:11px;background:#fff;font-size:12px;outline:none;cursor:pointer;}
  .det-toolbar select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-s);}
  .det-toolbar .cnt{margin-left:auto;font-size:12px;color:var(--muted);}
  .src-block{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;}
  .src-head{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);}
  .src-head .tag{width:11px;height:11px;border-radius:3px;}
  .src-head h3{margin:0;font-size:14px;font-weight:800;}
  .src-head .meta{font-size:12px;color:var(--muted);}
  .src-head .mini{margin-left:auto;display:flex;gap:8px;}
  .src-head .mini .m{font-size:11px;color:var(--ink2);background:#f1f5fb;border-radius:20px;padding:4px 12px;font-weight:600;}
  .src-head .toggle{cursor:pointer;color:var(--muted);font-size:13px;padding:3px 9px;border-radius:8px;}
  .src-head .toggle:hover{background:#f1f5fb;color:var(--ink);}
  .twrap{overflow:auto;max-height:46vh;}
  .dtable{width:100%;border-collapse:collapse;font-size:12.5px;}
  .dtable thead th{position:sticky;top:0;z-index:2;background:#fafbfe;text-align:left;padding:11px 16px;font-weight:700;color:var(--ink2);border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none;}
  .dtable thead th:hover{color:var(--brand);}
  .dtable thead th .arr{font-size:10px;color:var(--brand);margin-left:3px;}
  .dtable tbody td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .dtable tbody tr:hover{background:#fafcff;}
  .dtable tbody tr:last-child td{border-bottom:none;}
  .table-more{padding:9px 12px;text-align:center;color:#2563eb;background:#f8fafc;border-top:1px dashed var(--line);font-size:12px;font-weight:800;cursor:pointer;}
  .table-more:hover{background:#eff6ff;}
  .nm{font-weight:600;}
  .nm .ent{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px;}
  .main-prod-inline{display:inline-flex;align-items:center;white-space:nowrap;margin-left:6px;padding:1px 7px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:800;vertical-align:middle;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.12s;white-space:nowrap;}
  .pill:hover{filter:brightness(.97);box-shadow:0 0 0 3px rgba(0,0,0,.04);}
  .pill .d{width:7px;height:7px;border-radius:50%;}
  .note{max-width:230px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .acts{display:flex;gap:6px;white-space:nowrap;}
  .ib{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--ink2);transition:.12s;}
  .ib:hover{border-color:var(--brand);color:var(--brand);}
  .ib.del:hover{border-color:var(--up);color:var(--up);}
  .empty{padding:34px;text-align:center;color:var(--muted);font-size:12px;}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(18,26,46,.42);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:18px;width:560px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(10,20,40,.32);animation:pop .18s;}
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0;}to{transform:none;opacity:1;}}
  .modal.lg{width:700px;}
  .mh{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .mh h3{margin:0;font-size:15px;font-weight:700;}
  .mh .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:2px 7px;border-radius:7px;}
  .mh .x:hover{background:var(--bg);color:var(--ink);}
  .mb{padding:22px 24px;overflow:auto;}
  .mf{padding:15px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:11px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 18px;}
  .fl{display:flex;flex-direction:column;gap:6px;}
  .fl.full{grid-column:1/-1;}
  .fl label{font-size:12px;color:var(--ink2);font-weight:600;}
  .fl label .r{color:var(--up);}
  .fl input,.fl select,.fl textarea{border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:13px;outline:none;font-family:inherit;transition:.15s;}
  .fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-s);}
  .fl textarea{resize:vertical;min-height:68px;}
  .fl .et{font-size:11px;color:var(--up);display:none;}
  .fl.bad input,.fl.bad select,.fl.bad textarea{border-color:var(--up);}
  .fl.bad .et{display:block;}
  .timeline{list-style:none;margin:0;padding:0;position:relative;}
  .timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line2);}
  .timeline li{position:relative;padding:0 0 18px 30px;}
  .timeline li:last-child{padding-bottom:0;}
  .timeline li .node{position:absolute;left:2px;top:3px;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line2);}
  .timeline li .tt{font-size:11px;color:var(--muted);}
  .timeline li .tm{font-size:13px;font-weight:600;margin:2px 0;}
  .timeline li .tm .f{color:var(--ink2);} .timeline li .tm .a{margin:0 7px;color:var(--muted);} .timeline li .tm .t{color:var(--brand-d);}
  .timeline li .tn{font-size:12px;color:var(--ink2);background:var(--bg);border-radius:9px;padding:7px 11px;margin-top:6px;}
  .timeline li .to{font-size:11px;color:var(--muted);margin-top:5px;}
  .slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .slist li{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;}
  .slist li .sw{width:14px;height:14px;border-radius:4px;flex:0 0 auto;}
  .slist li input.rn{flex:1;border:1px solid transparent;background:transparent;padding:5px 7px;border-radius:7px;font-size:13px;font-family:inherit;}
  .slist li input.rn:focus{border-color:var(--brand-s);background:#fff;outline:none;}
  .slist li .cn{font-size:11px;color:var(--muted);}
  .slist li .rm{cursor:pointer;color:var(--muted);border:none;background:none;font-size:15px;}
  .slist li .rm:hover{color:var(--up);}
  .add-row{display:flex;gap:9px;margin-top:14px;}
  .add-row input{flex:1;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:13px;outline:none;}
  .qpop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 40px rgba(10,20,40,.2);padding:7px;min-width:150px;display:none;}
  .qpop.show{display:block;}
  .qpop .qi{padding:8px 11px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;}
  .qpop .qi:hover{background:var(--bg);}
  .qpop .qi .d{width:8px;height:8px;border-radius:50%;}
  .qpop .qi.cur{font-weight:700;color:var(--brand);}
  .toasts{position:fixed;bottom:22px;right:22px;left:auto;top:auto;transform:none;z-index:99;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .toast{padding:10px 18px;border-radius:11px;font-size:13px;color:#fff;box-shadow:0 10px 28px rgba(10,20,40,.22);animation:tin .2s;}
  @keyframes tin{from{transform:translateY(-8px);opacity:0;}to{transform:none;opacity:1;}}
  .toast.ok{background:#16a34a;} .toast.err{background:#dc2626;} .toast.info{background:#334155;}
  .cbox{width:400px;} .cbox .mb{font-size:13px;color:var(--ink2);} .cbox .mb b{color:var(--ink);}
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-thumb{background:#d3dbe8;border-radius:8px;border:3px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:#bcc7d8;background-clip:padding-box;}
  @media(max-width:1100px){.mini-grid{grid-template-columns:repeat(2,1fr);}.sales-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <!-- 顶部工具条 -->
  <div class="topbar">
    <div class="brand"><span class="logo">🎯</span><span class="bt">靶向名单跟进看板<small>服饰增长组 · 26年靶向名单 · <span id="cloudBadge">本地数据</span></small></span></div>
    <div class="sp"></div>
    <div class="search"><span class="i">🔍</span><input id="q" placeholder="搜索客户 / 销售…"/><span class="c" id="qc">✕</span></div>
    <button class="btn primary" id="bAdd">＋ 新增客户</button>
    <button class="btn" id="bStage">⚙ 阶段</button>
    <button class="btn" id="bImp">⬆ 导入</button>
    <button class="btn" id="bXlsx">⬇ Excel</button>
    <button class="btn ghost" id="bJson">{ } JSON</button>
    <input type="file" id="file" accept=".json,.xlsx" style="display:none"/>
  </div>

  <div class="scroll"><div class="wrap">
    <!-- 主漏斗 -->
    <div class="section">
      <div class="hero" id="heroFunnel"></div>
    </div>

    <!-- 名单类型小漏斗 -->
    <div class="section">
      <div class="sec-head"><span class="bar"></span><h2>各名单类型渗透漏斗</h2><span class="desc">4 类名单的逐层渗透对比</span></div>
      <div class="mini-grid" id="miniGrid"></div>
    </div>

    <!-- 销售跟踪卡片矩阵 -->
    <div class="section">
      <div class="sec-head"><span class="bar" style="background:#22b07d"></span><h2>By 销售跟踪</h2><span class="desc">7 名销售的认领与渗透进度（按认领数降序）</span></div>
      <div class="scards" id="salesCards"></div>

/* ---------- 数据层：CloudBase 共享 + 本地缓存秒出 ----------
 *  CLOUD=true：云端为单一真源；本地 localStorage 仅作首屏缓存（加载快）
 *  流程：load() 同步用本地缓存/内置种子先渲染 → init() 里 syncFromCloud() 异步拉云覆盖
 *  写操作：先改内存+本地缓存+立即重渲染（无延迟感）→ 后台 push 到云
 */
const CLOUD=(typeof window!=='undefined' && window.pursuitCloud) ? true : false;
let cloudReady=false;

function buildSeedCustomers(){
  const now=nowStr();
  return SEED.map(s=>({
    id:s.id||genId(),name:s.name||'',contact:s.contact||'',phone:s.phone||'',
    industry:s.industry||'',sales:normSales(s.sales||''),entity:s.entity||'',
    source:SOURCES.includes(s.source)?s.source:'行业补充',stage:validStage(s.stage),
    note:s.note||'',updatedAt:now,createdAt:now,
    history:[{time:now,from:'',to:validStage(s.stage),note:s.note||'初始化导入',op:'系统导入'}]
  }));
}

function load(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw)state=JSON.parse(raw);}catch(e){console.warn(e);}
  if(!state.stages||!state.stages.length)state.stages=DEFAULT_STAGES.map(s=>({...s}));
  if(!state.customers)state.customers=[];
  // 首屏兜底：本地为空就用内置种子先渲染（云端版随后会覆盖）
  if(state.customers.length===0&&SEED.length){
    state.customers=buildSeedCustomers();
    localStorage.setItem(SEED_STAMP,'1');saveLocal();
  }
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){console.warn('本地缓存写入失败',e);}}
// save()：本地缓存立即写；云端版下不在此处推云（推云在各 mutation 内单条推，避免全量覆盖别人数据）
function save(){saveLocal();}

// 拉取云端全量并覆盖本地 → 重渲染
function syncFromCloud(){
  if(!CLOUD) return Promise.resolve();
  var badge=document.getElementById('cloudBadge');if(badge)badge.textContent='☁ 同步中…';
  return window.pursuitCloud.loadAll().then(function(r){
    cloudReady=true;
    if(badge)badge.textContent='☁ 云端共享';
    if(r.stages&&r.stages.length) state.stages=r.stages;
    if(r.customers&&r.customers.length){
      // 规范化
      state.customers=r.customers.map(c=>({
        id:c.id||genId(),name:c.name||'',contact:c.contact||'',phone:c.phone||'',
        industry:c.industry||'',sales:normSales(c.sales||''),entity:c.entity||'',
        source:SOURCES.includes(c.source)?c.source:'行业补充',stage:validStage(c.stage),
        note:c.note||'',updatedAt:c.updatedAt||'',createdAt:c.createdAt||'',history:c.history||[]
      }));
      saveLocal();renderAll();rebuildFilters();
      toast('已同步云端最新数据（'+state.customers.length+' 个客户）','ok');
      return;
    }
    // 云端为空 → 用内置种子灌一次
    if(!r.seeded){
      toast('云端首次初始化，正在写入名单…','info');

        return window.pursuitCloud.loadAll().then(function(r2){

            state.customers=r2.customers.map(c=>({
              id:c.id||genId(),name:c.name||'',contact:c.contact||'',phone:c.phone||'',

            }));

/* ============================================================
 * 聚合：五层漏斗（累计口径）
 * ============================================================ */
function funnelOf(list){
  // 漏斗递进口径：后一层必含前一层条件，保证单调递减
  // 待引入：名单全部；已认领：有销售；建联中：已认领 且 阶段≥建联中；开户中：阶段≥开户中；已投放：阶段=已投放
  const rank=c=>STAGE_RANK[c.stage]||0;
  const lead=list.length;
  const claimed=list.filter(c=>c.sales);                 // 已认领集合
  const claim=claimed.length;
  const contact=claimed.filter(c=>rank(c)>=1).length;    // 已认领 & 建联中及以上
  const open=claimed.filter(c=>rank(c)>=2).length;       // 已认领 & 开户中及以上
  const place=claimed.filter(c=>rank(c)>=3).length;      // 已认领 & 已投放
  return {lead,claim,contact,open,place};
}
function aggregate(){
  const cs=state.customers;
  const overall=funnelOf(cs);
  const bySource={};SOURCES.forEach(s=>bySource[s]=funnelOf(cs.filter(c=>(SOURCES.includes(c.source)?c.source:'行业补充')===s)));
  const bySales={};SALES7.forEach(s=>bySales[s]=funnelOf(cs.filter(c=>c.sales===s)));
  // 销售阶段构成（用于堆叠）
  const salesStages={};SALES7.forEach(s=>{salesStages[s]={};state.stages.forEach(st=>salesStages[s][st.name]=cs.filter(c=>c.sales===s&&c.stage===st.name).length);});
  return {overall,bySource,bySales,salesStages,total:cs.length};
}

/* ============================================================
 * 主漏斗（大卡，SVG 立体梯形漏斗）
 * ============================================================ */
function renderHeroFunnel(){
  const a=aggregate();const f=a.overall;
  const steps=FUNNEL.map(x=>({...x,v:f[x.key]}));
  const max=steps[0].v||1;
  // 转化率指标
  const convAll=f.lead?round1(f.place/f.lead*100):0;
  const convClaim=f.lead?round1(f.claim/f.lead*100):0;
  let bars='';
  steps.forEach((s,i)=>{
    const h=Math.max(8,Math.round(s.v/max*150));
    const prev=i>0?steps[i-1].v:null;
    const stepRate=(prev!=null&&prev>0)?Math.round(s.v/prev*100):null;
    const drop=(prev!=null)?prev-s.v:null;
    bars+='<div class="funnel-step">'+
      '<div class="fs-bar-wrap"><div class="fs-bar" style="height:'+h+'px;background:linear-gradient(180deg,'+s.color+','+shade(s.color,-12)+')">'+
        '<span class="num">'+fmt(s.v)+'</span></div></div>'+
      '<div class="fs-label">'+s.name+'</div>'+
      '<div class="fs-pct">'+(stepRate!=null?('转化 '+stepRate+'%'):('总量 100%'))+'</div>'+
      (i<steps.length-1?'<div class="fs-arrow">▶</div>':'')+
      (drop!=null&&drop>0?'<div class="fs-drop">-'+fmt(drop)+'</div>':'')+
    '</div>';
  });
  document.getElementById('heroFunnel').innerHTML=
    '<div class="hero-top">'+
      '<div class="hero-title"><span class="dot"></span>靶向名单整体渗透漏斗'+
        '<small>待引入 → 已认领 → 已开户 → 已投放</small></div>'+
      '<div class="hero-conv">'+
        '<div class="hc"><div class="l">认领率</div><div class="v">'+convClaim+'%</div></div>'+
        '<div class="hc"><div class="l">投放转化率</div><div class="v">'+convAll+'%</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="funnel-main">'+bars+'</div>';
}

/* ============================================================

const AVA_COLORS=['#5b8def','#7b6ef0','#f0a23c','#22b07d','#ec4899','#0ea5e9','#6366f1'];
function renderSalesCards(){
  const a=aggregate();
  const rows=SALES7.map((s,i)=>({name:s,idx:i,f:a.bySales[s]})).sort((x,y)=>y.f.claim-x.f.claim);
  let html='';
  rows.forEach(r=>{
    const f=r.f;
    // 环形进度 = 投放转化率 = 已投放 / 认领（更有区分度）
    const rate=f.claim?Math.round(f.place/f.claim*100):0;
    const color=AVA_COLORS[r.idx%AVA_COLORS.length];
    const init=r.name.slice(0,1).toUpperCase();
    // 6 指标块：认领/开户中/已投放/待推进(认领未到开户)/投放主体/未认领待补(=待引入-认领? 用名下投放主体)
    const pending=f.contact-f.open; // 已建联未开户
    const entSet=new Set();state.customers.forEach(c=>{if(c.sales===r.name&&c.stage==='已投放'&&c.entity&&c.entity.trim())entSet.add(c.entity.trim());});
    const entityCnt=entSet.size;
    const metrics=[
      {l:'认领',v:f.claim,bg:'#eaf0ff',c:'#3a6ff7'},
      {l:'建联中',v:f.contact,bg:'#f1eefe',c:'#7b6ef0'},
      {l:'开户中',v:f.open,bg:'#fff3e3',c:'#e0871f'},
      {l:'已投放',v:f.place,bg:'#e8f7ef',c:'#1a9c6e'},
      {l:'待推进',v:pending<0?0:pending,bg:'#fdeef0',c:'#dc4a52'},
      {l:'投放主体',v:entityCnt,bg:'#eef6ff',c:'#0e8fd6'},
    ];
    html+='<div class="scard">'+
      '<div class="scard-head">'+
        '<div class="ava" style="background:'+color+'">'+esc(init)+'</div>'+
        '<div class="who"><div class="nm">'+esc(r.name)+'</div><div class="rate">投放转化 <b>'+rate+'%</b> · 认领 '+f.claim+'</div></div>'+
        ringSvg(rate,color)+
      '</div>'+
      '<div class="smetrics">'+
        metrics.map(m=>'<div class="smetric" style="background:'+m.bg+'"><div class="mv" style="color:'+m.c+'">'+fmt(m.v)+'</div><div class="ml" style="color:'+m.c+'">'+m.l+'</div></div>').join('')+
      '</div>'+
    '</div>';
  });
  document.getElementById('salesCards').innerHTML=html;
}
function ringSvg(pct,color){
  const r=18,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<svg class="ring" viewBox="0 0 46 46">'+
    '<circle cx="23" cy="23" r="'+r+'" fill="none" stroke="#eef2f8" stroke-width="5"/>'+
    '<circle cx="23" cy="23" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 23 23)"/>'+
    '<text x="23" y="27" text-anchor="middle" font-size="11" font-weight="800" fill="'+color+'">'+pct+'%</text>'+
  '</svg>';
}

function saveEdit(){
  clrBad();

    const c={id:genId(),name:name,sales:document.getElementById('e_sales').value,
      contact:document.getElementById('e_contact').value.trim(),phone:document.getElementById('e_phone').value.trim(),
      industry:document.getElementById('e_industry').value.trim(),entity:document.getElementById('e_entity').value.trim(),
      source:document.getElementById('e_source').value,stage:stage,note:'',updatedAt:now,createdAt:now,
      history:[{time:now,from:'',to:stage,note:'新增客户',op:OPERATOR}]};
    state.customers.unshift(c);_savedRec=c;toast('客户已新增','ok');
  }else{
    const c=state.customers.find(x=>x.id===ui.editingId);const from=c.stage;
    const map={name:'名称',sales:'销售',contact:'联系人',phone:'电话',industry:'行业',entity:'主体',source:'来源'};
    const changed=[];
    ['name','contact','phone','industry','entity'].forEach(k=>{const nv=document.getElementById('e_'+k).value.trim();if((c[k]||'')!==nv){changed.push(map[k]);c[k]=nv;}});

    const nsource=document.getElementById('e_source').value;if((c.source||'')!==nsource){changed.push(map.source);c.source=nsource;}
    c.stage=stage;c.updatedAt=now;c.history=c.history||[];
    let summary=stageChanged?'阶段变更':(changed.length?'信息修改：'+changed.join('、'):'跟进更新');
    if(stageChanged||changed.length)c.history.push({time:now,from:stageChanged?from:c.stage,to:stage,note:summary,op:OPERATOR,summary:summary});
    _savedRec=c;toast('客户信息已更新','ok');

}

/* ---------- 删除 ---------- */
function askDel(id){ui.deletingId=id;const c=state.customers.find(x=>x.id===id);
  document.getElementById('cTitle').textContent='删除客户';
  document.getElementById('cMsg').innerHTML='确认删除客户 <b>'+esc(c.name)+'</b> 吗？<br/>该客户的跟进历史将一并移除，且不可恢复。';openMask('mConfirm');}
document.getElementById('cOk').onclick=()=>{const id=ui.deletingId;if(!id)return;state.customers=state.customers.filter(c=>c.id!==id);save();pushDelete(id);closeMask('mConfirm');renderAll();toast('客户已删除','ok');};

/* ---------- 历史 ---------- */
function openHist(id){
  const c=state.customers.find(x=>x.id===id);
  document.getElementById('hTitle').textContent='跟进历史 · '+c.name;
  const tl=document.getElementById('tl'),empty=document.getElementById('hEmpty');
  const list=(c.history||[]).slice().reverse();
  if(!list.length){tl.innerHTML='';empty.style.display='block';openMask('mHist');return;}
  empty.style.display='none';
  tl.innerHTML=list.map(h=>{const mv=h.from?'<span class="f">'+esc(h.from)+'</span><span class="a">→</span><span class="t">'+esc(h.to)+'</span>':'<span class="t">'+esc(h.to)+'</span>';
    return '<li><span class="node" style="background:'+stageColor(h.to)+'"></span><div class="tt">'+esc(h.time)+'</div><div class="tm">'+mv+'</div><div class="tn">'+(esc(h.note)||'（无备注）')+'</div><div class="to">操作人：'+esc(h.op||'—')+'</div></li>';}).join('');
  openMask('mHist');
}

/* ---------- 阶段管理 ---------- */
function openStage(){renderStageList();openMask('mStage');}
function renderStageList(){
  const cnt={};state.customers.forEach(c=>cnt[c.stage]=(cnt[c.stage]||0)+1);
  document.getElementById('sList').innerHTML=state.stages.map((s,i)=>'<li data-i="'+i+'"><span class="sw" style="background:'+s.color+'"></span><input class="rn" value="'+esc(s.name)+'" data-i="'+i+'"/><span class="cn">'+(cnt[s.name]||0)+' 客户</span><button class="rm" data-i="'+i+'">🗑</button></li>').join('');
  document.querySelectorAll('#sList .rn').forEach(inp=>inp.onchange=()=>renameStage(+inp.dataset.i,inp.value.trim()));
  document.querySelectorAll('#sList .rm').forEach(b=>b.onclick=()=>removeStage(+b.dataset.i));
}
function pushAffected(list){ if(CLOUD&&cloudReady){ list.forEach(c=>window.pursuitCloud.saveCustomer(c).catch(e=>console.warn(e))); } }
function renameStage(i,nn){if(!nn){toast('阶段名不能为空','err');renderStageList();return;}const old=state.stages[i].name;if(state.stages.some((s,j)=>j!==i&&s.name===nn)){toast('阶段名已存在','err');renderStageList();return;}if(old===nn)return;const aff=state.customers.filter(c=>c.stage===old);aff.forEach(c=>{c.stage=nn;});state.stages[i].name=nn;save();pushStages();pushAffected(aff);renderStageList();renderAll();toast('阶段已重命名','ok');}
function removeStage(i){if(state.stages.length<=1){toast('至少保留一个阶段','err');return;}const t=state.stages[i].name,fb=state.stages[i===0?1:0].name,cnt=state.customers.filter(c=>c.stage===t).length;if(!window.confirm('确认删除阶段「'+t+'」？\n该阶段 '+cnt+' 个客户将移动到「'+fb+'」。'))return;const aff=state.customers.filter(c=>c.stage===t);aff.forEach(c=>{c.stage=fb;});state.stages.splice(i,1);save();pushStages();pushAffected(aff);renderStageList();renderAll();toast('阶段已删除','ok');}
document.getElementById('sAdd').onclick=()=>{const inp=document.getElementById('sNew'),n=inp.value.trim();if(!n){toast('请输入阶段名称','err');return;}if(state.stages.some(s=>s.name===n)){toast('阶段名已存在','err');return;}state.stages.push({name:n,color:EXTRA_COLORS[state.stages.length%EXTRA_COLORS.length]});inp.value='';save();pushStages();renderStageList();renderAll();toast('阶段已新增','ok');};

/* ---------- 筛选 ---------- */
function rebuildFilters(){
  document.getElementById('fStage').innerHTML='<option value="">全部阶段</option>'+state.stages.map(s=>'<option value="'+esc(s.name)+'" '+(ui.fStage===s.name?'selected':'')+'>'+esc(s.name)+'</option>').join('');
  const sales=[...new Set(state.customers.map(c=>c.sales||'未认领'))].sort();
  document.getElementById('fSales').innerHTML='<option value="">全部销售</option>'+sales.map(s=>'<option value="'+esc(s)+'" '+(ui.fSales===s?'selected':'')+'>'+esc(s)+'</option>').join('');
}

/* ---------- 导入导出 ---------- */
function exportJson(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});dl(blob,'靶向名单跟进存档_'+stamp()+'.json');toast('已导出 JSON','ok');}
function exportXlsx(){
  const main=state.customers.map(c=>({客户名称:c.name,名单来源:c.source,所属行业:c.industry,联系人:c.contact,联系电话:c.phone,负责销售:c.sales,投放主体:c.entity,当前阶段:c.stage,跟进次数:(c.history||[]).length}));
  const a=aggregate();
  const rep1=SOURCES.map(s=>{const f=a.bySource[s];return{名单类型:s,待引入:f.lead,已认领:f.claim,建联中:f.contact,开户中:f.open,已投放:f.place,'投放转化率(%)':f.lead?round1(f.place/f.lead*100):0};});
  const rep2=SALES7.map(s=>{const f=a.bySales[s];return{销售:s,认领数:f.claim,建联中:f.contact,开户中:f.open,已投放:f.place};});
  ensureXLSX().then(XLSX=>{
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rep1),'名单漏斗');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rep2),'销售漏斗');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(main),'客户明细');
    const hist=[];state.customers.forEach(c=>(c.history||[]).forEach(h=>hist.push({客户名称:c.name,时间:h.time,修改前阶段:h.from||'(新建)',修改后阶段:h.to,跟进备注:h.note,操作人:h.op})));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(hist),'跟进历史');
    XLSX.writeFile(wb,'靶向名单跟进存档_'+stamp()+'.xlsx');toast('已导出 Excel','ok');
  }).catch(()=>{const head=Object.keys(main[0]||{客户名称:''});const csv=[head.join(',')].concat(main.map(r=>head.map(k=>csvCell(r[k])).join(','))).join('\n');dl(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'靶向名单跟进存档_'+stamp()+'.csv');toast('离线环境：已导出 CSV','info');});
}
function ensureXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=()=>window.XLSX?res(window.XLSX):rej();s.onerror=rej;document.head.appendChild(s);});}
function importFile(file){
  const ext=file.name.split('.').pop().toLowerCase(),reader=new FileReader();
  if(ext==='json'){reader.onload=()=>{try{const d=JSON.parse(reader.result);if(d.customers&&d.stages)state=d;else if(Array.isArray(d))state.customers=d;else throw 0;normImport();save();rebuildFilters();renderAll();toast('导入成功','ok');}catch(e){toast('导入失败：JSON 解析错误','err');}};reader.readAsText(file);}
  else if(ext==='xlsx'){ensureXLSX().then(XLSX=>{reader.onload=()=>{try{const wb=XLSX.read(reader.result,{type:'array'});let sheet=wb.Sheets['客户明细']||wb.Sheets[wb.SheetNames[wb.SheetNames.length-1]];const arr=XLSX.utils.sheet_to_json(sheet);const now=nowStr();state.customers=arr.map(r=>({id:genId(),name:r['客户名称']||'',contact:r['联系人']||'',phone:String(r['联系电话']||''),industry:r['所属行业']||'',sales:normSales(r['负责销售']||''),entity:r['投放主体']||'',source:SOURCES.includes(r['名单来源'])?r['名单来源']:'行业补充',stage:validStage(r['当前阶段']||''),note:'',updatedAt:now,createdAt:now,history:[{time:now,from:'',to:validStage(r['当前阶段']||''),note:'Excel 导入',op:'系统导入'}]})).filter(c=>c.name);normImport();save();rebuildFilters();renderAll();toast('导入成功，共 '+state.customers.length+' 个客户','ok');}catch(e){toast('导入失败：Excel 解析错误','err');console.error(e);}};reader.readAsArrayBuffer(file);}).catch(()=>toast('Excel 导入需联网加载解析库','err'));}
  else toast('仅支持 .json 或 .xlsx','err');
}
function normImport(){if(!state.stages||!state.stages.length)state.stages=DEFAULT_STAGES.map(s=>({...s}));state.customers.forEach(c=>{if(!c.id)c.id=genId();if(!c.history)c.history=[];c.stage=validStage(c.stage);if(!SOURCES.includes(c.source))c.source='行业补充';});
  // 云端版：导入后把全部记录 upsert 到云（覆盖共享数据），管理员操作
  if(CLOUD&&cloudReady){
    toast('正在把导入数据同步到云端…','info');
    pushStages();
    var arr=state.customers.slice();var i=0;
    (function step(){ if(i>=arr.length){toast('导入数据已同步云端','ok');return;} var s=arr.slice(i,i+20);i+=20; Promise.all(s.map(c=>window.pursuitCloud.saveCustomer(c).catch(e=>console.warn(e)))).then(step); })();
  }
}

/* ---------- 工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function hexA(hex,a){const h=hex.replace('#','');return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')';}
function shade(hex,p){const h=hex.replace('#','');let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);r=Math.max(0,Math.min(255,r+Math.round(255*p/100)));g=Math.max(0,Math.min(255,g+Math.round(255*p/100)));b=Math.max(0,Math.min(255,b+Math.round(255*p/100)));return 'rgb('+r+','+g+','+b+')';}
function round1(n){return Math.round(n*10)/10;}
function fmt(n){return (n==null||isNaN(n))?'—':String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+''+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function openMask(id){document.getElementById(id).classList.add('show');}
function closeMask(id){document.getElementById(id).classList.remove('show');}
function toast(msg,type){type=type||'info';const w=document.getElementById('toasts'),el=document.createElement('div');el.className='toast '+type;el.textContent=(type==='ok'?'✓ ':type==='err'?'✕ ':'')+msg;w.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='.3s';setTimeout(()=>el.remove(),300);},2200);}

/* ---------- 总渲染 ---------- */
function renderAll(){renderHeroFunnel();renderMiniFunnels();renderSalesCards();renderTables();}

/* ---------- 事件 ---------- */
function bindGlobal(){
  const qi=document.getElementById('q'),qc=document.getElementById('qc');
  qi.addEventListener('input',()=>{ui.search=qi.value;qc.style.display=qi.value?'block':'none';renderTables();});
  qc.addEventListener('click',()=>{qi.value='';ui.search='';qc.style.display='none';renderTables();});
  document.getElementById('bAdd').onclick=()=>openEdit(null);
  document.getElementById('bStage').onclick=openStage;
  document.getElementById('bJson').onclick=exportJson;
  document.getElementById('bXlsx').onclick=exportXlsx;
  document.getElementById('bImp').onclick=()=>document.getElementById('file').click();
  document.getElementById('file').onchange=e=>{if(e.target.files[0]){importFile(e.target.files[0]);e.target.value='';}};
  document.getElementById('eSave').onclick=saveEdit;
  document.getElementById('fStage').onchange=e=>{ui.fStage=e.target.value;renderTables();};
  document.getElementById('fSales').onchange=e=>{ui.fSales=e.target.value;renderTables();};
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeMask(b.dataset.close));
  document.querySelectorAll('.mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeMask(m.id);}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.mask.show').forEach(m=>m.classList.remove('show'));});
}
function init(){
  load();bindGlobal();rebuildFilters();renderAll();
  // 云端共享版：异步拉云覆盖（先看到本地秒出，云端回来再刷新）
  if(CLOUD){
    setTimeout(function(){ syncFromCloud(); }, 50);
  }
}
init();
function measurePageHeight(){
 let h=0;
 const roots=[document.querySelector('.wrap'),document.querySelector('main'),document.body];
 roots.forEach(function(el){if(!el)return;const r=el.getBoundingClientRect();h=Math.max(h,Math.ceil(r.bottom+(window.scrollY||0)));});
 Array.from(document.body.children||[]).forEach(function(el){const cs=getComputedStyle(el);if(cs.position==='fixed'||cs.display==='none')return;const r=el.getBoundingClientRect();h=Math.max(h,Math.ceil(r.bottom+(window.scrollY||0)));});
 return Math.max(h,520);
}
function postH(){if(window.parent!==window){parent.postMessage({type:'pageHeight',height:measurePageHeight()},'*');}}
window.addEventListener('load',postH);
if(window.ResizeObserver) new ResizeObserver(postH).observe(document.body);
</script>
