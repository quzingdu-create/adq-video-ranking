<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>访问监控后台 · 销售作战中心</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="data/monitor_session_data.js?v=20260614d"></script>
<style>
  :root {
    --bg: #f3f6fb;
    --panel: #ffffff;
    --panel-2: #f8fafc;
    --line: #e4eaf2;
    --text: #102033;
    --muted: #687386;
    --blue: #2563eb;
    --blue-2: #dbeafe;
    --green: #10b981;
    --green-2: #d1fae5;
    --amber: #f59e0b;
    --amber-2: #fef3c7;
    --red: #ef4444;
    --red-2: #fee2e2;
    --purple: #7c3aed;
    --shadow: 0 10px 30px rgba(16, 32, 51, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at top left, #e0ecff 0, transparent 28%), var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 22px;
  }
  .page { max-width: 1480px; margin: 0 auto; }
  .hero {
    background: linear-gradient(135deg, #102033 0%, #1d4ed8 58%, #38bdf8 100%);
    color: #fff;
    border-radius: 22px;
    padding: 24px 28px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
    margin-bottom: 18px;
  }
  .hero h1 { font-size: 28px; line-height: 1.2; margin-bottom: 10px; letter-spacing: -0.4px; }
  .hero p { color: rgba(255,255,255,0.82); font-size: 14px; line-height: 1.7; max-width: 820px; }
  .hero-meta { display: flex; flex-wrap: wrap; align-content: center; justify-content: flex-end; gap: 10px; }
  .meta-pill { background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); border-radius: 999px; padding: 8px 12px; font-size: 12px; color: #fff; backdrop-filter: blur(10px); }
  .toolbar {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
    box-shadow: 0 4px 18px rgba(16,32,51,0.05);
  }
  .toolbar-label { color: var(--muted); font-size: 13px; font-weight: 700; margin-right: 2px; }
  .tw-btn {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tw-btn:hover { border-color: var(--blue); color: var(--blue); }
  .tw-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 8px 18px rgba(37,99,235,0.22); }
  .custom-range { display: none; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .custom-range input { border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; color: var(--text); background: #fff; }
  .apply-btn, .refresh-btn { border: 0; background: var(--text); color: #fff; border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .data-note { margin-left: auto; color: var(--muted); font-size: 12px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
  .kpi-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 4px 18px rgba(16,32,51,0.05);
    position: relative;
    overflow: hidden;
  }
  .kpi-card::after { content: ""; position: absolute; right: -36px; top: -36px; width: 96px; height: 96px; border-radius: 50%; background: var(--blue-2); opacity: 0.78; }
  .kpi-card.green::after { background: var(--green-2); }
  .kpi-card.amber::after { background: var(--amber-2); }
  .kpi-card.red::after { background: var(--red-2); }
  .kpi-label { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 8px; position: relative; z-index: 1; }
  .kpi-value { font-size: 34px; font-weight: 850; letter-spacing: -0.8px; position: relative; z-index: 1; }
  .kpi-sub { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.5; position: relative; z-index: 1; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 0.65fr); gap: 16px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 4px 18px rgba(16,32,51,0.05); padding: 18px; margin-bottom: 16px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .panel-title { font-size: 17px; font-weight: 850; display: flex; align-items: center; gap: 8px; }
  .panel-desc { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .chart { height: 330px; width: 100%; }
  .hour-summary { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .hour-chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--muted); }
  .hour-chip b { display: block; color: #1f2937; font-size: 14px; font-weight: 850; margin-top: 2px; }
  .ranking-list { display: flex; flex-direction: column; gap: 12px; }
  .rank-row { display: grid; grid-template-columns: 118px 1fr 96px; gap: 10px; align-items: center; }
  .rank-head { padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
  .rank-head .name, .rank-head .min-text { color: var(--muted); font-weight: 600; font-size: 12px; }
  .name { font-weight: 800; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-wrap { background: #edf2f7; height: 12px; border-radius: 999px; position: relative; overflow: hidden; }
  .bar-target { position: absolute; left: 25%; width: 25%; top: 0; bottom: 0; background: rgba(16,185,129,0.22); }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: var(--blue); }
  .bar.good { background: var(--green); }
  .bar.warn { background: var(--amber); }
  .bar.danger { background: var(--red); }
  .min-text { text-align: right; font-weight: 850; font-size: 13px; white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 4px 8px; font-size: 11px; font-weight: 800; white-space: nowrap; }
  .badge.real { background: var(--green-2); color: #047857; }
  .badge.est { background: var(--amber-2); color: #92400e; }
  .badge.low { background: #eef2ff; color: #3730a3; }
  .badge.high { background: var(--red-2); color: #b91c1c; }
  .badge.online { background: var(--green-2); color: #047857; }
  .badge.offline { background: #e5e7eb; color: #4b5563; }
  .heatmap { overflow-x: auto; }
  .heat-grid { display: grid; gap: 6px; min-width: 760px; }
  .heat-cell, .heat-head, .heat-date { min-height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 750; }
  .heat-head { background: #eef2ff; color: #334155; }
  .heat-date { background: var(--panel-2); color: var(--muted); justify-content: flex-start; padding-left: 10px; }
  .heat-cell { color: #102033; border: 1px solid rgba(226,232,240,0.75); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 960px; }
  th { background: #f8fafc; color: var(--muted); font-size: 12px; text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
  td { padding: 12px; border-bottom: 1px solid #edf2f7; color: #1f2937; }
  tbody tr:hover { background: #f8fbff; }
  .rtx { font-weight: 850; color: var(--blue); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
  @media (max-width: 1100px) { .hero, .layout { grid-template-columns: 1fr; } .hero-meta { justify-content: flex-start; } .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 680px) { body { padding: 14px; } .kpi-grid { grid-template-columns: 1fr; } .rank-row { grid-template-columns: 96px 1fr 96px; } }
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <div>
      <h1>访问监控后台 · 销售作战中心</h1>
      <p>各销售日均使用时长，60 分钟/天封顶。</p>
    </div>
    <div class="hero-meta">
      <span class="meta-pill" id="rangePill">时间窗口：-</span>
      <span class="meta-pill" id="dataPill">数据：-</span>
    </div>
  </section>

  <div class="toolbar">
    <span class="toolbar-label">时间窗口</span>
    <button class="tw-btn active" data-range="today" onclick="selectRange('today')">最新日</button>
    <button class="tw-btn" data-range="7d" onclick="selectRange('7d')">近7天</button>
    <button class="tw-btn" data-range="30d" onclick="selectRange('30d')">近30天</button>
    <button class="tw-btn" data-range="custom" onclick="selectRange('custom')">自定义</button>
    <div class="custom-range" id="customRange">
      <input type="date" id="startDate" />
      <span>至</span>
      <input type="date" id="endDate" />
      <button class="apply-btn" onclick="applyCustomRange()">确定</button>
    </div>
    <button class="refresh-btn" onclick="loadAll()">刷新</button>
    <span class="data-note" id="dataNote">加载中...</span>
  </div>

  <section class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">访问销售数</div><div class="kpi-value" id="kpiUsers">-</div><div class="kpi-sub" id="kpiUsersSub">窗口内有记录的销售</div></div>
    <div class="kpi-card green"><div class="kpi-label">访问次数</div><div class="kpi-value" id="kpiSessions">-</div><div class="kpi-sub">session 记录数</div></div>
    <div class="kpi-card amber"><div class="kpi-label">人均日时长</div><div class="kpi-value" id="kpiReal">-</div><div class="kpi-sub">分钟/天</div></div>
    <div class="kpi-card red"><div class="kpi-label">窗口累计时长</div><div class="kpi-value" id="kpiEst">-</div><div class="kpi-sub">全员合计</div></div>
  </section>

  <main class="layout">
    <div>
      <section class="panel">
        <div class="panel-head">
          <div><div class="panel-title">趋势总览</div><div class="panel-desc">柱形=当日总时长（分钟），折线=访问次数。</div></div>
        </div>
        <div id="trendChart" class="chart"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div><div class="panel-title">销售 × 日期热力矩阵</div><div class="panel-desc">每格=该销售当天时长，30-60 分钟为合理区间，颜色越深越活跃。</div></div>
        </div>
        <div class="heatmap" id="heatmap"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div><div class="panel-title">使用时段分析</div><div class="panel-desc">按各小时(0~23点)的使用时长汇总，看销售集中在什么时段看板。</div></div>
        </div>
        <div id="hourChart" class="chart"></div>
        <div class="hour-summary" id="hourSummary"></div>
      </section>
    </div>

    <aside>
      <section class="panel">
        <div class="panel-head">
          <div><div class="panel-title">销售活跃榜</div></div>
        </div>
        <div class="rank-row rank-head"><div class="name">销售</div><div></div><div class="min-text">日均使用时长</div></div>
        <div class="ranking-list" id="rankingList"></div>
      </section>
    </aside>
  </main>

  <section class="panel">
    <div class="panel-head">
      <div><div class="panel-title">访问明细</div><div class="panel-desc">保留 session 粒度，便于追查异常。</div></div>
    </div>
    <div class="table-wrap" id="detailTable"></div>
  </section>
</div>

<script>
const SALES_NAMES = ["brownfan", "lijunwu", "jonzhu", "kaikaigenli", "kinsleyjin", "ruilingzhan", "yvaineechen", "edcchen"];
const COLORS = { brownfan: "#2563eb", lijunwu: "#10b981", jonzhu: "#f59e0b", kaikaigenli: "#ef4444", kinsleyjin: "#8b5cf6", ruilingzhan: "#06b6d4", yvaineechen: "#ec4899", edcchen: "#64748b" };
let currentRange = "today";
let customStart = null;
let customEnd = null;
let trendChart = null;
let hourChart = null;

function allRows() {
  return Array.isArray(window.MONITOR_SESSION_DATA) ? window.MONITOR_SESSION_DATA : [];
}
function uniqueDates() {
  return [...new Set(allRows().map(s => s.date).filter(Boolean))].sort();
}
function latestDate() {
  const dates = uniqueDates();
  return dates.length ? dates[dates.length - 1] : formatDate(new Date());
}
function parseDate(s) {
  const p = String(s).split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function formatDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function addDays(dateStr, delta) {
  const d = parseDate(dateStr);
  d.setDate(d.getDate() + delta);
  return formatDate(d);
}
function getDateRange() {
  const last = latestDate();
  if (currentRange === "today") return [last];
  if (currentRange === "7d") return Array.from({ length: 7 }, (_, i) => addDays(last, i - 6));
  if (currentRange === "30d") return Array.from({ length: 30 }, (_, i) => addDays(last, i - 29));
  if (currentRange === "custom" && customStart && customEnd) {
    const out = [];
    let cur = customStart;
    while (cur <= customEnd) { out.push(cur); cur = addDays(cur, 1); }
    return out;
  }
  return [last];
}
function selectRange(range) {
  currentRange = range;
  document.querySelectorAll(".tw-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.range === range));
  document.getElementById("customRange").style.display = range === "custom" ? "flex" : "none";
  if (range !== "custom") loadAll();
}
function applyCustomRange() {
  customStart = document.getElementById("startDate").value;
  customEnd = document.getElementById("endDate").value;
  if (!customStart || !customEnd || customStart > customEnd) return alert("请选择正确的起止日期");
  loadAll();
}
function toNum(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
function hasReal(s) {
  return s.activeDurationSec !== undefined && s.activeDurationSec !== null && s.activeDurationSec !== "";
}
// ====== 时长口径常量（2026-06-14 子青拍板：把人均一天压到 45分~1h，不要离谱）======
var SESSION_CAP_SEC = 1800;  // 单次 session 封顶 30 分钟
var DAILY_CAP_SEC = 3600;    // 每人每天封顶 60 分钟（先按天聚合再封顶）
function sessionSec(s) {
  var v;
  if (hasReal(s)) v = Math.max(0, toNum(s.activeDurationSec));
  else if (s.estimatedDurationSec !== undefined && s.estimatedDurationSec !== null && s.estimatedDurationSec !== "") v = Math.max(0, toNum(s.estimatedDurationSec));
  else if (toNum(s.duration) > 0) v = toNum(s.duration);
  else if (s.lastActivityTime && s.loginTime) v = Math.max(0, Math.round((toNum(s.lastActivityTime) - toNum(s.loginTime)) / 1000));
  else v = 0;
  return Math.min(v, SESSION_CAP_SEC); // 单次封顶 30 分
}
function sourceLabel(s) {
  return hasReal(s) ? "真实采集" : "估算回算";
}
function formatDuration(sec) {
  sec = Math.round(toNum(sec));
  if (sec <= 0) return "0分";
  const min = Math.round(sec / 60);
  if (min < 60) return min + "分";
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h + "小时" + (m ? m + "分" : "");
}
function formatTime(ts) {
  if (!ts) return "-";
  const d = new Date(toNum(ts));
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function bucketStatus(min, real) {
  if (min <= 0) return { text: "无记录", cls: "low" };
  if (min < 30) return { text: "未达30分", cls: "low" };
  if (min <= 60) return { text: "合理", cls: "real" };
  return { text: "偏高", cls: "high" };
}
function filterRows() {
  const dates = new Set(getDateRange());
  return allRows().filter(s => dates.has(s.date));
}
function aggregate(rows) {
  const byRtx = {};
  rows.forEach(s => {
    const rtx = s.rtx || "unknown";
    const sec = sessionSec(s);
    if (!byRtx[rtx]) byRtx[rtx] = { rtx, sessions: 0, rawTotalSec: 0, perDay: {}, firstLogin: Infinity, lastActive: 0 };
    byRtx[rtx].sessions += 1;
    byRtx[rtx].rawTotalSec += sec; // 仅单次封顶后的原始累计（明细用）
    byRtx[rtx].perDay[s.date] = (byRtx[rtx].perDay[s.date] || 0) + sec;
    byRtx[rtx].firstLogin = Math.min(byRtx[rtx].firstLogin, toNum(s.loginTime) || Infinity);
    byRtx[rtx].lastActive = Math.max(byRtx[rtx].lastActive, toNum(s.lastActiveTime) || toNum(s.loginTime) || 0);
  });
  // 每人：每天封顶 60 分后求累计 / 登录天数 / 日均
  const byDate = {};
  let cappedTotalSec = 0, loginDaySum = 0;
  Object.values(byRtx).forEach(g => {
    let capped = 0, loginDays = 0;
    Object.keys(g.perDay).forEach(d => {
      const daySec = Math.min(g.perDay[d], DAILY_CAP_SEC); // 每人每天封顶 60 分
      if (daySec > 0) loginDays += 1;
      capped += daySec;
      if (!byDate[d]) byDate[d] = { date: d, sessions: 0, totalSec: 0 };
      byDate[d].totalSec += daySec; // 趋势/热力也用封顶后口径
    });
    g.cappedTotalSec = capped;
    g.loginDays = loginDays;
    g.avgSec = loginDays > 0 ? Math.round(capped / loginDays) : 0; // 日均（核心指标）
    g.totalSec = capped; // 兼容旧引用：totalSec 现指封顶后累计
    cappedTotalSec += capped;
    loginDaySum += loginDays;
  });
  rows.forEach(s => { if (byDate[s.date]) byDate[s.date].sessions += 1; });
  const avgPerPerson = loginDaySum > 0 ? Math.round(cappedTotalSec / loginDaySum) : 0; // 全员人均日时长
  return { byRtx, byDate, cappedTotalSec, avgPerPerson };
}
function renderKpis(rows, agg) {
  const users = new Set(rows.map(s => s.rtx).filter(Boolean));
  const dates = getDateRange();
  document.getElementById("kpiUsers").textContent = users.size;
  document.getElementById("kpiSessions").textContent = rows.length;
  document.getElementById("kpiReal").textContent = formatDuration(agg.avgPerPerson);
  document.getElementById("kpiEst").textContent = formatDuration(agg.cappedTotalSec);
  document.getElementById("kpiUsersSub").textContent = dates[0] + (dates.length > 1 ? " ~ " + dates[dates.length - 1] : "");
  document.getElementById("rangePill").textContent = "时间窗口：" + dates[0] + (dates.length > 1 ? " ~ " + dates[dates.length - 1] : "");
}
function renderRanking(agg) {
  const sales = SALES_NAMES.map(name => agg.byRtx[name] || { rtx: name, sessions: 0, cappedTotalSec: 0, loginDays: 0, avgSec: 0 }).sort((a, b) => b.avgSec - a.avgSec);
  const maxMin = Math.max(60, ...sales.map(s => Math.round(s.avgSec / 60)));
  document.getElementById("rankingList").innerHTML = sales.map(s => {
    const min = Math.round(s.avgSec / 60);
    const status = bucketStatus(min, true);
    const cls = status.cls === "real" ? "good" : status.cls === "high" ? "danger" : "warn";
    const pct = Math.min(100, Math.round(min / maxMin * 100));
    return `<div class="rank-row"><div class="name" style="color:${COLORS[s.rtx] || "#2563eb"}">${s.rtx}</div><div class="bar-wrap"><span class="bar-target"></span><span class="bar ${cls}" style="width:${pct}%"></span></div><div class="min-text">${min}分钟/天</div></div>`;
  }).join("");
}
function renderTrend(agg) {
  const dates = getDateRange();
  const total = dates.map(d => Math.round(((agg.byDate[d] && agg.byDate[d].totalSec) || 0) / 60));
  const sessions = dates.map(d => (agg.byDate[d] && agg.byDate[d].sessions) || 0);
  if (!trendChart) trendChart = echarts.init(document.getElementById("trendChart"));
  trendChart.setOption({
    tooltip: { trigger: "axis" },
    legend: { data: ["当日总时长", "访问次数"], top: 0 },
    grid: { top: 42, left: 46, right: 48, bottom: 28 },
    xAxis: { type: "category", data: dates.map(d => d.slice(5)), axisTick: { alignWithLabel: true } },
    yAxis: [{ type: "value", name: "分钟" }, { type: "value", name: "次数" }],
    series: [
      { name: "当日总时长", type: "bar", data: total, itemStyle: { color: "#10b981" }, barMaxWidth: 36 },
      { name: "访问次数", type: "line", yAxisIndex: 1, smooth: true, data: sessions, symbolSize: 7, itemStyle: { color: "#2563eb" } }
    ]
  });
}
function renderHour(rows) {
  // 按 loginTime 所在小时汇总使用时长（分钟），单次封顶 30 分口径
  const byHour = Array(24).fill(0);
  rows.forEach(s => {
    const t = toNum(s.loginTime);
    if (!t) return;
    const h = new Date(t).getHours();
    byHour[h] += sessionSec(s);
  });
  const minByHour = byHour.map(sec => Math.round(sec / 60));
  if (!hourChart) hourChart = echarts.init(document.getElementById("hourChart"));
  hourChart.setOption({
    tooltip: { trigger: "axis", formatter: p => `${p[0].axisValue} · ${p[0].data} 分钟` },
    grid: { top: 24, left: 46, right: 24, bottom: 28 },
    xAxis: { type: "category", data: Array.from({ length: 24 }, (_, h) => h + "点"), axisLabel: { interval: 1 } },
    yAxis: { type: "value", name: "分钟" },
    series: [{
      type: "bar", data: minByHour, barMaxWidth: 22,
      itemStyle: { color: p => { const h = p.dataIndex; return (h >= 9 && h <= 18) ? "#10b981" : "#94a3b8"; }, borderRadius: [4, 4, 0, 0] }
    }]
  });
  // 时段分档汇总：早上6-12 / 下午12-18 / 晚上18-24 / 深夜0-6
  const buckets = [
    { name: "早上 6-12点", sec: 0 }, { name: "下午 12-18点", sec: 0 },
    { name: "晚上 18-24点", sec: 0 }, { name: "深夜 0-6点", sec: 0 }
  ];
  byHour.forEach((sec, h) => {
    if (h >= 6 && h < 12) buckets[0].sec += sec;
    else if (h >= 12 && h < 18) buckets[1].sec += sec;
    else if (h >= 18) buckets[2].sec += sec;
    else buckets[3].sec += sec;
  });
  const totalSec = buckets.reduce((a, b) => a + b.sec, 0) || 1;
  // 高峰时段
  let peakH = 0, peakV = -1;
  minByHour.forEach((v, h) => { if (v > peakV) { peakV = v; peakH = h; } });
  const chips = [`<div class="hour-chip">使用高峰<b>${peakH}点（${peakV}分钟）</b></div>`]
    .concat(buckets.map(b => `<div class="hour-chip">${b.name}<b>${Math.round(b.sec / 60)}分钟 · ${Math.round(b.sec / totalSec * 100)}%</b></div>`));
  document.getElementById("hourSummary").innerHTML = chips.join("");
}
function renderHeatmap(agg) {
  const dates = getDateRange();
  const cols = ["日期"].concat(SALES_NAMES);
  const maxMin = Math.max(1, ...dates.flatMap(d => SALES_NAMES.map(s => Math.round((((agg.byDate[d] && agg.byRtx[s]) ? 0 : 0))))));
  let matrixMax = 1;
  dates.forEach(d => SALES_NAMES.forEach(s => { matrixMax = Math.max(matrixMax, Math.round(getCellSec(d, s) / 60)); }));
  function getColor(min) {
    if (min <= 0) return "#f8fafc";
    if (min < 30) return "#dbeafe";
    if (min <= 60) return "#bbf7d0";
    const opacity = Math.min(1, 0.35 + min / Math.max(120, matrixMax) * 0.65);
    return `rgba(239,68,68,${opacity})`;
  }
  function getCellSec(date, rtx) {
    const raw = filterRows().filter(s => s.date === date && s.rtx === rtx).reduce((sum, s) => sum + sessionSec(s), 0);
    return Math.min(raw, DAILY_CAP_SEC); // 单格=该人当天，封顶 60 分，与榜单口径一致
  }
  let html = `<div class="heat-grid" style="grid-template-columns:120px repeat(${SALES_NAMES.length}, minmax(92px, 1fr));">`;
  cols.forEach(c => html += `<div class="heat-head">${c}</div>`);
  dates.forEach(d => {
    html += `<div class="heat-date">${d}</div>`;
    SALES_NAMES.forEach(s => {
      const min = Math.round(getCellSec(d, s) / 60);
      html += `<div class="heat-cell" style="background:${getColor(min)}">${min ? min + "分" : "-"}</div>`;
    });
  });
  html += "</div>";
  document.getElementById("heatmap").innerHTML = html;
}
function renderTable(rows) {
  if (!rows.length) { document.getElementById("detailTable").innerHTML = `<div class="empty">当前窗口暂无访问记录</div>`; return; }
  const sorted = rows.slice().sort((a, b) => (b.loginTime || 0) - (a.loginTime || 0));
  const now = Date.now();
  let html = `<table><thead><tr><th>销售</th><th>日期</th><th>登录</th><th>最近心跳</th><th>时长</th><th>口径</th><th>状态</th><th>设备</th><th>sessionId</th></tr></thead><tbody>`;
  sorted.forEach(s => {
    const sec = sessionSec(s);
    const min = Math.round(sec / 60);
    const real = hasReal(s);
    const status = bucketStatus(min, real);
    const online = s.lastActiveTime && (now - toNum(s.lastActiveTime)) < 30 * 60 * 1000;
    const device = ((s.deviceInfo || "").match(/(Windows|Mac|iPhone|iPad|Android)/) || ["PC"])[0];
    html += `<tr><td><span class="rtx">${s.rtx || "-"}</span></td><td>${s.date || "-"}</td><td>${formatTime(s.loginTime)}</td><td>${formatTime(s.lastActiveTime)}</td><td><strong>${formatDuration(sec)}</strong></td><td><span class="badge ${real ? "real" : "est"}">${sourceLabel(s)}</span></td><td><span class="badge ${status.cls}">${status.text}</span> <span class="badge ${online ? "online" : "offline"}">${online ? "在线" : "离线"}</span></td><td>${device}</td><td class="muted">${s.sessionId || "-"}</td></tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("detailTable").innerHTML = html;
}
function loadAll() {
  const rows = filterRows();
  const all = allRows();
  const allDates = uniqueDates();
  document.getElementById("dataNote").textContent = `数据范围：${allDates[0] || "-"} ~ ${allDates[allDates.length - 1] || "-"}（${all.length}条）`;
  document.getElementById("dataPill").textContent = `数据：${all.length}条 / ${allDates[0] || "-"} ~ ${allDates[allDates.length - 1] || "-"}`;
  const agg = aggregate(rows);
  renderKpis(rows, agg);
  renderRanking(agg);
  renderTrend(agg);
  renderHeatmap(agg);
  renderHour(rows);
  renderTable(rows);
}
window.addEventListener("resize", () => { if (trendChart) trendChart.resize(); if (hourChart) hourChart.resize(); });
loadAll();
</script>
