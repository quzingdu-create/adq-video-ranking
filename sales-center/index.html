<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>5.15 销售作战中心 · 入口</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:linear-gradient(135deg,#fef2f2 0%,#fff 60%,#fff5f5 100%);min-height:100vh;padding:24px 16px;color:#1f1f1f}
.wrap{max-width:520px;margin:0 auto}
.hero{text-align:center;padding:24px 8px 32px}
.badge{display:inline-block;font-size:12px;background:#fee2e2;color:#b91c1c;padding:4px 10px;border-radius:99px;margin-bottom:12px;font-weight:600}
h1{font-size:24px;font-weight:800;color:#0f172a;margin-bottom:8px;letter-spacing:-.5px}
.sub{font-size:13px;color:#64748b;line-height:1.6}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 28px;background:#fff;border-radius:14px;padding:14px 8px;border:1px solid #f1f5f9;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi-cell{text-align:center;padding:6px}
.kpi-cell+.kpi-cell{border-left:1px solid #f1f5f9}
.kpi-label{font-size:11px;color:#94a3b8;margin-bottom:4px}
.kpi-val{font-size:16px;font-weight:700;color:#dc2626}
.kpi-val.dark{color:#0f172a}
.btn{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px 18px;text-decoration:none;color:#0f172a;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.98);box-shadow:0 0 0 transparent}
.btn-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.btn-mobile .btn-icon{background:linear-gradient(135deg,#fee2e2,#fecaca)}
.btn-pc .btn-icon{background:linear-gradient(135deg,#dbeafe,#bfdbfe)}
.btn-text{flex:1;min-width:0}
.btn-title{font-size:16px;font-weight:700;margin-bottom:2px}
.btn-desc{font-size:12px;color:#64748b;line-height:1.5}
.btn-meta{font-size:11px;color:#94a3b8;margin-top:4px}
.btn-arrow{font-size:18px;color:#cbd5e1}
.tip{background:#fffbeb;border-left:3px solid #f59e0b;padding:12px 14px;border-radius:8px;font-size:12px;color:#78350f;line-height:1.6;margin-top:16px}
.foot{text-align:center;font-size:11px;color:#cbd5e1;margin-top:24px;padding-bottom:20px}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<div class="badge">5.15 数据日 · T-1=2026-05-14</div>
<h1>📊 销售作战中心</h1>
<div class="sub">服饰中心拓新组 · 即时看板</div>
</div>

<div class="kpi">
<div class="kpi-cell">
<div class="kpi-label">中心昨日消耗</div>
<div class="kpi-val">827.6万</div>
</div>
<div class="kpi-cell">
<div class="kpi-label">环比</div>
<div class="kpi-val">+1.11%</div>
</div>
<div class="kpi-cell">
<div class="kpi-label">Q2 新客</div>
<div class="kpi-val dark">4319</div>
</div>
</div>

<a class="btn btn-mobile" href="./mobile.html">
<div class="btn-icon">📱</div>
<div class="btn-text">
<div class="btn-title">手机端 · 推荐</div>
<div class="btn-desc">移动端专版，触屏优化</div>
<div class="btn-meta">4.4 MB · 秒开</div>
</div>
<div class="btn-arrow">›</div>
</a>

<a class="btn btn-pc" href="./pc.html">
<div class="btn-icon">🖥️</div>
<div class="btn-text">
<div class="btn-title">PC 作战中心 v3.2</div>
<div class="btn-desc">完整版，含全部模块与图表</div>
<div class="btn-meta">30 MB · 加载约 8-15s · 横屏体验更佳</div>
</div>
<div class="btn-arrow">›</div>
</a>

<div class="tip">
⚠️ 临时链接：电脑关机/隧道断开后失效。PC 版较大，建议在 Wi-Fi 下打开。
</div>

<div class="foot">2026-05-15 21:25 出版 · cloudflared quick tunnel</div>
</div>
</body>
</html>
