<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>云端销售↔客户对应关系导出</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f6f7f9;margin:0;padding:24px;color:#1f2937;}
  .wrap{max-width:1100px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:24px;}
  h1{font-size:20px;margin:0 0 6px;}
  .sub{color:#6b7280;font-size:13px;margin-bottom:16px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  button{padding:8px 16px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn-primary{background:#2563eb;color:#fff;}
  .btn-primary:hover{background:#1d4ed8;}
  .btn-success{background:#10b981;color:#fff;}
  .btn-success:hover{background:#059669;}
  .btn-ghost{background:#f3f4f6;color:#1f2937;}
  .btn-ghost:hover{background:#e5e7eb;}
  .stat{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.8;}
  .stat b{color:#111827;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:8px;}
  .chip{background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:8px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px;}
  th,td{padding:6px 10px;border-bottom:1px solid #f3f4f6;text-align:left;}
  th{background:#f9fafb;color:#374151;font-weight:600;position:sticky;top:0;}
  tbody tr:hover{background:#f9fafb;}
  .scroll{max-height:480px;overflow:auto;border:1px solid #e5e7eb;border-radius:8px;}
  .badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;}
  .badge-new{background:#dcfce7;color:#166534;}
  .badge-laoke{background:#f3f4f6;color:#6b7280;}
  .log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;max-height:200px;overflow:auto;white-space:pre-wrap;}
  .filter-bar{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  input[type=text],select{padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;min-width:180px;}
</style>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="cloud_sync.js"></script>
</head>
<body>
<div class="wrap">
  <h1>云端 销售 ↔ 客户 对应关系导出</h1>
  <div class="sub">数据源：CloudBase <code>tuoke_records</code> 集合 · 仅展示已登录的实时云端数据 · 每位客户取最早登记记录的销售（先登记先归属）</div>

  <div class="row">
    <button class="btn-primary" id="btnLoad">📥 拉取云端最新数据</button>
    <button class="btn-success" id="btnExport" disabled>📊 导出 xlsx（销售↔客户）</button>
    <button class="btn-ghost" id="btnExportRaw" disabled>📋 导出全量明细</button>
    <button class="btn-ghost" id="btnLogout">🚪 退出云端</button>
    <span id="loginStat" style="font-size:12px;color:#6b7280;margin-left:auto;"></span>
  </div>

  <div id="statBox" class="stat" style="display:none;">
    <div><b>云端总记录数：</b><span id="totalRec">-</span> 条</div>
    <div><b>去重后客户数（按客户简称）：</b><span id="uniqCust">-</span> 个</div>
    <div><b>按销售分布（先登记先归属）：</b></div>
    <div id="saleGrid" class="grid"></div>
  </div>

  <div class="filter-bar" id="filterBar" style="display:none;">
    <span style="font-size:13px;color:#374151;">筛选：</span>
    <select id="fltSale"><option value="">全部销售</option></select>
    <input type="text" id="fltKw" placeholder="客户简称搜索（部分匹配）">
    <span id="fltCnt" style="font-size:12px;color:#6b7280;"></span>
  </div>

  <div class="scroll" id="tableWrap" style="display:none;">
    <table id="tbl">
      <thead>
        <tr>
          <th>客户简称</th>
          <th>归属销售</th>
          <th>最早登记日期</th>
          <th>类目</th>
          <th>首投季度</th>
          <th>是否新客</th>
          <th>是否老客</th>
          <th>登记次数</th>
          <th>来源</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div style="margin-top:16px;">
    <div style="font-size:12px;color:#6b7280;margin-bottom:6px;">操作日志：</div>
    <div class="log" id="log">等待操作...</div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id);};
  var ALL=[]; // 云端全量明细
  var AGG=[]; // 聚合后的销售↔客户表

  function log(msg){
    var t = new Date().toLocaleTimeString();
    $('log').textContent += '\n['+t+'] '+msg;
    $('log').scrollTop = 999999;
  }

  function refreshLoginStat(){
    if (window.cloud && cloud.isLoggedIn()) {
      $('loginStat').innerHTML = '✅ 已登录：<b>'+ (cloud.rtx() || '') +'</b>';
    } else {
      $('loginStat').innerHTML = '⛔ 未登录';
    }
  }

  // 聚合：每客户取最早登记
  function aggregate(records){
    var m = {};
    records.forEach(function(r){
      var key = (r.shortName || r.name || '').trim();
      if (!key) return;
      if (!m[key]) {
        m[key] = {
          shortName: key,
          sale: r.sale || '',
          earliestDate: r.date || '',
          cat: r.cat || '',
          firstQuarter: (r.firstQuarter||'').replace('/',''),
          isNew: !!r.isNew,
          isLaoke: !!r.isLaoke,
          count: 1,
          source: r.source || ''
        };
      } else {
        var cur = m[key];
        cur.count++;
        // 取最早日期对应的销售（先登记先归属）
        var d1 = r.date || '';
        if (d1 && (!cur.earliestDate || d1 < cur.earliestDate)) {
          cur.earliestDate = d1;
          cur.sale = r.sale || cur.sale;
          cur.cat = r.cat || cur.cat;
          cur.firstQuarter = (r.firstQuarter||'').replace('/','') || cur.firstQuarter;
          cur.source = r.source || cur.source;
        }
        // 标记位累加（任一为真即为真）
        cur.isNew = cur.isNew || !!r.isNew;
        cur.isLaoke = cur.isLaoke || !!r.isLaoke;
      }
    });
    return Object.values(m);
  }

  function renderStat(){
    $('statBox').style.display = 'block';
    $('totalRec').textContent = ALL.length;
    $('uniqCust').textContent = AGG.length;
    // 销售分布
    var cnt = {};
    AGG.forEach(function(a){
      var s = (a.sale || '(空)').trim() || '(空)';
      cnt[s] = (cnt[s]||0) + 1;
    });
    var arr = Object.entries(cnt).sort(function(a,b){return b[1]-a[1];});
    $('saleGrid').innerHTML = arr.map(function(p){
      return '<div class="chip"><b>'+p[0]+'</b> · '+p[1]+'</div>';
    }).join('');
    // 销售下拉
    var sel = $('fltSale');
    sel.innerHTML = '<option value="">全部销售</option>' + arr.map(function(p){
      return '<option value="'+p[0]+'">'+p[0]+' ('+p[1]+')</option>';
    }).join('');
  }

  function renderTable(){
    $('tableWrap').style.display = 'block';
    $('filterBar').style.display = 'flex';
    var s = $('fltSale').value;
    var kw = ($('fltKw').value || '').trim().toLowerCase();
    var list = AGG.slice().sort(function(a,b){
      return (a.sale||'').localeCompare(b.sale||'') || (a.earliestDate||'').localeCompare(b.earliestDate||'');
    });
    if (s) list = list.filter(function(r){ return ((r.sale||'').trim()||'(空)') === s; });
    if (kw) list = list.filter(function(r){ return (r.shortName||'').toLowerCase().indexOf(kw) >= 0; });
    $('fltCnt').textContent = '匹配 '+list.length+' 条';
    var tb = $('tbody');
    var max = Math.min(list.length, 2000); // 渲染上限保护
    var html = '';
    for (var i=0; i<max; i++){
      var r = list[i];
      html += '<tr>'
        + '<td>'+ (r.shortName||'') +'</td>'
        + '<td><b>'+ (r.sale||'(空)') +'</b></td>'
        + '<td>'+ (r.earliestDate||'') +'</td>'
        + '<td>'+ (r.cat||'') +'</td>'
        + '<td>'+ (r.firstQuarter||'') +'</td>'
        + '<td>'+ (r.isNew ? '<span class="badge badge-new">新客</span>' : '') +'</td>'
        + '<td>'+ (r.isLaoke ? '<span class="badge badge-laoke">老客</span>' : '') +'</td>'
        + '<td>'+ r.count +'</td>'
        + '<td>'+ (r.source||'') +'</td>'
        + '</tr>';
    }
    if (list.length > max) html += '<tr><td colspan="9" style="text-align:center;color:#9ca3af;padding:10px;">仅展示前 '+max+' 条，导出 xlsx 可看完整数据</td></tr>';
    tb.innerHTML = html;
  }

  function exportAgg(){
    if (!AGG.length) { alert('没有数据'); return; }
    var headers = ['客户简称','归属销售','最早登记日期','类目','首投季度','是否新客','是否老客','登记次数','来源'];
    var sorted = AGG.slice().sort(function(a,b){
      return (a.sale||'').localeCompare(b.sale||'') || (a.earliestDate||'').localeCompare(b.earliestDate||'');
    });
    var aoa = [headers];
    sorted.forEach(function(r){
      aoa.push([
        r.shortName, r.sale||'(空)', r.earliestDate, r.cat, r.firstQuarter,
        r.isNew?'是':'否', r.isLaoke?'是':'否', r.count, r.source
      ]);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:28},{wch:14},{wch:14},{wch:12},{wch:12},{wch:8},{wch:8},{wch:8},{wch:14}];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '销售↔客户');

    // 加销售汇总 sheet
    var cnt = {};
    AGG.forEach(function(a){
      var s = (a.sale||'').trim() || '(空)';
      if (!cnt[s]) cnt[s]={cnt:0,newCnt:0};
      cnt[s].cnt++;
      if (a.isNew) cnt[s].newCnt++;
    });
    var aoa2 = [['销售','客户数','其中新客数']];
    Object.entries(cnt).sort(function(a,b){return b[1].cnt-a[1].cnt;}).forEach(function(p){
      aoa2.push([p[0], p[1].cnt, p[1].newCnt]);
    });
    var ws2 = XLSX.utils.aoa_to_sheet(aoa2);
    ws2['!cols'] = [{wch:16},{wch:10},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws2, '销售汇总');

    var d = new Date();
    var fn = '云端销售客户对应关系_'+ d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '_' + AGG.length + '客户.xlsx';
    XLSX.writeFile(wb, fn);
    log('✅ 已导出 ' + fn);
  }

  function exportRaw(){
    if (!ALL.length) { alert('没有数据'); return; }
    var headers = ['登记日期','销售','客户全称','客户简称','类目','首投季度','是否新客','是否有效','是否新锐','是否老客','链路','投放端','来源','创建人','更新时间'];
    var aoa = [headers];
    ALL.slice().sort(function(a,b){
      return (a.date||'').localeCompare(b.date||'') || (a.sale||'').localeCompare(b.sale||'');
    }).forEach(function(r){
      aoa.push([
        r.date||'', r.sale||'', r.name||'', r.shortName||'', r.cat||'',
        (r.firstQuarter||'').replace('/',''),
        r.isNew?'是':'否', r.isValid?'是':'否', (r.isRising==='是'||r.status==='新锐'||r.isXinrui)?'是':'否',
        r.isLaoke?'是':'否',
        r.link||'', r.deliverySide||'', r.source||'', r.created_by||'', r.updated_at||''
      ]);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:12},{wch:14},{wch:30},{wch:24},{wch:12},{wch:10},{wch:8},{wch:8},{wch:8},{wch:8},{wch:18},{wch:10},{wch:14},{wch:14},{wch:18}];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '全量明细');
    var d = new Date();
    var fn = '云端全量明细_' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '_' + ALL.length + '条.xlsx';
    XLSX.writeFile(wb, fn);
    log('✅ 已导出 ' + fn);
  }

  function load(){
    if (!window.cloud) { alert('cloud_sync.js 未加载'); return; }
    cloud.requireLogin(function(){
      refreshLoginStat();
      log('✅ 登录成功，开始拉取云端 tuoke_records ...');
      $('btnLoad').disabled = true;
      $('btnLoad').textContent = '📥 拉取中...';
      cloud.download().then(function(res){
        ALL = (res && res.list) || [];
        log('✅ 已拉取 '+ ALL.length +' 条云端记录');
        AGG = aggregate(ALL);
        log('✅ 聚合完成，去重后客户数 '+ AGG.length);
        renderStat();
        renderTable();
        $('btnExport').disabled = false;
        $('btnExportRaw').disabled = false;
        $('btnLoad').disabled = false;
        $('btnLoad').textContent = '📥 重新拉取';
      }).catch(function(err){
        log('❌ 拉取失败: '+ (err && err.message || err));
        alert('拉取失败：'+ (err && err.message || err));
        $('btnLoad').disabled = false;
        $('btnLoad').textContent = '📥 拉取云端最新数据';
      });
    });
  }

  $('btnLoad').addEventListener('click', load);
  $('btnExport').addEventListener('click', exportAgg);
  $('btnExportRaw').addEventListener('click', exportRaw);
  $('btnLogout').addEventListener('click', function(){
    if (window.cloud) { cloud.logout(); }
    setTimeout(refreshLoginStat, 200);
    log('已退出云端');
  });
  $('fltSale').addEventListener('change', renderTable);
  $('fltKw').addEventListener('input', renderTable);

  setInterval(refreshLoginStat, 1500);
  refreshLoginStat();
  log('页面就绪。点击「拉取云端最新数据」开始。');
})();
</script>
</body>
</html>
