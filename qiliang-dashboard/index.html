*{margin:0;padding:0;box-sizing:border-box}

const DATA = RAW;
const TH = DATA.thresholds;   // [0.3,0.5,1,2,3]
const DU = DATA.durations;   // [1,3,7,14]
let curSeason = '夏季';
let selectedKey = null;

// 阈值键格式化：1.0 → "1.0"（JS 的 String(1.0)="1" 会与数据键 "1.0" 不匹配）
function thKey(t){ return Number(t).toFixed(1); }

// 颜色函数：根据数量返回颜色深浅
function cellColor(n, maxN) {
  if(n===0) return '#f1f5f9';
  const t = Math.min(n/maxN,1);
  // 从浅蓝到深蓝渐变
  const r=Math.round(255-(t*180));
  const g=Math.round(245-(t*130));
  const b=Math.round(254-(t*60));
  return `rgb(${r},${g},${b})`;
}

function textColor(bg){
  // 简单判断：亮背景用深字，暗背景用白字
  return bg.startsWith('rgb(2') || bg.startsWith('#f') ? '#1e293b' : '#ffffff';
}

// ============================================================
// 渲染矩阵
// ============================================================
function renderMatrix(){
  const grid = document.getElementById('matrixGrid');
  // 清空旧行，保留表头
  grid.innerHTML = `
    <div></div>
    ${DU.map(d=>`<div class="grid-label"><b>持续${d>=14?'':'>='}${d}天</b></div>`).join('')}
  `;
  
  const ms = DATA.matrix_summary[curSeason];
  let maxN = 0;
  for(let t of TH) for(let d of DU){ let n=(ms[thKey(t)]||{})[String(d)]||0; if(n>maxN) maxN=n; }
  
  for(const T of TH){
    // 行标签
    const labelEl = document.createElement('div');
    labelEl.className='grid-label';
    labelEl.innerHTML=`<b>日耗≥${T}万/天</b>`;
    grid.appendChild(labelEl);
    
    for(const D of DU){
      const n = (ms[thKey(T)]||{})[String(D)]||0;
      const cell = document.createElement('div');
      cell.className='grid-cell' + (n===0?' cell-empty':'');
      const bg = cellColor(n,maxN);
      const tc = textColor(bg);
      
      cell.style.background = bg;
      cell.style.color = tc;
      
      if(n>0){
        cell.innerHTML=`<span class="cell-count">${n}</span><span class="cell-sub">个商品</span>`;
      } else {
        cell.innerHTML=`<span class="cell-count">—</span>`;
      }
      
      cell.onclick = () => selectCell(T,D,n,bg,tc);
      if(selectedKey === `${T}_${D}_${curSeason}`) cell.classList.add('selected');
      
      grid.appendChild(cell);
    }
  }
  
  const sl = document.getElementById('seasonLabel');
  if(sl) sl.textContent = `— ${curSeason}`;
}

// ============================================================
// 点击格子 → 显示详情
// ============================================================
function selectCell(T,D,n,bgColor,textColorVal){
  selectedKey = `${T}_${D}_${curSeason}`;
  renderMatrix(); // 重绘以更新选中态
  
  const emptyState = document.getElementById('emptyState');
  const content = document.getElementById('detailContent');
  
  if(n === 0){
    emptyState.style.display='';
    content.style.display='none';
    return;
  }
  
  emptyState.style.display='none';
  content.style.display='';
  
  const p = DATA.profiles[curSeason][thKey(T)][`D${D}`];
  renderDetail(p,T,D,n,bgColor);
}

  let html = '';
  
  // ---- 标题 ----
  html += `<h2>📋 组合画像 · ${curSeason} | 日耗≥${T}万 × 持续≥${D}天</h2>`;
  html += `<div class="desc">${n} 个商品符合此标准 · 总消耗 ${p.total_spend_万||'—'} 万 · 中位ROI ${p.median_ROI||'—'} · 中位AOV ${p.median_AOV?Math.round(p.median_AOV)+'元':'—'}</div>`;
  
  // ---- 统计卡片 ----
  html += '<div class="stat-row">';
  const stats = [
    {val:n, label:'符合商品数'},
    {val:p.total_spend_万+'万'||'—', label:'总消耗'},
    {val:p.median_ROI||'—', label:'中位ROI'},
    {val:(p.median_AOV?Math.round(p.median_AOV):'—')+'元', label:'中位AOV'},
  ];
  for(const s of stats) html+=`<div class="stat-card"><div class="val">${s.val}</div><div class="label">${s.label}</div></div>`;
  html+='</div>';

  // ---- 模块②：vs 大盘基准对比 ----
  const base = (DATA.baseline||{})[curSeason] || {};
  if(base.median_AOV!==undefined){
    html+=`<div class="sec-title">📐 vs 大盘基准 <span style="font-size:10px;color:var(--sub);font-weight:400">（该组合 vs ${curSeason}全样本 ${base.count} 个商品）</span></div>`;
    const cmp=[
      {label:'中位AOV', cur:p.median_AOV, base:base.median_AOV, unit:'元', better:'high'},
      {label:'中位ROI', cur:p.median_ROI, base:base.median_ROI, unit:'', better:'high'},
      {label:'中位CTR', cur:p.median_CTR, base:base.median_CTR, unit:'%', better:'high'},
      {label:'7日退款', cur:p.median_7d退款, base:base.median_7d退款, unit:'%', better:'low'},
    ];
    html+='<div class="cmp-grid">';
    for(const c of cmp){
      if(c.cur===undefined||c.cur===null) continue;
      const diff = c.cur - c.base;
      const pct = c.base? (diff/c.base*100):0;
      const up = diff>=0;
      // better=high: 高于基准=好(绿) ; better=low: 低于基准=好(绿)
      const good = (c.better==='high') ? up : !up;
      const col = Math.abs(pct)<3 ? '#64748b' : (good? '#059669':'#dc2626');
      const arrow = Math.abs(pct)<3 ? '≈' : (up?'▲':'▼');
      const curV = c.unit==='元'? Math.round(c.cur) : c.cur;
      html+=`<div class="cmp-card">
        <div class="cmp-label">${c.label}</div>
        <div class="cmp-cur">${curV}${c.unit}</div>
        <div class="cmp-diff" style="color:${col}">${arrow} ${diff>=0?'+':''}${pct.toFixed(0)}%</div>
        <div class="cmp-base">大盘 ${c.unit==='元'?Math.round(c.base):c.base}${c.unit}</div>
      </div>`;
    }
    html+='</div>';
  }

  // ---- 模块①：商品明细下钻（可折叠）----
  const products = p.products || [];
  if(products.length>0){
    const pid = 'prod_'+T+'_'+D;
    html+=`<div class="wc-section">
      <div class="sec-title" onclick="toggleDetail(this,'${pid}')"><span class="arrow">▶</span>🔍 商品明细下钻（Top${products.length}，按消耗降序）</div>
      <div class="wc-detail-table" id="${pid}">
        <table class="kw-table prod-table"><thead><tr><th style="text-align:left">商品名</th><th>客户</th><th>消耗(万)</th><th>ROI</th><th>AOV</th><th>天数</th></tr></thead><tbody>`;
    for(const pr of products){
      html+=`<tr><td style="text-align:left" title="${pr.name}">${pr.name}</td><td>${pr.client}</td><td><b>${pr.spend}</b></td><td>${pr.roi}</td><td>${pr.aov?Math.round(pr.aov):'—'}</td><td>${pr.days}</td></tr>`;
    }
    html+='</tbody></table></div></div>';
  }
  
  // ---- 价格带分布 ----
  html+='<div class="sec-title">💰 客单价带分布';
  const pbBands = ['<50元','50–80元','80–150元','150–300元','300+元'];
  const pbColors=['#94a3b8','#67a3cc','#2563eb','#7c3aed','#dc2626'];
  html+='<div class="bar-chart">';
  for(let i=0;i<pbBands.length;i++){
    const cnt=priceBand[pbBands[i]]||0;
    const pct=cnt/totalPB*100;
    html+=`<div class="bar-row">
      <div class="bar-label">${pbBands[i]}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${pbColors[i]}">${cnt}</div></div>
      <div class="bar-pct">${pct.toFixed(1)}%</div></div>`;
  }
  html+='</div>';
  
  // ---- 双词云（材质 + 风格） ----
  const matKw = kwByDim['材质']||{};
  const styKw = kwByDim['风格/版型']||{};
  
  html+='<div class="dual-wc">';
  html+='<div>';
  html+=`<h4>🧵 材质关键词 (${Object.keys(matKw).length})</h4>`;
  html+=`<div class="wc-area" id="wc_mat"></div>`;
  html+='</div><div>';
  html+=`<h4>✨ 风格/版型关键词 (${Object.keys(styKw).length})</h4>`;
  html+=`<div class="wc-area" id="wc_style"></div>`;
  html+='</div></div>';
  
  // ---- 功效/品类（词云 + 折叠详情表） ----
  const fnKw = kwByDim['功效/功能']||{};
  const catKw = kwByDim['品类']||{};

  if(Object.keys(fnKw).length>0){
    const fnTotal=Object.values(fnKw).reduce((a,b)=>a+b,0)||1;
    const fnId = 'wc_fn_'+T+'_'+D;
    html+=`<div class="wc-section">
      <div class="sec-title" onclick="toggleDetail(this,'${fnId}_tbl')"><span class="arrow">▶</span>⚡ 功效/功能关键词</div>
      <div class="wc-area" id="${fnId}"></div>
      <div class="wc-detail-table" id="${fnId}_tbl">
        <table class="kw-table"><thead><tr><th>关键词</th><th>出现次数</th><th>占比</th></tr></thead><tbody>`;
    for(const[k,v] of Object.entries(fnKw).sort((a,b)=>b[1]-a[1])){
      html+=`<tr><td>${k}</td><td><span class="kw-val">${v}</span></td><td>${(v/fnTotal*100).toFixed(1)}%</td></tr>`;
    }
    html+='</tbody></table></div></div>';
  }

  if(Object.keys(catKw).length>0){
    const catTotal=Object.values(catKw).reduce((a,b)=>a+b,0)||1;
    const catId = 'wc_cat_'+T+'_'+D;
    html+=`<div class="wc-section">
      <div class="sec-title" onclick="toggleDetail(this,'${catId}_tbl')"><span class="arrow">▶</span>🏷️ 品类分布</div>
      <div class="wc-area" id="${catId}"></div>
      <div class="wc-detail-table" id="${catId}_tbl">
        <table class="kw-table"><thead><tr><th>品类</th><th>商品数</th><th>占比</th></tr></thead><tbody>`;
    for(const[k,v] of Object.entries(catKw).sort((a,b)=>b[1]-a[1])){
      html+=`<tr><td>${k}</td><td><span class="kw-val">${v}</span></td><td>${(v/catTotal*100).toFixed(1)}%</td></tr>`;
    }
    html+='</tbody></table></div></div>';
  }
  
  // ---- 客户集中度 ----
  if(clients.length>0){
    html+='<div class="sec-title">👥 Top 客户集中度</div>';
    html+='<div class="client-list">';
    for(const c of clients.slice(0,8)){
      html+=`<div class="client-item">
        <span class="client-name" title="${c.name}">${c.name}</span>
        <span class="client-stats">
          ${c.count}个 (${c.pct}%) · AOV ${c.median_AOV?'~'+Math.round(c.median_AOV):'?'} · ROI ${c.median_ROI||'?'}
        </span></div>`;
    }
    html+='</div>';
  }
  
  // ---- 渠道分布 ----
  if(channel['全域通']!==undefined){
    html+='<div class="sec-title">📡 渠道分布</div>';
    html+='<div class="channel-row">';
    const ytPct = channel['全域通%']||0;
    const fytPct = channel['非全域通%']||0;
    html+=`<span class="ch-label">全域通</span><div class="ch-bar" style="width:${ytPct}%;background:var(--pri)">全域通 ${channel['全域通']} (${ytPct}%)</div></div>`;
    html+='<div class="channel-row">';
    html+=`<span class="ch-label">非全域通</span><div class="ch-bar" style="width:${fytPct}%;background:var(--acc-orange)">非全域通 ${channel['非全域通']} (${fytPct}%)</div></div>`;
  }
  
  // ---- 更多统计 ----
  html+='<div class="sec-title">📈 其他指标</div>';
  html+='<div class="stat-row" style="grid-template-columns:repeat(3,1fr)">';
  const extraStats=[
    {val:p.median_CTR?p.median_CTR.toFixed(2)+'%':'—', label:'中位CTR'},
    {val:p.median_7d退款?p.median_7d退款.toFixed(1)+'%':'—', label:'中位7d退款率'},
    {val:p.avg_days_active?p.avg_days_active.toFixed(1)+'天':'—', label:'平均活跃天数'},
  ];
  for(const s of extraStats) html+=`<div class="stat-card"><div class="val">${s.val}</div><div class="label">${s.label}</div></div>`;
  html+='</div>';
  
  document.getElementById('detailContent').innerHTML = html;
  
  // 渲染词云（延迟执行等 DOM 就绪）
  requestAnimationFrame(()=>{
    renderWordCloud('wc_mat', matKw, maxKw);
    renderWordCloud('wc_style', styKw, maxKw);
    // 功效/品类也用词云展示
    if(Object.keys(fnKw).length>0) renderWordCloud('wc_fn_'+T+'_'+D, fnKw, maxKw);
    if(Object.keys(catKw).length>0) renderWordCloud('wc_cat_'+T+'_'+D, catKw, maxKw);
  });
}

function renderWordCloud(containerId, kwData, maxV){
  const el=document.getElementById(containerId);
  if(!el){ return; }
  if(Object.keys(kwData).length===0){
    el.innerHTML='<div class="wc-placeholder">暂无数据</div>';
    return;
  }
  // 转换为 wordcloud2 格式: [word, weight]
  const list=[];
  for(const[k,v] of Object.entries(kwData)){
    list.push([k, Math.max(v, 3)]);
  }
  // 降级方案：词云库不可用 → 用彩色 chip 展示
  if(typeof WordCloud !== 'function'){
    let chips='';
    for(const[k,v] of list.sort((a,b)=>b[1]-a[1])){
      const fs=Math.max(14, Math.min(38, 14+v/maxV*24));
      const t=Math.min(v/maxV,1);
      const col=t>0.7?'#065f46':(t>0.5?'#0d9488':(t>0.3?'#14b8a6':'#5eead4'));
      chips+=`<span style="display:inline-block;margin:4px 6px;font-size:${fs}px;color:${col};font-weight:${t>0.5?700:500};line-height:1.4">${k}</span>`;
    }
    el.innerHTML='<div style="padding:20px 12px;line-height:2.2;text-align:center">'+chips+'</div>';
    return;
  }
  try{
    WordCloud(el.querySelector('canvas') || (()=>{
      const c=document.createElement('canvas');el.innerHTML='';el.appendChild(c);return c;
    })(), {
      list:list,
      gridSize:5,
      weightFactor: function(size){ return Math.max(size*2.8, 18); },
      fontFamily: '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif',
      color: function(word, weight, fontSize, distance, theta){
        const t = Math.min(weight/maxV, 1);
        // 丰富的渐变色板：深色高频 → 中色中频 → 浅色低频
        if(t > 0.7) return '#065f46';
        if(t > 0.5) return '#0d9488';
        if(t > 0.3) return '#14b8a6';
        if(t > 0.15) return '#2dd4bf';
        return '#99f6e4';
      },
      rotateRatio: 0.12,
      backgroundColor: 'transparent',
      drawOutOfBound:false,
      shrinkToFit:true,
      minSize: 14,
    });
  }catch(e){
    el.innerHTML='<div class="wc-placeholder">词云渲染失败：'+e.message+'</div>';
  }
}

// ============================================================
// 切换季节
// ============================================================
function switchSeason(btn,s){
  curSeason=s;
  selectedKey=null;
  // 更新 tab 样式
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderMatrix();
  // 清除右侧
  document.getElementById('emptyState').style.display='';
  document.getElementById('detailContent').style.display='none';
}

// ============================================================
// 折叠/展开详情表（功效/品类）
// ============================================================
function toggleDetail(titleEl, tableId){
  const arrow = titleEl.querySelector('.arrow');
  const tbl = document.getElementById(tableId);
  if(!tbl) return;
  const isOpen = tbl.classList.contains('open');
  if(isOpen){
    tbl.classList.remove('open');
    arrow.classList.remove('open');
  } else {
    tbl.classList.add('open');
    arrow.classList.add('open');
  }
}

// ============================================================
// 模块③：月度起量趋势图
// ============================================================
function renderTrend(){
  const trend = DATA.trend || [];
  const el = document.getElementById('trendChart');
  if(!el || trend.length===0) return;
  const maxV = Math.max(...trend.map(t=>t.count), 1);
  let bars='';
  for(const t of trend){
    const h = t.count/maxV*100;
    const col = t.season==='夏季' ? '#f59e0b' : '#2563eb';
    const mLabel = t.month.replace('-','.').slice(2); // 25.10
    bars += `<div class="tb-col" title="${t.month} · ${t.season} · ${t.count}个起量商品">
      <div class="tb-val">${t.count||''}</div>
      <div class="tb-bar" style="height:${Math.max(h,2)}%;background:${col}"></div>
      <div class="tb-x">${mLabel}</div>
    </div>`;
  }
  el.innerHTML = `<div class="tb-wrap">${bars}</div>
    <div class="tb-legend"><span><i style="background:#f59e0b"></i>夏季(7-9月)</span><span><i style="background:#2563eb"></i>秋冬(10-次年6月)</span></div>`;
  // 洞察
  const peak = trend.reduce((a,b)=>b.count>a.count?b:a, trend[0]);
  const total = trend.reduce((a,b)=>a+b.count,0);
  const top3 = [...trend].sort((a,b)=>b.count-a.count).slice(0,3);
  const top3share = Math.round(top3.reduce((a,b)=>a+b.count,0)/total*100);
  document.getElementById('trendInsight').innerHTML =
    `共 <b>${total}</b> 个持续型起量商品，峰值月 <b>${peak.month}</b>（${peak.count}个）；` +
    `Top3 月份占 <b>${top3share}%</b> → ${top3share>=55?'<b style="color:#dc2626">集中爆发型</b>（秋冬换季扎堆起量）':'<b style="color:#059669">细水长流型</b>（全年较均匀）'}。`;
}

// ============================================================
// 模块④：品类 × 季节 起量热力图
// ============================================================
function renderHeatmap(){
  const cs = DATA.cat_season || {};
  const el = document.getElementById('heatMap');
  if(!el) return;
  const cats = Object.keys(cs);
  let maxV = 1;
  for(const c of cats){ maxV = Math.max(maxV, cs[c]['夏季'], cs[c]['秋冬']); }
  function hcell(v){
    if(v===0) return '#f1f5f9';
    const t = Math.min(v/maxV,1);
    const r=Math.round(255-t*(255-220));
    const g=Math.round(245-t*(245-38));
    const b=Math.round(238-t*(238-38));
    return `rgb(${r},${g},${b})`;
  }
  function tcol(v){ return v/maxV>0.5?'#fff':'#7f1d1d'; }
  let rows = `<div class="hm-row hm-head"><div class="hm-cat">品类</div><div class="hm-c">☀️夏季</div><div class="hm-c">🍂秋冬</div><div class="hm-c hm-total">合计</div></div>`;
  for(const c of cats){
    const s=cs[c]['夏季'], w=cs[c]['秋冬'], tot=cs[c]['合计'];
    rows += `<div class="hm-row">
      <div class="hm-cat">${c}</div>
      <div class="hm-c" style="background:${hcell(s)};color:${tcol(s)}">${s||'·'}</div>
      <div class="hm-c" style="background:${hcell(w)};color:${tcol(w)}">${w||'·'}</div>
      <div class="hm-c hm-total">${tot}</div>
    </div>`;
  }
  el.innerHTML = rows;
  // 洞察
  const withData = cats.filter(c=>cs[c]['合计']>0);
  const topCat = withData[0];
  const summerCats = withData.filter(c=>cs[c]['夏季']>cs[c]['秋冬']);
  const winterCats = withData.filter(c=>cs[c]['秋冬']>cs[c]['夏季']);
  document.getElementById('heatInsight').innerHTML =
    `起量最集中品类：<b>${topCat}</b>（${cs[topCat]['合计']}个）；` +
    `秋冬更强：<b>${winterCats.slice(0,3).join('、')||'—'}</b>；` +
    `夏季更强：<b>${summerCats.slice(0,3).join('、')||'—'}</b>。`;
}

// ============================================================
// 初始化
// ============================================================
renderMatrix();
renderTrend();
renderHeatmap();
</script>
