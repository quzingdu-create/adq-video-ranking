<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌊 海边团建 · 房间抽签</title>
<style>
  :root{
    /* 海边度假配色：沙滩米 + 海水青 + 天空蓝 */
    --bg:#EAF6F6; --bg2:#D8EEF0; --sand:#FBF3E0; --card:#FFFFFF; --line:rgba(20,90,110,.14);
    --text:#123A44; --text2:#4A7580; --text3:#8FB0B8;
    --m:#1E7FB5; --m-bg:#E4F2FA; --f:#C86B9E; --f-bg:#FBEAF3;
    --sea:#0FA6A6; --sea2:#5FD0C8; --deep:#0B6E86; --coral:#FF8C69; --sun:#FFC94D;
    --ok:#2E9E7E; --warn:#E0894A;
    --shadow:0 10px 34px rgba(15,110,134,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 460px at 15% -8%, #CFF0EC 0%, transparent 62%),
      radial-gradient(900px 420px at 92% -4%, #DCEFFB 0%, transparent 58%),
      linear-gradient(180deg, #EAF8F6 0%, #E3F4F2 40%, #EAF6F6 100%);
    color:var(--text); min-height:100vh; overflow-x:hidden; position:relative;
  }
  /* 顶部海浪装饰 */
  .sea-top{position:fixed;top:0;left:0;right:0;height:120px;z-index:0;pointer-events:none;overflow:hidden;}
  .sea-top svg{width:100%;height:100%;}
  /* 底部沙滩波浪 */
  .sea-bottom{position:fixed;bottom:0;left:0;right:0;height:90px;z-index:0;pointer-events:none;}
  .sea-bottom svg{width:100%;height:100%;display:block;}
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 110px;position:relative;z-index:1;}

  header{text-align:center;padding:14px 0 8px;}
  .kicker{font-size:12px;letter-spacing:4px;color:var(--sea);font-weight:800;}
  h1{font-size:28px;margin:8px 0 8px;letter-spacing:1px;
     background:linear-gradient(115deg,#0FA6A6 0%,#1E7FB5 55%,#0B6E86 100%);
     -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  h1 .wave{-webkit-text-fill-color:initial;}
  .sub{font-size:13px;color:var(--text2);line-height:1.75;margin:0 auto;max-width:430px;}
  .prog{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:16px;font-size:12px;color:var(--text2);}
  .prog .bar{flex:1;max-width:190px;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;}
  .prog .bar i{display:block;height:100%;width:0;border-radius:99px;
     background:linear-gradient(90deg,var(--sea2),var(--sea));transition:width .7s cubic-bezier(.4,1.2,.5,1);}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:20px 18px;margin-top:16px;box-shadow:var(--shadow);animation:rise .5s cubic-bezier(.2,.8,.3,1);}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .hide{display:none!important;}
  .ptitle{font-size:13px;color:var(--sea);margin-bottom:14px;font-weight:700;letter-spacing:1px;}

  /* chips */
  .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 8px;
    cursor:pointer;text-align:center;transition:.16s;min-height:56px;display:flex;flex-direction:column;
    justify-content:center;gap:2px;position:relative;overflow:hidden;}
  .chip:active{transform:scale(.95);}
  .chip .nm{font-size:15px;font-weight:700;}
  .chip .en{font-size:10px;color:var(--text3);}
  .chip.m{background:var(--m-bg);border-color:#BEE0F3;} .chip.m .nm{color:var(--m);}
  .chip.f{background:var(--f-bg);border-color:#F3CFE3;} .chip.f .nm{color:var(--f);}
  .chip[disabled]{opacity:.4;filter:grayscale(.5);cursor:not-allowed;}
  .chip .done{position:absolute;top:3px;right:5px;font-size:11px;}

  /* confirm */
  .cfname{font-size:30px;font-weight:800;text-align:center;margin:6px 0;letter-spacing:1px;}
  .cfsub{text-align:center;color:var(--text2);font-size:13px;margin-bottom:16px;}
  .ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  button.primary,button{font-family:inherit;font-size:15px;border-radius:13px;cursor:pointer;
    padding:12px 22px;border:1.5px solid var(--line);background:#fff;color:var(--text);transition:.16s;min-height:46px;font-weight:600;}
  button:active{transform:scale(.96);}
  button.primary{background:linear-gradient(120deg,var(--sea),var(--deep));color:#fff;border:none;
    box-shadow:0 8px 20px rgba(15,166,166,.34);}

  /* 抽签：漂流瓶/贝壳 */
  .rollstage{text-align:center;padding:14px 0 6px;}
  .chest{font-size:78px;line-height:1;display:inline-block;animation:bob 1.1s ease-in-out infinite;filter:drop-shadow(0 10px 16px rgba(15,110,134,.25));}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-12px) rotate(7deg)}}
  .rollnum{font-size:56px;font-weight:800;letter-spacing:3px;margin:10px 0 4px;
    background:linear-gradient(120deg,var(--sea),var(--m));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    font-variant-numeric:tabular-nums;min-height:64px;}
  .rolltip{color:var(--text2);font-size:14px;letter-spacing:1px;}
  .dots span{display:inline-block;animation:blink 1.2s infinite;}
  .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

  /* 结果 */
  .rband{text-align:center;font-size:13px;color:var(--sea);font-weight:800;letter-spacing:2px;margin-bottom:6px;}
  .rno{font-size:66px;font-weight:900;text-align:center;letter-spacing:2px;line-height:1.05;
    background:linear-gradient(120deg,var(--sea),var(--deep));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .rno.pop{animation:pop .6s cubic-bezier(.2,1.6,.3,1);}
  @keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .rmeta{text-align:center;font-size:15px;color:var(--text);margin:8px 0 4px;font-weight:600;}
  .rtag{text-align:center;margin:8px 0;}
  .tag{display:inline-block;font-size:12px;padding:4px 12px;border-radius:99px;font-weight:700;}
  .tag.m{background:var(--m-bg);color:var(--m);} .tag.f{background:var(--f-bg);color:var(--f);}
  .mates{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;}
  .mates .k{font-size:12px;color:var(--text3);margin-bottom:8px;text-align:center;letter-spacing:1px;}
  .matelist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .mate{background:var(--bg2);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;
    opacity:0;transform:translateY(8px);animation:matein .5s forwards;}
  .mate u{font-style:normal;text-decoration:none;color:var(--text3);font-size:11px;margin-left:5px;}
  .mate.solo{color:var(--text2);font-weight:500;}
  @keyframes matein{to{opacity:1;transform:none}}
  .locknote{margin-top:16px;text-align:center;font-size:12px;color:var(--text3);
    background:var(--bg2);border-radius:12px;padding:9px;}

  /* 名单 */
  .rosterbtn{margin-top:16px;}
  #sRoster .floor{margin-top:14px;}
  .floor h3{font-size:13px;color:var(--sea);margin:0 0 8px;letter-spacing:2px;border-left:3px solid var(--sea2);padding-left:8px;}
  .room{border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;background:#fff;}
  .room.m{background:var(--m-bg);border-color:#BEE0F3;}
  .room.f{background:var(--f-bg);border-color:#F3CFE3;}
  .room .rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .room .no{font-size:16px;font-weight:800;}
  .room .bd{font-size:11px;color:var(--text3);}
  .room .ppl{margin-top:6px;font-size:14px;line-height:1.7;}
  .room .cap{font-size:11px;color:var(--text3);margin-left:4px;}
  .rosterhint{font-size:12px;color:var(--text3);margin-bottom:6px;}

  .foot{text-align:center;margin-top:26px;font-size:11px;color:var(--text3);}
  .adminlink{color:var(--text3);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}

  /* 彩带（海洋色）*/
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:99;}
</style>
</head>
<body>
<!-- 顶部海浪 -->
<div class="sea-top">
  <svg viewBox="0 0 560 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,60 C120,90 200,20 300,50 C400,80 480,30 560,55 L560,0 L0,0 Z" fill="#BFEAE6" opacity="0.55"/>
    <path d="M0,80 C130,50 210,100 320,70 C430,42 500,88 560,68 L560,0 L0,0 Z" fill="#9FE0DA" opacity="0.4"/>
  </svg>
</div>
<canvas id="confetti"></canvas>
<div class="wrap">
  <header>
    <div class="kicker">🌊 SEASIDE · 海边团建之旅 🐚</div>
    <h1>房间抽签 <span class="wave">⛱️</span></h1>
    <div class="sub">选出你的名字，抽一间面朝大海的房间与室友。<br>祝你抽到心动的那一间 🌅</div>
    <div class="prog">
      <span>已抽 <b id="pDone">0</b> / <b id="pTotal">–</b></span>
      <span class="bar"><i id="pBar"></i></span>
    </div>
  </header>

  <!-- 1 选身份 -->
  <section class="panel" id="sPick">
    <div class="ptitle">① 我是</div>
    <div class="chips" id="chips"></div>
  </section>

  <!-- 2 确认 -->
  <section class="panel hide" id="sConfirm">
    <div class="ptitle">② 确认一下</div>
    <div class="cfname" id="cfName">—</div>
    <div class="cfsub">确认是你本人？抽完就定啦～</div>
    <div class="ctrl">
      <button class="primary" id="btnGo">🐚 就是我，开抽！</button>
      <button id="btnBack">选错了</button>
    </div>
  </section>

  <!-- 3 抽签中 -->
  <section class="panel hide" id="sRoll">
    <div class="ptitle">③ 抛出漂流瓶…</div>
    <div class="rollstage">
      <div class="chest" id="chest">🍾</div>
      <div class="rollnum" id="rollNum">···</div>
      <div class="rolltip">海浪正在为你挑房间<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
  </section>

  <!-- 4 结果 -->
  <section class="panel hide" id="sResult">
    <div class="rband">🏖️ 你的海景房 🏖️</div>
    <div class="rno" id="rNo">—</div>
    <div class="rmeta" id="rMeta"></div>
    <div class="rtag" id="rTag"></div>
    <div class="mates">
      <div class="k" id="mateK">同住室友</div>
      <div class="matelist" id="rMates"></div>
    </div>
    <div class="ctrl rosterbtn">
      <button class="primary" id="btnRoster">查看已入住名单</button>
    </div>
    <div class="locknote" id="lockNote"></div>
  </section>

  <!-- 5 名单 -->
  <section class="panel hide" id="sRoster">
    <div class="ptitle">🗺️ 已入住名单</div>
    <div class="rosterhint" id="rosterHint"></div>
    <div id="rosterBox"></div>
  </section>

  <div class="foot">
    <span class="adminlink" id="adminLink">管理</span>　·　🌴 祝大家玩得开心 🌴
  </div>
</div>

<!-- 底部沙滩 -->
<div class="sea-bottom">
  <svg viewBox="0 0 560 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,40 C120,10 220,60 320,35 C420,12 500,55 560,32 L560,90 L0,90 Z" fill="#9FE0DA" opacity="0.45"/>
    <path d="M0,58 C130,32 230,72 340,52 C440,34 510,70 560,54 L560,90 L0,90 Z" fill="#7FD3CC" opacity="0.5"/>
    <path d="M0,74 C140,58 240,86 360,70 C450,58 520,82 560,72 L560,90 L0,90 Z" fill="#F6E7C6" opacity="0.7"/>
  </svg>
</div>

<script>
/* ====== 锁定方案（构建时写入，全体访客一致）====== */
const PLAN = [{"no":"201","floor":"二楼","bed":"1.2米床(海景)","cap":3,"need":2,"group":"女","residents":[{"name":"赵雪晴","en":"grettazhao","g":"女"},{"name":"陈小美","en":"ivyxmchen","g":"女"}]},{"no":"202","floor":"二楼","bed":"1.2米床(海景)","cap":3,"need":3,"group":"男","residents":[{"name":"王俊昊","en":"johnsywang","g":"男"},{"name":"周宇航","en":"dariuszhou","g":"男"},{"name":"吴立军","en":"lijunwu","g":"男"}]},{"no":"203","floor":"二楼","bed":"1.2米床","cap":2,"need":2,"group":"女","residents":[{"name":"金洁","en":"kinsleyjin","g":"女"},{"name":"关惠文","en":"stellaguan","g":"女"}]},{"no":"204","floor":"二楼","bed":"2米床(麻将)","cap":1,"need":1,"group":"女","residents":[{"name":"詹蕊伶","en":"ruilingzhan","g":"女"}]},{"no":"301","floor":"三楼","bed":"1.2米床(海景)","cap":3,"need":3,"group":"女","residents":[{"name":"张玙瑶","en":"rickyozhang","g":"女"},{"name":"卢桂枝","en":"irisalu","g":"女"},{"name":"杜子青","en":"ziqingdu","g":"女"}]},{"no":"302","floor":"三楼","bed":"1.2米床(海景)","cap":3,"need":3,"group":"男","residents":[{"name":"益博文","en":"kevinbwyi","g":"男"},{"name":"樊志权","en":"brownfan","g":"男"},{"name":"谢嘉润","en":"jaronxie","g":"男"}]},{"no":"303","floor":"三楼","bed":"1.8米床(海景)","cap":1,"need":1,"group":"女","residents":[{"name":"陈燕","en":"yvaineechen","g":"女"}]},{"no":"304","floor":"三楼","bed":"1.5米床","cap":1,"need":1,"group":"男","residents":[{"name":"林嘉淇","en":"xiaobilin","g":"男"}]},{"no":"305","floor":"三楼","bed":"1.5米床","cap":1,"need":1,"group":"男","residents":[{"name":"李海友","en":"haiyouli","g":"男"}]},{"no":"306","floor":"三楼","bed":"1.8米床","cap":1,"need":1,"group":"女","residents":[{"name":"姚敏琦","en":"meganyao","g":"女"}]},{"no":"307","floor":"三楼","bed":"1.8米床","cap":1,"need":1,"group":"女","residents":[{"name":"朱姿宣","en":"jaquelynzhu","g":"女"}]},{"no":"308","floor":"三楼","bed":"1.8米床","cap":1,"need":1,"group":"女","residents":[{"name":"彭露媛","en":"lululypeng","g":"女"}]},{"no":"309","floor":"三楼","bed":"2米床","cap":2,"need":2,"group":"男","residents":[{"name":"赵映杰","en":"jasperzhao","g":"男"},{"name":"李根","en":"kaikaigenli","g":"男"}]},{"no":"401","floor":"四楼","bed":"2.3米床(海景)","cap":1,"need":1,"group":"男","residents":[{"name":"杜文战","en":"sevendu","g":"男"}]},{"no":"402","floor":"四楼","bed":"1.8米床+1.2米床(海景)","cap":2,"need":2,"group":"男","residents":[{"name":"朱仲秋","en":"jonzhu","g":"男"},{"name":"黄麒文","en":"harvihuang","g":"男"}]},{"no":"403","floor":"四楼","bed":"1.8米床(侧海景)","cap":1,"need":1,"group":"男","residents":[{"name":"陈冠宏","en":"edcchen","g":"男"}]},{"no":"404","floor":"四楼","bed":"1.5米床","cap":1,"need":1,"group":"女","residents":[{"name":"潘佳鑫","en":"echopan","g":"女"}]}];
const PEOPLE = [{"name":"杜文战","en":"sevendu","g":"男"},{"name":"陈冠宏","en":"edcchen","g":"男"},{"name":"李海友","en":"haiyouli","g":"男"},{"name":"谢嘉润","en":"jaronxie","g":"男"},{"name":"王俊昊","en":"johnsywang","g":"男"},{"name":"林嘉淇","en":"xiaobilin","g":"男"},{"name":"朱仲秋","en":"jonzhu","g":"男"},{"name":"李根","en":"kaikaigenli","g":"男"},{"name":"吴立军","en":"lijunwu","g":"男"},{"name":"樊志权","en":"brownfan","g":"男"},{"name":"周宇航","en":"dariuszhou","g":"男"},{"name":"赵映杰","en":"jasperzhao","g":"男"},{"name":"益博文","en":"kevinbwyi","g":"男"},{"name":"黄麒文","en":"harvihuang","g":"男"},{"name":"陈小美","en":"ivyxmchen","g":"女"},{"name":"姚敏琦","en":"meganyao","g":"女"},{"name":"张玙瑶","en":"rickyozhang","g":"女"},{"name":"杜子青","en":"ziqingdu","g":"女"},{"name":"金洁","en":"kinsleyjin","g":"女"},{"name":"詹蕊伶","en":"ruilingzhan","g":"女"},{"name":"赵雪晴","en":"grettazhao","g":"女"},{"name":"陈燕","en":"yvaineechen","g":"女"},{"name":"潘佳鑫","en":"echopan","g":"女"},{"name":"卢桂枝","en":"irisalu","g":"女"},{"name":"朱姿宣","en":"jaquelynzhu","g":"女"},{"name":"彭露媛","en":"lululypeng","g":"女"},{"name":"关惠文","en":"stellaguan","g":"女"}];

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ====== 本地进度（仅本设备记录已抽的人 + 自己的锁定结果）====== */
const LS_DONE = 'roomLotterySea_done_v2';
const LS_LOCK = 'roomLotterySea_lock_v2';
function getDone(){ try{return JSON.parse(localStorage.getItem(LS_DONE)||'[]');}catch(e){return[];} }
function addDone(en){ const s=new Set(getDone()); s.add(en); localStorage.setItem(LS_DONE, JSON.stringify([...s])); }
function getLock(){ try{return JSON.parse(localStorage.getItem(LS_LOCK)||'null');}catch(e){return null;} }
function setLock(o){ localStorage.setItem(LS_LOCK, JSON.stringify(o)); }

function roomOf(en){ for(const r of PLAN){ if(r.residents.some(p=>p.en===en)) return r; } return null; }

let CUR = null;

function refreshProg(){
  const done = getDone().length;
  $('pTotal').textContent = PEOPLE.length;
  $('pDone').textContent = done;
  $('pBar').style.width = (done/PEOPLE.length*100)+'%';
}

/* ---------- 选身份 ---------- */
function renderChips(){
  const done = new Set(getDone());
  $('chips').innerHTML = PEOPLE.map(p=>{
    const cls = p.g==='男'?'m':'f';
    const d = done.has(p.en);
    return '<button class="chip '+cls+'" data-e="'+p.en+'"'+(d?' disabled':'')+'>'
      + '<span class="nm">'+p.name+'</span><span class="en">'+p.en+'</span>'
      + (d?'<span class="done">🐚</span>':'') + '</button>';
  }).join('');
  $('chips').querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{
      const p = PEOPLE.find(x=>x.en===el.dataset.e);
      CUR = p;
      $('cfName').textContent = p.name + '（' + p.en + '）';
      show('sConfirm');
      $('sConfirm').scrollIntoView({behavior:'smooth',block:'center'});
    };
  });
}

function show(id){
  ['sPick','sConfirm','sRoll','sResult'].forEach(x=>$(x).classList.toggle('hide', x!==id));
}

/* ---------- 抽签动画 ---------- */
$('btnBack').onclick = ()=>show('sPick');

$('btnGo').onclick = async ()=>{
  if(!CUR) return;
  const room = roomOf(CUR.en);
  if(!room){ alert('名单里找不到你，请联系管理员'); return; }

  $('btnGo').disabled = true;
  show('sRoll');
  $('sRoll').scrollIntoView({behavior:'smooth',block:'center'});

  const nos = PLAN.map(r=>r.no);
  const timer = setInterval(()=>{
    $('rollNum').textContent = nos[Math.floor(Math.random()*nos.length)];
  }, 65);

  await sleep(1600);
  $('chest').textContent = '🏖️';
  clearInterval(timer);
  $('rollNum').textContent = room.no;
  await sleep(500);

  addDone(CUR.en);
  setLock({en:CUR.en, name:CUR.name});
  $('btnGo').disabled = false;

  showResult(CUR.en, {celebrate:true});
};

/* ---------- 展示结果 ---------- */
function showResult(en, opt={}){
  const p = PEOPLE.find(x=>x.en===en);
  const room = roomOf(en);
  $('rNo').textContent = room.no;
  $('rNo').classList.remove('pop'); void $('rNo').offsetWidth; $('rNo').classList.add('pop');

  const loose = room.need < room.cap;
  $('rMeta').textContent = room.floor + ' · ' + room.bed
    + '（' + (room.cap===1 ? '单人房，独享一间' : (loose ? '住 '+room.need+' 人 / 可住 '+room.cap : '住满 '+room.cap+' 人')) + '）';
  $('rTag').innerHTML = '<span class="tag '+(p.g==='男'?'m':'f')+'">'+p.g+'生房</span>';

  const mates = room.residents.filter(x=>x.en!==en);
  if(mates.length){
    $('mateK').textContent = '同住室友（' + mates.length + '位）';
    $('rMates').innerHTML = mates.map((m,i)=>
      '<span class="mate" style="animation-delay:'+(0.15*(i+1))+'s">'+m.name+'<u>'+m.en+'</u></span>'
    ).join('');
  }else{
    $('mateK').textContent = '房间归属';
    $('rMates').innerHTML = '<span class="mate solo">🛏️ 单人房，独享一间，面朝大海～</span>';
  }
  $('lockNote').textContent = '本设备已锁定为「'+p.name+'」· 结果已保存';
  show('sResult');
  $('sResult').scrollIntoView({behavior:'smooth',block:'center'});
  if(opt.celebrate) confetti();
}

/* ---------- 已入住名单（只显示抽出来的人，没抽的房间不显示、不占位）---------- */
let rosterOpen = false;
$('btnRoster').onclick = ()=>{
  rosterOpen = !rosterOpen;
  $('sRoster').classList.toggle('hide', !rosterOpen);
  $('btnRoster').textContent = rosterOpen ? '收起名单' : '查看已入住名单';
  if(rosterOpen){ renderRoster(); $('sRoster').scrollIntoView({behavior:'smooth',block:'start'}); }
};
function renderRoster(){
  const done = new Set(getDone());
  // 只保留：房间里至少有一位已抽出的人；且房间内只列已抽出的人
  const floors = [...new Set(PLAN.map(r=>r.floor))];
  let shown = 0;
  let html = '';
  floors.forEach(fl=>{
    const rooms = PLAN.filter(r=>r.group && r.residents.some(m=>done.has(m.en)) && r.floor===fl);
    if(!rooms.length) return;
    html += '<div class="floor"><h3>'+fl+'</h3>';
    rooms.forEach(r=>{
      const drawn = r.residents.filter(m=>done.has(m.en));
      shown += drawn.length;
      const ppl = drawn.map(m=>'<b>'+m.name+'</b>').join('、');
      html += '<div class="room '+(r.group==='男'?'m':'f')+'">'
        + '<div class="rh"><span class="no">'+r.no+'</span>'
        + '<span class="bd">'+r.bed+'<span class="cap"> · '+r.group+'生房</span></span></div>'
        + '<div class="ppl">'+ppl+'</div></div>';
    });
    html += '</div>';
  });
  if(!shown){
    $('rosterHint').textContent = '还没有人抽签，快来当第一个 🏝️';
    $('rosterBox').innerHTML = '';
  }else{
    $('rosterHint').textContent = '已有 ' + done.size + ' 位小伙伴入住，剩下的等大家陆续抽出 ~';
    $('rosterBox').innerHTML = html;
  }
}

/* ---------- 管理（仅本地：重置本设备）---------- */
$('adminLink').onclick = ()=>{
  const k = prompt('管理口令：');
  if(k===null) return;
  if(k==='reset'){ localStorage.removeItem(LS_LOCK); location.reload(); }
  else if(k==='resetall'){ localStorage.removeItem(LS_LOCK); localStorage.removeItem(LS_DONE); location.reload(); }
  else{ alert('口令不对'); }
};

/* ---------- 彩带（海洋色）---------- */
function confetti(){
  const cv = $('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#0FA6A6','#5FD0C8','#1E7FB5','#FFC94D','#FF8C69','#7FD3CC'];
  const N = 130, parts = [];
  for(let i=0;i<N;i++){
    parts.push({
      x: innerWidth/2 + (Math.random()-.5)*120, y: innerHeight*0.35,
      vx: (Math.random()-.5)*11, vy: Math.random()*-13 - 4,
      g: .32 + Math.random()*.15, rot: Math.random()*6, vr: (Math.random()-.5)*.4,
      w: 7+Math.random()*6, h: 10+Math.random()*8, c: colors[i%colors.length], life: 0
    });
  }
  let raf;
  const draw = ()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = 0;
    parts.forEach(p=>{
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      if(p.y < cv.height+40){ alive++; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - p.life/150);
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if(alive>0){ raf = requestAnimationFrame(draw); }
    else{ ctx.clearRect(0,0,cv.width,cv.height); cancelAnimationFrame(raf); }
  };
  draw();
}

/* ---------- 启动 ---------- */
(function init(){
  refreshProg();
  renderChips();
  const lock = getLock();
  if(lock && roomOf(lock.en)){
    showResult(lock.en, {celebrate:false});
    $('sPick').classList.add('hide');
  }else{
    show('sPick');
  }
})();
</script>
